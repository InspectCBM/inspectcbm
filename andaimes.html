    // Compressor em tempo real de fotos para celulares (otimiza para ~60KB-90KB evitando limite de 1MB do Firestore)
    const compressImage = (file, maxWidth = 1000, quality = 0.65) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxWidth) {
                width = Math.round((width * maxWidth) / height);
                height = maxWidth;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    function App() {

      const [visitModalReqId, setVisitModalReqId] = useState(null);
      const [visitDimensions, setVisitDimensions] = useState({ width: '', length: '', height: '' });

      const [editDateModalReq, setEditDateModalReq] = useState(null);
      const [newDueDate, setNewDueDate] = useState('');

      const [autoReorderOnDateChange, setAutoReorderOnDateChange] = useState(true);

      const [photoModalReq, setPhotoModalReq] = useState(null);
      const [tempPhotoUrl, setTempPhotoUrl] = useState(null);
      const [isCompressingPhoto, setIsCompressingPhoto] = useState(false);
      const [isSavingMontado, setIsSavingMontado] = useState(false);

      const [cancelModalReq, setCancelModalReq] = useState(null);

          const dateB = b.dueDate || '9999-99-99';
          if (dateA !== dateB) return dateA.localeCompare(dateB);
          if (a.isUrgent !== b.isUrgent) return a.isUrgent ? -1 : 1;
          return (a.id || '').localeCompare(b.id || '');
        });

        inQueue.forEach((r, idx) => {
          r.queueOrder = idx + 1;
        });

        return [...inQueue, ...notInQueue];
      };

      // Solicitações ativas

          pemtJustification: '',
          responsible: 'Carlos Eduardo',

          email: 'carlos.eduardo@empresa.com',
          dueDate: '2026-11-05',
          isUrgent: true,

          width: 2,
          length: 4,
          height: 8,
          volumeM3: 64,
          realWidth: null,
          realLength: null,
          realHeight: null,
          realVolumeM3: null,
          status: 'Avaliação',
          photoUrl: null,

          history: [
            { date: '28/10/2026 08:30', user: 'Carlos Eduardo (Solicitante)', action: 'Solicitação Criada (Urgente)' }
          ]
        },
        {
          id: 'SOL-1002',
          factory: 'Fábrica 02 - Envase',
          area: 'Embalagem 02',
          reference: 'Linha de Potes',
          activityDescription: 'Reparo de cabeamento em esteira suspensa',
          canUsePEMT: 'SIM',
          pemtJustification: 'Local sem espaço para manobra do rodízio da PEMT',
          responsible: 'Mariana Luz',
          phone: '(41) 99123-4567',
          email: 'mariana.luz@empresa.com',
          dueDate: '2026-11-10',
          isUrgent: false,
          queueOrder: 2,
          width: 3,
          length: 3,
          height: 4,
          volumeM3: 36,
          realWidth: 3,
          realLength: 4,
          realHeight: 4,
          realVolumeM3: 48,
          status: 'Montado',
          photoUrl: null,
          createdAt: '28/10/2026 09:15',
          history: [
            { date: '28/10/2026 09:15', user: 'Mariana Luz (Solicitante)', action: 'Solicitação Criada' },
            { date: '28/10/2026 09:40', user: 'João Silva (Equipe de Andaimes)', action: 'Visita técnica realizada: Medida real 3x4x4m (48m³). Montagem iniciada.' },

      // Sincronização em tempo real com Firestore

          }
        }, (err) => {
          console.warn('Firestore offline:', err);
          setIsCloudConnected(false);
        });

        const unsubUsers = db.collection('andaimes_usuarios').onSnapshot((snapshot) => {
          if (!isMounted) return;
          if (!snapshot.empty) {

            snapshot.forEach(doc => {

        // 4. Escuta Indicadores Históricos Acumulados
        const unsubStats = db.collection('andaimes_config').doc('indicadores').onSnapshot((doc) => {
          if (!isMounted) return;
          if (doc.exists) {
            const data = doc.data();
            setStats({
              totalSolicitados: data.totalSolicitados || 0,
              totalMontados: data.totalMontados || 0,
              totalDesmontados: data.totalDesmontados || 0,
              totalCancelados: data.totalCancelados || 0

            db.collection('andaimes_config').doc('indicadores').set({
              totalSolicitados: 3,

        return () => {

      // Formulário Nova Solicitação
      const [formData, setFormData] = useState({

        reference: '',

        phone: '',

        length: '',

      // Volume em m³ em uso efetivo (montados)
      const allocatedM3 = requests
        .filter(r => r.status === 'Montado' || r.status === 'Liberado para Desmontagem')

        }, 0);
      
      const availableM3 = totalCapacityM3 - allocatedM3;

      const isGestor = currentUser?.role === 'Gestor de Andaimes';
      const isEquipe = currentUser?.role === 'Equipe de Andaimes';
      const isSolicitante = currentUser?.role === 'Solicitante (Área)';

      // Listas
      const queueRequests = requests

        .filter(r => ['Montado', 'Liberado para Desmontagem'].includes(r.status));

      const dismantledRequests = requests
        .filter(r => r.status === 'Desmontado');

          return;
        }

        if (newUser.role === 'Gestor de Andaimes') {
          if (newUser.password !== 'AUTOKRAFT01') {
            setLoginError('Senha de segurança incorreta para o perfil Gestor de Andaimes.');
            return;
          }
        } else if (newUser.role === 'Equipe de Andaimes') {

            return;
          }
        } else {

        const created = { id: String(Date.now()), ...newUser };

          await db.collection('andaimes_usuarios').doc(created.email.toLowerCase()).set(created);
        } catch (err) {
          console.warn('Erro ao salvar usuário no Firebase:', err);
        }

        setUsers([...users, created]);
        setCurrentUser(created);
        setIsAuthenticated(true);
        setNewUser({ name: '', email: '', password: '', role: 'Solicitante (Área)' });
      };

      // Gestor Excluir Login de Usuário
      const handleDeleteUser = async (userToDelete) => {
        if (!isGestor) return;
        if (userToDelete.email.toLowerCase() === currentUser.email.toLowerCase()) {
          alert('Você não pode excluir o seu próprio usuário logado no momento.');

        };

        try {
          // Salva no Firestore
          await db.collection('andaimes_solicitacoes').doc(newReq.id).set(newReq);

        const updatedList = sortQueueByDueDate([newReq, ...requests]);

        setFormData({

          phone: '',

      // Alteração de status normal

      const handleCompleteDismantle = async (reqId) => {
        const req = requests.find(r => r.id === reqId);
        if (!req) return;

        const confirmAction = window.confirm(`Confirmar a desmontagem e recolhimento do andaime ${req.id}?\n\nAs informações ativas serão liberadas da nuvem para economizar espaço e o andaime será computado no histórico de "Desmontados Concluídos".`);
        if (!confirmAction) return;

        // 1. Remove do estado local imediatamente
        setRequests(prev => prev.filter(r => r.id !== reqId));

        try {
          // 2. Incrementa contador de Desmontados Concluídos no Firebase
          await db.collection('andaimes_config').doc('indicadores').set({
            totalDesmontados: firebase.firestore.FieldValue.increment(1)
          }, { merge: true });

          // 3. Apaga da coleção ativa para liberar espaço na nuvem
          await db.collection('andaimes_solicitacoes').doc(reqId).delete();
          alert(`Andaime ${req.id} concluído! Espaço liberado na nuvem e somado ao indicador de Desmontados Concluídos.`);
        } catch (err) {
          console.error('Erro ao finalizar desmontagem:', err);
          alert('Erro ao comunicar com Firebase.');
        }
      };

      // AÇÃO ESPECIAL: GESTOR CANCELAR SOLICITAÇÃO
      const handleCancelRequestConfirm = async (e) => {
        e.preventDefault();
        if (!cancelModalReq) return;
        setIsCancelling(true);

        const reqId = cancelModalReq.id;

        // 1. Remove local
        setRequests(prev => prev.filter(r => r.id !== reqId));

        try {
          // 2. Incrementa indicador de Cancelados
          await db.collection('andaimes_config').doc('indicadores').set({
            totalCancelados: firebase.firestore.FieldValue.increment(1)
          }, { merge: true });

          // 3. Remove da nuvem para não ocupar fila nem espaço
          await db.collection('andaimes_solicitacoes').doc(reqId).delete();
        } catch (err) {
          console.error('Erro ao cancelar:', err);
        } finally {
          setIsCancelling(false);
          setCancelModalReq(null);
          setCancelReason('');
          alert(`Solicitação ${reqId} cancelada com sucesso.`);
        }
      };

      // Salvar Visita Técnica
      const handleSaveVisit = async (e) => {
        e.preventDefault();
        const w = Number(visitDimensions.width) || 0;
        const l = Number(visitDimensions.length) || 0;

          realLength: l,
          realHeight: h,
          realVolumeM3: realVol,
          status: 'Iniciado Montagem',
          history: newHistory
        } : r));

        try {
          await db.collection('andaimes_solicitacoes').doc(visitModalReqId).update({
            realWidth: w,
            realLength: l,
            realHeight: h,
            realVolumeM3: realVol,
            status: 'Iniciado Montagem',

        setVisitModalReqId(null);

      // Alterar Data Limite

        e.preventDefault();
        if (!editDateModalReq) return;

        const reqId = editDateModalReq.id;
        const oldDate = editDateModalReq.dueDate || 'Não definida';
        const reasonText = dateChangeReason.trim() ? ` Motivo: "${dateChangeReason.trim()}"` : '';

        const newHistoryItem = {
          date: new Date().toLocaleString('pt-BR'),
          user: `${currentUser.name} (${currentUser.role})`,
          action: `Data Limite alinhada: alterada de ${oldDate} para ${newDueDate}.${reasonText}`
        };

        let updatedList = requests.map(r => {
          if (r.id === reqId) {
            return {
              ...r,
              dueDate: newDueDate,
              history: [...r.history, newHistoryItem]
            };
          }
          return r;
        });

        if (autoReorderOnDateChange) {
          updatedList = sortQueueByDueDate(updatedList);
        }

        setRequests(updatedList);

        try {
          const targetUpdated = updatedList.find(r => r.id === reqId);
          await db.collection('andaimes_solicitacoes').doc(reqId).update({
            dueDate: newDueDate,
            queueOrder: targetUpdated.queueOrder || null,
            history: targetUpdated.history
          });

          if (autoReorderOnDateChange) {
            const batch = db.batch();
            updatedList.forEach(r => {
              if (r.queueOrder) {
                const ref = db.collection('andaimes_solicitacoes').doc(r.id);
                batch.update(ref, { queueOrder: r.queueOrder });
              }
            });
            await batch.commit();
          }
        } catch (err) {
          console.error('Erro ao atualizar data limite:', err);
        }

        setEditDateModalReq(null);
      };

      // Mover Item na Fila
      const moveQueueItem = async (reqId, direction) => {
        const queueStatuses = ['Avaliação', 'Iniciado Montagem', 'Em Movimentação'];
        const inQueue = requests.filter(r => queueStatuses.includes(r.status));
        const idx = inQueue.findIndex(r => r.id === reqId);
        if (idx === -1) return;

        if (direction === 'up' && idx > 0) {
          const temp = inQueue[idx];
          inQueue[idx] = inQueue[idx - 1];
          inQueue[idx - 1] = temp;
        } else if (direction === 'down' && idx < inQueue.length - 1) {
          const temp = inQueue[idx];
          inQueue[idx] = inQueue[idx + 1];
          inQueue[idx + 1] = temp;
        } else {
          return;
        }

        inQueue.forEach((item, index) => {
          item.queueOrder = index + 1;
        });

        const notInQueue = requests.filter(r => !queueStatuses.includes(r.status));
        const reordered = [...inQueue, ...notInQueue];
        setRequests(reordered);

        try {
          const batch = db.batch();
          inQueue.forEach(item => {
            const ref = db.collection('andaimes_solicitacoes').doc(item.id);
            batch.update(ref, { queueOrder: item.queueOrder });
          });
          await batch.commit();
        } catch (err) {
          console.warn('Erro ao persistir ordem da fila:', err);
        }
      };

      // Capacidade contratada
      const handleUpdateCapacity = async (val) => {
        setTotalCapacityM3(val);
        try {
          await db.collection('andaimes_config').doc('geral').set({ totalCapacityM3: val }, { merge: true });
        } catch (err) {
          console.warn(err);
        }
      };

      // --- TELA DE LOGIN / NOVO CADASTRO ---
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-md w-full space-y-6">
              <div className="text-center">
                <div className="inline-flex p-3 bg-blue-50 text-blue-600 rounded-xl mb-3">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                <h1 className="text-2xl font-black text-slate-800">Controle de Andaimes</h1>
                <p className="text-xs text-slate-500 mt-1">Autenticação com Controle de Perfis</p>
                <div className="mt-2 flex items-center justify-center gap-1.5 text-[11px] text-emerald-600 font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  Nuvem Firebase Conectada
                </div>
              </div>

              {loginError && (
                <div className="p-3 bg-red-50 text-red-700 text-xs rounded-lg border border-red-200 font-medium">
                  {loginError}
                </div>
              )}

              <div className="flex border-b border-slate-200 text-sm">
                <button 
                  onClick={() => { setLoginMode('select'); setLoginError(''); }}
                  className={`flex-1 py-2 font-semibold text-center border-b-2 ${loginMode === 'select' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                >
                  Entrar
                </button>
                <button 
                  onClick={() => { setLoginMode('register'); setLoginError(''); }}
                  className={`flex-1 py-2 font-semibold text-center border-b-2 ${loginMode === 'register' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                >
                  Novo Cadastro
                </button>
              </div>

              {loginMode === 'select' ? (
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Selecionar Usuário</label>
                    <select 
                      value={loginEmail} 
                      onChange={(e) => setLoginEmail(e.target.value)}
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 font-medium"
                    >
                      {users.map(u => (
                        <option key={u.id || u.email} value={u.email}>{u.name} — ({u.role})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Senha de Acesso</label>
                    <input 
                      type="password"
                      placeholder="Digite sua senha de acesso"
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm"
                      required
                    />
                  </div>

                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition text-sm">
                    Entrar no Sistema
                  </button>
                </form>
              ) : (
                <form onSubmit={handleRegisterAndLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome Completo</label>
                    <input 
                      type="text" 
                      placeholder="Ex: Roberto Alves" 
                      value={newUser.name} 
                      onChange={(e) => setNewUser({...newUser, name: e.target.value})} 
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm" 
                      required 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mail corporativo</label>
                    <input 
                      type="email" 
                      placeholder="usuario@empresa.com" 
                      value={newUser.email} 
                      onChange={(e) => setNewUser({...newUser, email: e.target.value})} 
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm" 
                      required 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Função / Perfil</label>
                    <select 
                      value={newUser.role} 
                      onChange={(e) => setNewUser({...newUser, role: e.target.value, password: ''})} 
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold text-slate-800"
                    >
                      <option value="Solicitante (Área)">Solicitante (Área)</option>
                      <option value="Equipe de Andaimes">Equipe de Andaimes</option>
                      <option value="Gestor de Andaimes">Gestor de Andaimes</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">
                      {newUser.role === 'Solicitante (Área)' 
                        ? 'Criar Senha de Acesso' 
                        : 'Senha de Segurança do Perfil'}
                    </label>
                    <input 
                      type="password" 
                      placeholder={
                        newUser.role === 'Solicitante (Área)'
                          ? 'Crie uma senha de acesso'
                          : 'Digite a senha do perfil autorizada'
                      } 
                      value={newUser.password} 
                      onChange={(e) => setNewUser({...newUser, password: e.target.value})} 
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm" 
                      required 
                    />
                    {newUser.role !== 'Solicitante (Área)' ? (
                      <p className="text-[11px] text-slate-500 mt-1.5">
                        Perfil restrito. Informe a senha de segurança corporativa correspondente.
                      </p>
                    ) : (
                      <p className="text-[11px] text-slate-500 mt-1.5">
                        Como solicitante da fábrica, você escolhe livremente sua senha pessoal.
                      </p>
                    )}
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-md transition text-sm">
                    Cadastrar e Salvar na Nuvem
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // Renderização do Card de Andaime
      const renderCard = (req) => {
        const isLate = req.status !== 'Desmontado' && req.dueDate && req.dueDate < todayStr;
        const hasReal = req.realVolumeM3 !== null && req.realVolumeM3 !== undefined;
        const isInQueue = ['Avaliação', 'Iniciado Montagem', 'Em Movimentação'].includes(req.status);

        return (
          <div key={req.id} className={`bg-white rounded-xl p-4 shadow-sm border ${req.isUrgent ? 'border-red-300 bg-red-50/20' : 'border-slate-200'} space-y-3`}>
            {/* Cabeçalho do Card */}
            <div className="flex justify-between items-start gap-2">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-bold text-sm text-slate-900">{req.id}</span>
                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700 max-w-[140px] truncate" title={req.factory}>
                  {req.factory}
                </span>
                
                {/* Posição na Fila */}
                {isInQueue && req.queueOrder && (
                  <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 shadow-sm flex items-center gap-1">
                    <span>#{req.queueOrder} na Fila</span>
                  </span>
                )}
                
                {req.isUrgent && (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-red-100 text-red-700 border border-red-200">URGENTE</span>
                )}
                {isLate && (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-red-600 text-white animate-pulse">ATRASADO</span>
                )}
              </div>

              {/* Botões de Subir e Descer na Fila */}
              {isInQueue && (isGestor || isEquipe) && (
                <div className="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                  <button 
                    onClick={() => moveQueueItem(req.id, 'up')}
                    title="Subir prioridade na fila"
                    className="p-1 hover:bg-white rounded text-slate-600 hover:text-blue-600 transition"
                  >
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 15l7-7 7 7"></path></svg>
                  </button>
                  <button 
                    onClick={() => moveQueueItem(req.id, 'down')}
                    title="Descer prioridade na fila"
                    className="p-1 hover:bg-white rounded text-slate-600 hover:text-blue-600 transition"
                  >
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7"></path></svg>
                  </button>
                </div>
              )}
            </div>

            {/* Informações da Atividade */}
            <div className="bg-blue-50/60 p-2.5 rounded-lg border border-blue-100 space-y-1">
              <p className="text-xs font-bold text-blue-900 flex items-center gap-1">
                <span>🔧</span> Atividade: <span className="font-medium text-slate-800">{req.activityDescription || 'Não descrita'}</span>
              </p>
              
              <div className="text-[11px] flex items-center gap-2 pt-0.5">
                <span className="text-slate-500 font-semibold">Uso de PEMT:</span>
                <span className={`px-2 py-0.2 rounded font-bold text-[10px] ${req.canUsePEMT === 'SIM' ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-slate-200 text-slate-700'}`}>
                  {req.canUsePEMT === 'SIM' ? 'Possível PEMT' : 'PEMT Não Aplicável'}
                </span>
              </div>
              {req.canUsePEMT === 'SIM' && req.pemtJustification && (
                <p className="text-[11px] text-amber-900 italic bg-amber-50 p-1.5 rounded border border-amber-200/60">
                  <span className="font-semibold not-italic">Justificativa Andaime:</span> {req.pemtJustification}
                </p>
              )}
            </div>

            {/* Dados do Local e Responsável */}
            <div className="text-xs text-slate-600 space-y-1">
              <p><span className="font-semibold text-slate-700">Área:</span> {req.area}</p>
              <p><span className="font-semibold text-slate-700">Ponto de Ref:</span> {req.reference}</p>
              <p><span className="font-semibold text-slate-700">Resp. Atividade:</span> {req.responsible} {req.phone ? `(${req.phone})` : ''}</p>
              <p><span className="font-semibold text-slate-700">E-mail:</span> {req.email || 'Não informado'}</p>
              
              <div className="flex items-center justify-between pt-1">
                <p className={isLate ? 'text-red-600 font-bold' : ''}>
                  <span className="font-semibold text-slate-700">Data Limite:</span> {req.dueDate || 'Não definida'}
                </p>
                {/* Gestor Alinhar Data */}
                {isGestor && (
                  <button 
                    onClick={() => openEditDateModal(req)}
                    className="text-[11px] text-blue-600 hover:text-blue-800 font-semibold underline flex items-center gap-1"
                  >
                    <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    Ajustar Data
                  </button>
                )}
              </div>
            </div>

            {/* Medições Estimadas e Reais */}
            <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-100 flex justify-between items-center text-xs">
              <div>
                <span className="text-[10px] text-slate-500 block uppercase font-medium">Estimado</span>
                <span className="font-semibold text-slate-800">{req.width}x{req.length}x{req.height}m ({req.volumeM3}m³)</span>
              </div>
              <div className="text-right">
                <span className="text-[10px] text-slate-500 block uppercase font-medium">Real (Visita)</span>
                {hasReal ? (
                  <span className="font-bold text-blue-600">{req.realWidth}x{req.realLength}x{req.realHeight}m ({req.realVolumeM3}m³)</span>
                ) : (
                  <span className="text-slate-400 italic">Pendente</span>
                )}
              </div>
            </div>

            {/* Foto registrada */}
            {req.photoUrl && (
              <div className="relative group rounded-lg overflow-hidden border border-slate-200">
                <img src={req.photoUrl} alt="Foto Andaime" className="w-full h-32 object-cover" />
                {(isEquipe || isGestor) && (
                  <button 
                    onClick={() => {
                      setPhotoModalReq(req);
                      setTempPhotoUrl(req.photoUrl);
                    }}
                    className="absolute bottom-2 right-2 bg-slate-900/80 hover:bg-slate-900 text-white text-[10px] px-2 py-1 rounded shadow flex items-center gap-1"
                  >
                    <span>📷 Alterar Foto</span>
                  </button>
                )}
              </div>
            )}

            {/* Status e Ações */}
            <div className="flex items-center justify-between pt-2 border-t border-slate-100 flex-wrap gap-2">
              <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${
                req.status === 'Avaliação' ? 'bg-amber-100 text-amber-800' :
                req.status === 'Iniciado Montagem' ? 'bg-blue-100 text-blue-800' :
                req.status === 'Em Movimentação' ? 'bg-indigo-100 text-indigo-800' :
                req.status === 'Montado' ? 'bg-emerald-100 text-emerald-800' :
                req.status === 'Liberado para Desmontagem' ? 'bg-purple-100 text-purple-800' :
                'bg-slate-200 text-slate-700'
              }`}>
                {req.status}
              </span>

              {/* Botões de Ação */}
              <div className="flex space-x-1.5 flex-wrap gap-1">
                {/* Visita Técnica */}
                {req.status === 'Avaliação' && (isEquipe || isGestor) && (
                  <button 
                    onClick={() => {
                      setVisitModalReqId(req.id);
                      setVisitDimensions({ width: req.width, length: req.length, height: req.height });
                    }}
                    className="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow transition"
                  >
                    Visita Técnica
                  </button>
                )}

                {/* Movimentar */}
                {req.status === 'Iniciado Montagem' && (isEquipe || isGestor) && (
                  <button 
                    onClick={() => updateStatus(req.id, 'Em Movimentação', 'Movimentação dos materiais iniciada')}
                    className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow transition"
                  >
                    Movimentar
                  </button>
                )}

                {/* Montado (Foto) */}
                {req.status === 'Em Movimentação' && (isEquipe || isGestor) && (
                  <button 
                    onClick={() => {
                      setPhotoModalReq(req);
                      setTempPhotoUrl(req.photoUrl || null);
                    }}
                    className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow transition flex items-center gap-1"
                  >
                    <span>📸</span> Montado (Foto)
                  </button>
                )}

                {/* Liberar Desmontagem */}
                {req.status === 'Montado' && (isSolicitante || isGestor) && (
                  <button 
                    onClick={() => updateStatus(req.id, 'Liberado para Desmontagem', 'Solicitada a desmontagem pela área')}
                    className="px-2.5 py-1 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold rounded-lg shadow transition"
                  >
                    Liberar Desmontagem
                  </button>
                )}

                {/* Concluir Desmontagem -> Libera espaço na nuvem e soma no indicador */}
                {req.status === 'Liberado para Desmontagem' && (isEquipe || isGestor) && (
                  <button 
                    onClick={() => handleCompleteDismantle(req.id)}
                    className="px-2.5 py-1 bg-slate-800 hover:bg-black text-white text-xs font-bold rounded-lg shadow transition flex items-center gap-1"
                    title="Conclui o andaime, libera espaço na nuvem e soma ao total de Desmontados Concluídos"
                  >
                    <span>✓</span> Desmontar (Concluir)
                  </button>
                )}

                {/* BOTÃO DO GESTOR: CANCELAR SOLICITAÇÃO */}
                {isGestor && req.status !== 'Desmontado' && (
                  <button 
                    onClick={() => setCancelModalReq(req)}
                    className="px-2 py-1 bg-red-100 hover:bg-red-200 text-red-700 hover:text-red-900 text-xs font-bold rounded-lg border border-red-300 transition"
                    title="Cancelar esta solicitação"
                  >
                    ✕ Cancelar
                  </button>
                )}
              </div>
            </div>

            {/* Histórico recolhível */}
            <details className="text-[11px] text-slate-500 pt-1 border-t border-slate-100">
              <summary className="cursor-pointer hover:text-slate-800 font-medium">Ver Histórico de Auditoria ({req.history.length})</summary>
              <div className="mt-2 space-y-1.5 bg-slate-50 p-2 rounded-lg max-h-36 overflow-y-auto">
                {req.history.map((h, i) => (
                  <div key={i} className="flex flex-col border-b border-slate-200/60 pb-1 last:border-0 last:pb-0">
                    <span className="font-semibold text-slate-700">{h.action}</span>
                    <span className="text-[10px] text-slate-400">{h.date} • {h.user}</span>
                  </div>
                ))}
              </div>
            </details>
          </div>
        );
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Bar Corporativa */}
          <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-2">
              <div className="flex items-center space-x-3 w-full sm:w-auto">
                <a href="/" className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 transition" title="Ir para InspectCBM">
                  ← InspectCBM
                </a>
                <div className="p-2 bg-blue-600 rounded-lg">
                  <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                <div>
                  <h1 className="font-bold text-sm sm:text-base tracking-wide flex items-center gap-1.5 flex-wrap">
                    Gestão de Andaimes
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2 py-0.5 rounded-full font-mono flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Conectado
                    </span>
                  </h1>
                  <p className="text-[11px] text-slate-400">Controle de Fila, Montagens e Liberação de Nuvem</p>
                </div>
              </div>

              {/* Informações do Usuário */}
              <div className="flex items-center justify-between sm:justify-end w-full sm:w-auto space-x-3 text-xs pt-1 sm:pt-0 border-t sm:border-0 border-slate-800">
                <div className="text-left sm:text-right">
                  <p className="font-bold text-slate-200">{currentUser.name}</p>
                  <p className="text-blue-400 font-semibold text-[11px]">{currentUser.role}</p>
                </div>
                <button 
                  onClick={handleLogout}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition text-xs"
                >
                  Sair
                </button>
              </div>
            </div>

            {/* NAVEGAÇÃO POR ABAS SEPARADAS (PERFEITAS PARA O CELULAR) */}
            <div className="max-w-7xl mx-auto px-2 sm:px-4 border-t border-slate-800 flex space-x-1 overflow-x-auto text-xs py-1 scrollbar-thin">
              <button 
                onClick={() => setActiveTab('solicitacoes')} 
                className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'solicitacoes' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:bg-slate-800'}`}
              >
                <span>📋</span> Solicitações (Fila)
                <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${activeTab === 'solicitacoes' ? 'bg-slate-950 text-white' : 'bg-amber-500/30 text-amber-300'}`}>
                  {queueRequests.length}
                </span>
              </button>

              <button 
                onClick={() => setActiveTab('montados')} 
                className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'montados' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}
              >
                <span>🏗️</span> Montados
                <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${activeTab === 'montados' ? 'bg-white text-emerald-800' : 'bg-emerald-500/30 text-emerald-300'}`}>
                  {mountedRequests.length}
                </span>
              </button>

              <button 
                onClick={() => setActiveTab('desmontados')} 
                className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'desmontados' ? 'bg-slate-200 text-slate-900 shadow' : 'text-slate-300 hover:bg-slate-800'}`}
              >
                <span>✅</span> Desmontados Concluídos
                <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${activeTab === 'desmontados' ? 'bg-slate-900 text-white' : 'bg-slate-700 text-slate-300'}`}>
                  {stats.totalDesmontados}
                </span>
              </button>

              <button 
                onClick={() => setActiveTab('dashboard')} 
                className={`py-2 px-3 font-semibold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}
              >
                <span>📊</span> Indicadores & Estoque
              </button>

              <button 
                onClick={() => setActiveTab('nova')} 
                className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'nova' ? 'bg-blue-500 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}
              >
                <span>➕</span> Nova Solicitação
              </button>

              {isGestor && (
                <button 
                  onClick={() => setActiveTab('gestao')} 
                  className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'gestao' ? 'bg-purple-600 text-white shadow' : 'text-purple-300 hover:bg-slate-800'}`}
                >
                  <span>⚙️</span> Gestão & Logins
                </button>
              )}
            </div>
          </header>

          {/* Banner de Andaimes Atrasados */}
          {delayedRequests.length > 0 && (
            <div className="bg-red-600 text-white px-4 py-2 text-xs font-semibold flex items-center justify-between shadow">
              <div className="max-w-7xl mx-auto w-full flex items-center justify-between">
                <span>⚠️ Atenção: Existem {delayedRequests.length} andaime(s) com Data Limite Ultrapassada precisando de alinhamento!</span>
                <button onClick={() => setActiveTab('solicitacoes')} className="underline hover:text-red-100 font-bold">Ver Fila</button>
              </div>
            </div>
          )}

          {/* Conteúdo Principal */}
          <main className="max-w-7xl mx-auto px-4 py-5 flex-1 w-full space-y-5">

            {/* BARRA DE INDICADORES GERAIS ACUMULADOS (SALVOS NA NUVEM) */}
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1 border-b border-slate-100 pb-2 mb-3">
                <span className="text-xs font-bold text-slate-800 flex items-center gap-1.5 uppercase tracking-wide">
                  <span>📈</span> Indicadores Gerais Acumulados
                </span>
                <span className="text-[10px] text-slate-400 font-medium">
                  Preservados no Firebase mesmo com liberação de espaço de desmontados
                </span>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div className="p-3 bg-amber-50 rounded-xl border border-amber-200">
                  <p className="text-[10px] font-bold text-amber-800 uppercase">Total Solicitados</p>
                  <p className="text-2xl font-black text-amber-900 mt-0.5">{stats.totalSolicitados}</p>
                </div>
                <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200">
                  <p className="text-[10px] font-bold text-emerald-800 uppercase">Total Montados</p>
                  <p className="text-2xl font-black text-emerald-900 mt-0.5">{stats.totalMontados}</p>
                </div>
                <div className="p-3 bg-slate-100 rounded-xl border border-slate-300">
                  <p className="text-[10px] font-bold text-slate-700 uppercase">Desmontados Concluídos</p>
                  <p className="text-2xl font-black text-slate-900 mt-0.5">{stats.totalDesmontados}</p>
                </div>
                <div className="p-3 bg-red-50 rounded-xl border border-red-200">
                  <p className="text-[10px] font-bold text-red-800 uppercase">Total Cancelados</p>
                  <p className="text-2xl font-black text-red-900 mt-0.5">{stats.totalCancelados}</p>
                </div>
              </div>
            </div>

            {/* ABA 1: SOLICITAÇÕES (FILA DE ESPERA POR DATA LIMITE) */}
            {activeTab === 'solicitacoes' && (
              <div className="space-y-4">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-amber-50 p-4 rounded-xl border border-amber-200">
                  <div>
                    <h2 className="font-bold text-amber-900 text-sm flex items-center gap-2">
                      <span>📋</span> Solicitações & Fila de Espera ({queueRequests.length})
                    </h2>
                    <p className="text-xs text-amber-700 mt-0.5">
                      Fila organizada automaticamente com base na <strong>Data Limite de Finalização</strong> (a mais urgente primeiro).
                    </p>
                  </div>
                  <div className="flex gap-2">
                    <button 
                      onClick={() => setActiveTab('nova')}
                      className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg shadow transition"
                    >
                      + Nova Solicitação
                    </button>
                    {isGestor && (
                      <button 
                        onClick={() => setRequests(sortQueueByDueDate([...requests]))}
                        className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-lg shadow transition"
                        title="Reordenar com base na data limite"
                      >
                        ⚡ Reordenar por Prazo
                      </button>
                    )}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {queueRequests.map(renderCard)}
                </div>

                {queueRequests.length === 0 && (
                  <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                    <p className="text-sm font-semibold text-slate-600">Nenhuma solicitação na fila de espera no momento.</p>
                    <p className="text-xs text-slate-400 mt-1">Todas as montagens pendentes foram atendidas.</p>
                  </div>
                )}
              </div>
            )}

            {/* ABA 2: MONTADOS EM CAMPO */}
            {activeTab === 'montados' && (
              <div className="space-y-4">
                <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                  <div>
                    <h2 className="font-bold text-emerald-900 text-sm flex items-center gap-2">
                      <span>🏗️</span> Andaimes Montados em Campo ({mountedRequests.length})
                    </h2>
                    <p className="text-xs text-emerald-700 mt-0.5">
                      Consumindo atualmente <strong>{allocatedM3} m³</strong> de {totalCapacityM3} m³ contratados.
                    </p>
                  </div>
                  <span className="text-xs font-extrabold px-3 py-1 bg-emerald-200 text-emerald-900 rounded-full border border-emerald-300">
                    Ocupação: {((allocatedM3 / totalCapacityM3) * 100).toFixed(1)}%
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {mountedRequests.map(renderCard)}
                </div>

                {mountedRequests.length === 0 && (
                  <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                    <p className="text-sm font-semibold text-slate-600">Não há andaimes montados em campo no momento.</p>
                  </div>
                )}
              </div>
            )}

            {/* ABA 3: DESMONTADOS CONCLUÍDOS */}
            {activeTab === 'desmontados' && (
              <div className="space-y-4">
                <div className="bg-slate-200/70 p-4 rounded-xl border border-slate-300 space-y-1">
                  <h2 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <span>✅</span> Histórico de Andaimes Desmontados Concluídos ({stats.totalDesmontados})
                  </h2>
                  <p className="text-xs text-slate-600">
                    Quando o andaime é finalizado e recolhido, as informações ativas são limpas da nuvem para economizar espaço e custos de banco, mantendo o total acumulado seguro no indicador histórico.
                  </p>
                </div>

                {dismantledRequests.length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {dismantledRequests.map(renderCard)}
                  </div>
                ) : (
                  <div className="bg-white p-8 rounded-xl border border-slate-200 text-center space-y-2">
                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl">
                      ✓
                    </div>
                    <h3 className="font-bold text-slate-800 text-sm">Nuvem Otimizada e 100% Livre</h3>
                    <p className="text-xs text-slate-500 max-w-md mx-auto">
                      Todos os andaimes já desmontados tiveram seus documentos liberados do banco de dados na nuvem para manter a operação ágil e limpa. O total de <strong>{stats.totalDesmontados} andaimes finalizados</strong> está registrado nos indicadores históricos.
                    </p>
                  </div>
                )}
              </div>
            )}

            {/* ABA 4: INDICADORES, CAPACIDADE E ESTOQUE M3 */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Capacidade Contratada</p>
                    <p className="text-2xl font-black text-slate-800 mt-1">{totalCapacityM3} <span className="text-sm font-normal text-slate-500">m³</span></p>
                    <p className="text-[11px] text-slate-400 mt-1">Limite mensal contratado</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Em Uso Efetivo (Montado)</p>
                    <p className="text-2xl font-black text-blue-600 mt-1">{allocatedM3} <span className="text-sm font-normal text-slate-500">m³</span></p>
                    <p className="text-[11px] text-slate-400 mt-1">Montagens reais em campo</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Disponível em Estoque</p>
                    <p className={`text-2xl font-black mt-1 ${availableM3 < 50 ? 'text-red-600' : 'text-emerald-600'}`}>
                      {availableM3} <span className="text-sm font-normal text-slate-500">m³</span>
                    </p>
                    <p className="text-[11px] text-slate-400 mt-1">{((availableM3 / totalCapacityM3) * 100).toFixed(1)}% livre</p>
                  </div>
                </div>

                {/* Barra de Progresso de Ocupação */}
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-2">
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-bold text-slate-700">Taxa de Ocupação de Andaimes da Planta</span>
                    <span className="font-bold text-slate-700">{((allocatedM3 / totalCapacityM3) * 100).toFixed(1)}%</span>
                  </div>
                  <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                    <div 
                      className={`h-full transition-all duration-500 ${
                        (allocatedM3 / totalCapacityM3) > 0.85 ? 'bg-red-500' :
                        (allocatedM3 / totalCapacityM3) > 0.65 ? 'bg-amber-500' : 'bg-blue-600'
                      }`}
                      style={{ width: `${Math.min(100, (allocatedM3 / totalCapacityM3) * 100)}%` }}
                    ></div>
                  </div>
                </div>
              </div>
            )}

            {/* ABA 5: NOVA SOLICITAÇÃO */}
            {activeTab === 'nova' && (
              <div className="max-w-2xl mx-auto bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 className="text-base font-bold text-slate-800 mb-1">Nova Solicitação de Andaime</h2>
                <p className="text-xs text-slate-500 mb-5">Preencha os dados da atividade. A solicitação é salva automaticamente no Firebase e atualizada para todos.</p>

                <form onSubmit={handleCreateRequest} className="space-y-4">
                  
                  {/* FÁBRICA E ÁREA */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Planta / Fábrica *</label>
                      <input 
                        type="text" 
                        name="factory" 
                        placeholder="Ex: Fábrica 01, Fábrica de Motores" 
                        value={formData.factory} 
                        onChange={handleInputChange} 
                        required 
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium focus:outline-none focus:border-blue-500" 
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Área / Setor *</label>
                      <input 
                        type="text" 
                        name="area" 
                        placeholder="Ex: Caldeiras, Linha de Envase" 
                        value={formData.area} 
                        onChange={handleInputChange} 
                        required 
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm" 
                      />
                    </div>
                  </div>

                  {/* PONTO DE REFERÊNCIA */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Ponto de Referência / Local Exato *</label>
                    <input 
                      type="text" 
                      name="reference" 
                      placeholder="Ex: Ao lado do tanque T-102" 
                      value={formData.reference} 
                      onChange={handleInputChange} 
                      required 
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm" 
                    />
                  </div>

                  {/* QUAL ATIVIDADE SERÁ REALIZADA */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1 flex items-center gap-1.5">
                      <span>🔧</span> Qual atividade será realizada? *
                    </label>
                    <textarea 
                      name="activityDescription" 
                      rows="2"
                      placeholder="Descreva detalhadamente o serviço a ser feito no local..." 
                      value={formData.activityDescription} 
                      onChange={handleInputChange} 
                      required 
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
                    ></textarea>
                  </div>

                  {/* É POSSÍVEL REALIZAR COM PEMT? SIM / NÃO */}
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <label className="block text-xs font-bold text-slate-800 uppercase tracking-wide">
                      É possível realizar a atividade com PEMT (Plataforma Elevatória Móvel de Trabalho)? *
                    </label>
                    
                    <div className="grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        onClick={() => setFormData({ ...formData, canUsePEMT: 'NÃO', pemtJustification: '' })}
                        className={`py-2.5 px-4 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-2 ${
                          formData.canUsePEMT === 'NÃO'
                            ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                        }`}
                      >
                        <span>✕</span> NÃO
                      </button>

                      <button
                        type="button"
                        onClick={() => setFormData({ ...formData, canUsePEMT: 'SIM' })}
                        className={`py-2.5 px-4 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-2 ${
                          formData.canUsePEMT === 'SIM'
                            ? 'bg-amber-600 text-white border-amber-600 shadow-sm'
                            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                        }`}
                      >
                        <span>✓</span> SIM
                      </button>
                    </div>

                    {/* SE SIM -> JUSTIFICATIVA OBRIGATÓRIA */}
                    {formData.canUsePEMT === 'SIM' && (
                      <div className="pt-2 animate-in fade-in">
                        <label className="block text-xs font-bold text-amber-900 uppercase mb-1">
                          Justificativa para montagem de andaime *
                        </label>
                        <textarea 
                          name="pemtJustification" 
                          rows="2"
                          placeholder="Informe a justificativa técnica para optar pelo andaime..." 
                          value={formData.pemtJustification} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-amber-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:border-amber-500"
                        ></textarea>
                      </div>
                    )}
                  </div>

                  {/* RESPONSÁVEL PELA ATIVIDADE, EMAIL E TELEFONE */}
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div className="flex items-center justify-between">
                      <label className="text-xs font-bold text-slate-700 uppercase tracking-wide flex items-center gap-1.5">
                        <span>👷</span> Responsável pela Atividade (Dono do Serviço no Local) *
                      </label>
                      <span className="text-[10px] text-slate-500 font-medium">Pode ser diferente do solicitante logado</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome do Responsável *</label>
                        <input 
                          type="text" 
                          name="activityResponsible" 
                          placeholder="Nome do responsável" 
                          value={formData.activityResponsible} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm" 
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mail do Responsável *</label>
                        <input 
                          type="email" 
                          name="email" 
                          placeholder="responsavel@empresa.com" 
                          value={formData.email} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm" 
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Telefone / Ramal *</label>
                        <input 
                          type="text" 
                          name="phone" 
                          placeholder="(XX) 99999-9999" 
                          value={formData.phone} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm" 
                        />
                      </div>
                    </div>
                  </div>

                  {/* DATA LIMITE E URGÊNCIA */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Data Limite de Finalização *</label>
                      <input 
                        type="date" 
                        name="dueDate" 
                        value={formData.dueDate} 
                        onChange={handleInputChange} 
                        required 
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold" 
                      />
                      <p className="text-[10px] text-slate-400 mt-1">Define automaticamente a posição na fila de prioridade.</p>
                    </div>
                    <div className="flex items-center pt-2 sm:pt-6">
                      <label className="flex items-center space-x-2 cursor-pointer">
                        <input 
                          type="checkbox" 
                          name="isUrgent" 
                          checked={formData.isUrgent} 
                          onChange={handleInputChange} 
                          className="w-4 h-4 text-red-600 rounded border-slate-300" 
                        />
                        <span className="text-xs font-bold text-red-600">Marcar como URGÊNCIA OPERACIONAL</span>
                      </label>
                    </div>
                  </div>

                  {/* DIMENSÕES ESTIMADAS */}
                  <div className="border-t border-slate-200 pt-4">
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-2">Dimensões Estimadas (Metros)</label>
                    <div className="grid grid-cols-3 gap-3">
                      <div>
                        <span className="text-[11px] text-slate-500">Largura (m)</span>
                        <input type="number" step="0.1" name="width" placeholder="Ex: 2" value={formData.width} onChange={handleInputChange} required className="w-full p-2 bg-slate-50 border border-slate-300 rounded text-sm" />
                      </div>
                      <div>
                        <span className="text-[11px] text-slate-500">Comprimento (m)</span>
                        <input type="number" step="0.1" name="length" placeholder="Ex: 3" value={formData.length} onChange={handleInputChange} required className="w-full p-2 bg-slate-50 border border-slate-300 rounded text-sm" />
                      </div>
                      <div>
                        <span className="text-[11px] text-slate-500">Altura (m)</span>
                        <input type="number" step="0.1" name="height" placeholder="Ex: 4" value={formData.height} onChange={handleInputChange} required className="w-full p-2 bg-slate-50 border border-slate-300 rounded text-sm" />
                      </div>
                    </div>

                    <div className="mt-3 p-3 bg-slate-50 rounded-lg flex justify-between text-xs font-semibold text-slate-700">
                      <span>Área de Base Estimada: {calcBaseArea.toFixed(1)} m²</span>
                      <span className="text-blue-600">Volume Total Estimado: {calcVolume.toFixed(1)} m³</span>
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm">
                    Enviar Solicitação para a Fila (Salvar na Nuvem)
                  </button>
                </form>
              </div>
            )}

            {/* ABA 6: GESTÃO & LOGINS (EXCLUSIVO GESTOR) */}
            {activeTab === 'gestao' && isGestor && (
              <div className="space-y-6 max-w-4xl mx-auto">
                {/* 1. GERENCIAMENTO DE LOGINS E ACESSOS */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div>
                      <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                        <span>👥</span> Controle e Exclusão de Logins Cadastrados
                      </h3>
                      <p className="text-xs text-slate-500">
                        O Gestor pode excluir acessos não mais autorizados ou cadastrados incorretamente.
                      </p>
                    </div>
                    <span className="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full text-xs font-bold">
                      {users.length} usuários
                    </span>
                  </div>

                  <div className="divide-y divide-slate-100">
                    {users.map((u) => {
                      const isMe = u.email.toLowerCase() === currentUser.email.toLowerCase();
                      return (
                        <div key={u.id || u.email} className="py-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-sm text-slate-800">{u.name}</span>
                              {isMe && (
                                <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.2 rounded-full">
                                  Você
                                </span>
                              )}
                            </div>
                            <p className="text-xs text-slate-500">{u.email}</p>
                            <span className={`inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded ${
                              u.role === 'Gestor de Andaimes' ? 'bg-purple-100 text-purple-800' :
                              u.role === 'Equipe de Andaimes' ? 'bg-blue-100 text-blue-800' :
                              'bg-slate-100 text-slate-700'
                            }`}>
                              {u.role}
                            </span>
                          </div>

                          <div>
                            {isMe ? (
                              <span className="text-xs text-slate-400 italic">Sessão Atual</span>
                            ) : (
                              <button 
                                onClick={() => handleDeleteUser(u)}
                                className="px-3 py-1.5 bg-red-50 hover:bg-red-600 text-red-600 hover:text-white border border-red-200 rounded-lg text-xs font-bold transition flex items-center gap-1.5"
                                title="Excluir o login deste usuário do sistema"
                              >
                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                Excluir Login
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 2. AJUSTE DE CAPACIDADE CONTRATADA */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                  <h3 className="font-bold text-base text-slate-800">Ajuste de Capacidade Máxima Contratada</h3>
                  <p className="text-xs text-slate-500">Ajuste o volume total em m³ contratado junto à montadora. Salvo no Firebase para todos.</p>
                  
                  <div className="flex items-center space-x-3 pt-2">
                    <input 
                      type="number" 
                      value={totalCapacityM3} 
                      onChange={(e) => handleUpdateCapacity(Number(e.target.value) || 0)} 
                      className="p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm w-36 font-bold" 
                    />
                    <span className="text-sm font-semibold text-slate-600">m³ Contratados</span>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL: VISITA TÉCNICA E DIMENSÃO REAL */}
          {visitModalReqId && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-sm text-slate-800">Visita Técnica — Medição Real</h3>
                  <button onClick={() => setVisitModalReqId(null)} className="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
                </div>
                <p className="text-xs text-slate-500">Informe as dimensões conferidas no local para iniciar a montagem:</p>

                <form onSubmit={handleSaveVisit} className="space-y-3">
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[10px] text-slate-500">Largura (m)</label>
                      <input type="number" step="0.1" value={visitDimensions.width} onChange={(e) => setVisitDimensions({...visitDimensions, width: e.target.value})} required className="w-full p-2 border rounded text-xs" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500">Comprimento (m)</label>
                      <input type="number" step="0.1" value={visitDimensions.length} onChange={(e) => setVisitDimensions({...visitDimensions, length: e.target.value})} required className="w-full p-2 border rounded text-xs" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500">Altura (m)</label>
                      <input type="number" step="0.1" value={visitDimensions.height} onChange={(e) => setVisitDimensions({...visitDimensions, height: e.target.value})} required className="w-full p-2 border rounded text-xs" />
                    </div>
                  </div>

                  <div className="p-2.5 bg-blue-50 text-blue-900 rounded text-xs font-semibold">
                    Volume Real: {((Number(visitDimensions.width) || 0) * (Number(visitDimensions.length) || 0) * (Number(visitDimensions.height) || 0)).toFixed(1)} m³
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setVisitModalReqId(null)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-blue-600 text-white rounded text-xs font-bold hover:bg-blue-700">Salvar no Firebase e Iniciar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CONCLUIR MONTAGEM COM CÂMERA DO CELULAR E COMPRESSÃO DE FOTO */}
          {photoModalReq && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4 animate-in fade-in zoom-in">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                      <span>📸</span> Registrar Foto e Concluir Montagem
                    </h3>
                    <p className="text-xs text-slate-500">Solicitação ID: <strong>{photoModalReq.id}</strong> — {photoModalReq.factory}</p>
                  </div>
                  <button onClick={() => { setPhotoModalReq(null); setTempPhotoUrl(null); }} className="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
                </div>

                <div className="text-xs text-slate-600 space-y-1 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                  <p><span className="font-semibold text-slate-700">Local:</span> {photoModalReq.area} ({photoModalReq.reference})</p>
                  <p><span className="font-semibold text-slate-700">Responsável:</span> {photoModalReq.responsible}</p>
                  <p><span className="font-semibold text-slate-700">Dimensões Reais:</span> {photoModalReq.realWidth || photoModalReq.width}x{photoModalReq.realLength || photoModalReq.length}x{photoModalReq.realHeight || photoModalReq.height}m ({photoModalReq.realVolumeM3 || photoModalReq.volumeM3} m³)</p>
                </div>

                {/* Pré-visualização da foto */}
                {tempPhotoUrl ? (
                  <div className="space-y-2">
                    <div className="relative rounded-xl overflow-hidden border border-slate-200 max-h-56 bg-slate-900 flex items-center justify-center">
                      <img src={tempPhotoUrl} alt="Foto Andaime Montado" className="max-h-56 w-full object-contain" />
                      <span className="absolute top-2 right-2 bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow flex items-center gap-1">
                        <span>✓</span> Foto Otimizada para Nuvem
                      </span>
                    </div>
                    <div className="flex justify-between items-center pt-1">
                      <span className="text-[11px] text-emerald-700 font-semibold flex items-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        Compressão concluída (~80KB)
                      </span>
                      <button 
                        type="button" 
                        onClick={() => setTempPhotoUrl(null)} 
                        className="text-red-600 hover:text-red-700 font-semibold underline text-xs"
                      >
                        Tirar Outra Foto
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <p className="text-xs text-slate-600 font-medium">Capture a foto do andaime montado para auditoria técnica:</p>

                    {/* Botão 1: ATIVA A CÂMERA DO CELULAR */}
                    <div>
                      <input 
                        type="file" 
                        accept="image/*" 
                        capture="environment" 
                        id="camera-capture-input" 
                        className="hidden" 
                        onChange={async (e) => {
                          const file = e.target.files[0];
                          if (file) {
                            setIsCompressingPhoto(true);
                            try {
                              const compressed = await compressImage(file);
                              setTempPhotoUrl(compressed);
                            } catch (err) {
                              console.error('Erro na câmera:', err);
                              alert('Erro ao carregar foto da câmera.');
                            } finally {
                              setIsCompressingPhoto(false);
                            }
                          }
                        }} 
                      />
                      <label 
                        htmlFor="camera-capture-input" 
                        className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-bold rounded-xl flex items-center justify-center gap-2 cursor-pointer shadow-md transition text-xs"
                      >
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span>{isCompressingPhoto ? 'Comprimindo foto...' : 'Tirar Foto com a Câmera do Celular'}</span>
                      </label>
                    </div>

                    {/* Botão 2: ESCOLHER DA GALERIA */}
                    <div>
                      <input 
                        type="file" 
                        accept="image/*" 
                        id="gallery-file-input" 
                        className="hidden" 
                        onChange={async (e) => {
                          const file = e.target.files[0];
                          if (file) {
                            setIsCompressingPhoto(true);
                            try {
                              const compressed = await compressImage(file);
                              setTempPhotoUrl(compressed);
