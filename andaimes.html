              {/* 7. GESTÃO, FÁBRICAS & LOGINS */}
              {isGestor && (
                <button 
                  onClick={() => setActiveTab('gestao')} 
                  className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'gestao' ? 'bg-purple-600 text-white shadow' : 'text-purple-300 hover:bg-slate-800'}`}
                >
                  <span>⚙️</span> Gestão & Logins
                </button>
              )}
            </div>
          </header>

          {/* Banner de Andaimes Atrasados */}
          {delayedRequests.length > 0 && (
            <div className="bg-red-600 text-white px-4 py-2 text-xs font-semibold flex items-center justify-between shadow no-print">
              <div className="max-w-7xl mx-auto w-full flex items-center justify-between">
                <span>⚠️ Atenção: Existem {delayedRequests.length} andaime(s) com Data Limite Ultrapassada precisando de alinhamento!</span>
                <button onClick={() => setActiveTab('solicitacoes')} className="underline hover:text-red-100 font-bold">Ver Fila</button>
              </div>
            </div>
          )}

          {/* Conteúdo Principal */}
          <main className="max-w-7xl mx-auto px-4 py-5 flex-1 w-full space-y-5">

            {/* ABA 1: SOLICITAÇÕES (FILA DE ESPERA POR ORDEM CRESCENTE SOL-10... OU PRAZO) */}
            {activeTab === 'solicitacoes' && (
              <div className="space-y-4">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-amber-50 p-4 rounded-xl border border-amber-200">
                  <div>
                    <h2 className="font-bold text-amber-900 text-sm flex items-center gap-2">
                      <span>📋</span> Solicitações & Fila de Espera ({queueRequests.length})
                    </h2>
                    <p className="text-xs text-amber-700 mt-0.5">
                      Visualização em <strong>{solicitacoesSortMode === 'id_asc' ? 'Ordem Crescente (SOL-10...)' : 'Ordem por Prazo de Montagem'}</strong> sem limite.
                    </p>
                  </div>
                  <div className="flex items-center gap-2 flex-wrap">
                    {/* Botões de Ordenação */}
                    <div className="bg-white/90 p-1 rounded-lg border border-amber-300 flex items-center gap-1 text-xs">
                      <span className="text-[10px] font-bold text-amber-900 px-1 uppercase">Ordem:</span>
                      <button 
                        type="button"
                        onClick={() => setSolicitacoesSortMode('id_asc')}
                        className={`px-2.5 py-1 rounded-md font-bold text-xs transition ${
                          solicitacoesSortMode === 'id_asc'
                            ? 'bg-amber-600 text-white shadow-sm'
                            : 'text-amber-900 hover:bg-amber-100'
                        }`}
                        title="Ordenar em ordem crescente pelo número da solicitação (SOL-1001, SOL-1002...)"
                      >
                        123 SOL-10... (Crescente)
                      </button>
                      <button 
                        type="button"
                        onClick={() => setSolicitacoesSortMode('due_date')}
                        className={`px-2.5 py-1 rounded-md font-bold text-xs transition ${
                          solicitacoesSortMode === 'due_date'
                            ? 'bg-amber-600 text-white shadow-sm'
                            : 'text-amber-900 hover:bg-amber-100'
                        }`}
                        title="Ordenar por prazo limite e urgência"
                      >
                        ⏱️ Por Prazo
                      </button>
                    </div>

                    <button 
                      onClick={() => setActiveTab('nova')}
                      className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg shadow transition"
                    >
                      + Nova Solicitação
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {queueRequests.map(renderCard)}
                </div>

                {queueRequests.length === 0 && (
                  <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                    <p className="text-sm font-semibold text-slate-600">Nenhuma solicitação na fila de espera no momento.</p>
                    <p className="text-xs text-slate-400 mt-1">Todas as montagens pendentes foram atendidas.</p>
                  </div>
                )}
              </div>
            )}

            {/* ABA 2: MONTADOS EM CAMPO */}
            {activeTab === 'montados' && (
              <div className="space-y-4">
                <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                  <div>
                    <h2 className="font-bold text-emerald-900 text-sm flex items-center gap-2">
                      <span>🏗️</span> Andaimes Montados em Campo ({mountedRequests.length})
                    </h2>
                    <p className="text-xs text-emerald-700 mt-0.5">
                      Consumindo atualmente <strong>{allocatedM3} m³</strong> de {totalCapacityM3} m³ contratados.
                    </p>
                  </div>
                  <span className="text-xs font-extrabold px-3 py-1 bg-emerald-200 text-emerald-900 rounded-full border border-emerald-300">
                    Ocupação: {((allocatedM3 / totalCapacityM3) * 100).toFixed(1)}%
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {mountedRequests.map(renderCard)}
                </div>

                {mountedRequests.length === 0 && (
                  <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                    <p className="text-sm font-semibold text-slate-600">Não há andaimes montados em campo no momento.</p>
                  </div>
                )}
              </div>
            )}

            {/* ABA 3: DESMONTADOS CONCLUÍDOS (APENAS OS 4 ÚLTIMOS, FOTO APAGADA, DESCRITIVO MANTIDO, CONTAGEM PRESERVADA) */}
            {activeTab === 'desmontados' && (
              <div className="space-y-4 animate-in fade-in">
                <div className="bg-slate-100 p-4 rounded-xl border border-slate-300 space-y-1.5 shadow-sm">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <h2 className="font-bold text-slate-900 text-sm sm:text-base flex items-center gap-2">
                      <span>✅</span> Andaimes Desmontados Concluídos
                      <span className="bg-slate-900 text-white text-xs px-2.5 py-0.5 rounded-full font-black shadow-sm">
                        Total Acumulado: {dismantledRequests.length + (archivedStats.extraDesmontados || 0)}
                      </span>
                    </h2>
                    <span className="text-[11px] bg-blue-100 text-blue-900 font-extrabold px-2.5 py-1 rounded-lg border border-blue-200">
                      Exibindo os 4 últimos desmontados ({displayedDismantled.length} de 4)
                    </span>
                  </div>
                  <p className="text-xs text-slate-600 leading-relaxed">
                    Exibição configurada para <strong>apenas os 4 últimos andaimes desmontados</strong> para controle de campo. Ao desmontar mais um andaime, o 4º mais antigo sai da visualização ativa enquanto a contagem total permanece segura e precisa nos indicadores históricos. As fotos são apagadas para economia de armazenamento na nuvem e o <strong>descritivo completo (área, referência, atividade, responsável, medidas e histórico)</strong> permanece disponível para conferência.
                  </p>
                </div>

                {displayedDismantled.length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4">
                    {displayedDismantled.map((req, idx) => (
                      <div key={req.id} className="relative">
                        <div className="absolute top-3 right-3 z-10">
                          <span className="bg-slate-900 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full shadow border border-slate-700">
                            #{idx + 1} Mais Recente
                          </span>
                        </div>
                        {renderCard(req)}
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="bg-white p-8 rounded-xl border border-slate-200 text-center space-y-2">
                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                      ✓
                    </div>
                    <h3 className="font-bold text-slate-800 text-sm">Nenhum Andaime Desmontado Recentemente</h3>
                    <p className="text-xs text-slate-500 max-w-md mx-auto">
                      Assim que um andaime em campo for concluído e desmontado, ele aparecerá aqui com seus dados descritivos completos (mantendo sempre os 4 mais recentes).
                    </p>
                    <p className="text-[11px] text-slate-400">
                      Total histórico registrado nos indicadores: <strong>{dismantledRequests.length + (archivedStats.extraDesmontados || 0)} andaimes</strong>
                    </p>
                  </div>
                )}
              </div>
            )}

            {/* ABA: ANDAIMES DESMONTADOS EM FÁBRICAS (CONTROLE DE ESTOQUE DA EQUIPE) */}
            {activeTab === 'estoque_fabricas' && (
              <div className="space-y-5 animate-in fade-in">
                {/* Cabeçalho do Estoque */}
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                  <div>
                    <div className="flex items-center gap-2">
                      <h2 className="text-base font-extrabold text-slate-800 flex items-center gap-2">
                        <span>📦</span> Andaimes Desmontados em Fábricas
                      </h2>
                      <span className="text-[10px] bg-cyan-100 text-cyan-800 font-bold px-2 py-0.5 rounded-full border border-cyan-200">
                        Equipe em Campo
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 mt-1">
                      Rastreamento de onde e quantos metros de andaime desmontado estão guardados em cada fábrica para a equipe nunca esquecer.
                    </p>
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      setEditingStorageItem(null);
                      setStorageFormData({
                        factory: factories[0] || 'DRYMIX',
                        exactLocation: '',
                        linearMeters: '',
                        volumeM3: '',
                        materialType: 'Torres Tubulares Completas',
                        status: 'Disponível para Reuso',
                        notes: ''
                      });
                      setIsStorageModalOpen(true);
                    }}
                    className="px-4 py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white font-bold rounded-xl text-xs transition shadow flex items-center gap-2"
                  >
                    <span>➕</span> Registrar Material Desmontado Guardado
                  </button>
                </div>

                {/* Resumo de Metragem e Locais */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Total Metros Desmontados</p>
                    <p className="text-3xl font-black text-cyan-700 mt-1">{totalMetersStored} <span className="text-sm font-normal text-slate-500">metros</span></p>
                    <p className="text-[11px] text-slate-400 mt-1">Armazenados e disponíveis nas fábricas</p>
                  </div>

                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Locais / Pontos Mapeados</p>
                    <p className="text-3xl font-black text-slate-800 mt-1">{dismantledStorageList.length} <span className="text-sm font-normal text-slate-500">pontos</span></p>
                    <p className="text-[11px] text-slate-400 mt-1">Pontos de guarda cadastrados</p>
                  </div>

                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Fábricas com Andaime</p>
                    <p className="text-3xl font-black text-blue-600 mt-1">
                      {new Set(dismantledStorageList.map(s => (s.factory || '').toUpperCase())).size} <span className="text-sm font-normal text-slate-500">fábricas</span>
                    </p>
                    <p className="text-[11px] text-slate-400 mt-1">Com material desmontado no local</p>
                  </div>
                </div>

                {/* Filtro por Fábrica e Busca */}
                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3">
                  <div className="flex items-center gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 scrollbar-thin">
                    <span className="text-xs font-bold text-slate-600 whitespace-nowrap">Fábrica:</span>
                    <button
                      type="button"
                      onClick={() => setStorageFilterFactory('ALL')}
                      className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${storageFilterFactory === 'ALL' ? 'bg-cyan-600 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                    >
                      Todas ({dismantledStorageList.length})
                    </button>
                    {factories.map((f, i) => {
                      const count = dismantledStorageList.filter(s => (s.factory || '').toUpperCase() === f.toUpperCase()).length;
                      return (
                        <button
                          key={i}
                          type="button"
                          onClick={() => setStorageFilterFactory(f)}
                          className={`px-3 py-1 rounded-lg text-xs font-bold transition whitespace-nowrap ${storageFilterFactory === f ? 'bg-cyan-600 text-white shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                        >
                          {f} {count > 0 && `(${count})`}
                        </button>
                      );
                    })}
                  </div>

                  <div className="w-full sm:w-64">
                    <input
                      type="text"
                      placeholder="Buscar local exato..."
                      value={storageSearchTerm}
                      onChange={(e) => setStorageSearchTerm(e.target.value)}
                      className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs"
                    />
                  </div>
                </div>

                {/* Lista de Registros de Andaimes Desmontados em Campo */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {dismantledStorageList
                    .filter(item => {
                      if (storageFilterFactory !== 'ALL' && (item.factory || '').toUpperCase() !== storageFilterFactory.toUpperCase()) return false;
                      if (storageSearchTerm.trim()) {
                        const term = storageSearchTerm.toLowerCase();
                        const matchLoc = (item.exactLocation || '').toLowerCase().includes(term);
                        const matchFac = (item.factory || '').toLowerCase().includes(term);
                        const matchNotes = (item.notes || '').toLowerCase().includes(term);
                        if (!matchLoc && !matchFac && !matchNotes) return false;
                      }
                      return true;
                    })
                    .map((item) => (
                      <div key={item.id} className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 space-y-3 hover:shadow-md transition">
                        <div className="flex justify-between items-start gap-2 border-b border-slate-100 pb-2">
                          <div>
                            <span className="text-[10px] font-black uppercase px-2 py-0.5 rounded bg-cyan-100 text-cyan-800 border border-cyan-200">
                              {item.factory}
                            </span>
                            <h3 className="font-bold text-sm text-slate-800 mt-1 flex items-center gap-1">
                              <span>📍</span> {item.exactLocation}
                            </h3>
                          </div>
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                            item.status === 'Disponível para Reuso' ? 'bg-emerald-100 text-emerald-800' :
                            item.status === 'Em Manutenção' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'
                          }`}>
                            {item.status}
                          </span>
                        </div>

                        {/* Metragem e Tipo */}
                        <div className="bg-cyan-50/60 p-3 rounded-lg border border-cyan-100 flex justify-between items-center">
                          <div>
                            <span className="text-[10px] text-cyan-800 uppercase font-bold block">Metragem de Andaime</span>
                            <span className="text-2xl font-black text-cyan-950">{item.linearMeters} <span className="text-xs font-semibold text-cyan-700">metros</span></span>
                          </div>
                          {item.volumeM3 ? (
                            <div className="text-right">
                              <span className="text-[10px] text-slate-500 uppercase font-semibold block">Volume Aprox.</span>
                              <span className="text-sm font-bold text-slate-700">{item.volumeM3} m³</span>
                            </div>
                          ) : null}
                        </div>

                        <div className="text-xs text-slate-600 space-y-1">
                          <p><strong className="text-slate-700">Tipo de Material:</strong> {item.materialType || 'Torres Tubulares'}</p>
                          {item.notes && (
                            <p className="italic text-slate-500 bg-slate-50 p-1.5 rounded text-[11px]">
                              "{item.notes}"
                            </p>
                          )}
                          <p className="text-[10px] text-slate-400 pt-1">
                            Guardado por: <strong>{item.responsible || 'Equipe'}</strong> em {item.updatedAt || '-'}
                          </p>
                        </div>

                        {/* Botões de Ação e Ajuste Rápido */}
                        <div className="flex items-center justify-between pt-2 border-t border-slate-100">
                          {/* Ajuste rápido de metros */}
                          <div className="flex items-center gap-1">
                            <span className="text-[10px] text-slate-400 font-semibold mr-1">Ajuste:</span>
                            <button
                              type="button"
                              onClick={() => handleQuickAdjustMeters(item, -5)}
                              className="px-2 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-bold"
                              title="Diminuir 5 metros"
                            >
                              -5m
                            </button>
                            <button
                              type="button"
                              onClick={() => handleQuickAdjustMeters(item, 5)}
                              className="px-2 py-0.5 bg-cyan-100 hover:bg-cyan-200 text-cyan-800 rounded text-xs font-bold"
                              title="Adicionar 5 metros"
                            >
                              +5m
                            </button>
                          </div>

                          <div className="flex items-center gap-1.5">
                            <button
                              type="button"
                              onClick={() => handleOpenEditStorageModal(item)}
                              className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-semibold"
                            >
                              Editar
                            </button>
                            <button
                              type="button"
                              onClick={() => handleDeleteStorageItem(item)}
                              className="px-2 py-1 text-red-600 hover:bg-red-50 rounded text-xs font-bold"
                              title="Dar baixa / remover registro deste local"
                            >
                              Dar Baixa
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}

                  {dismantledStorageList.length === 0 && (
                    <div className="col-span-full bg-white p-8 rounded-2xl border border-dashed border-slate-300 text-center space-y-2">
                      <span className="text-3xl block">📦</span>
                      <p className="font-bold text-sm text-slate-700">Nenhum andaime desmontado registrado ainda</p>
                      <p className="text-xs text-slate-500 max-w-md mx-auto">
                        Quando os andaimes forem desmontados e guardados nas fábricas, registre aqui o local exato e quantos metros estão disponíveis para a equipe localizar rapidamente.
                      </p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ABA: INDICADORES DA GESTÃO & RELATÓRIOS (EXCEL E PDF) - INDICADOR SOMENTE NESTA ABA */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6 animate-in fade-in">

                {/* BLOCO DE INDICADORES DA GESTÃO COM FILTROS POR SEMANA E MÊS E BOTÃO DE PDF E EXCEL */}
                <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4 no-print">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 border-b border-slate-100 pb-3">
                    <div>
                      <div className="flex items-center gap-2">
                        <h2 className="text-sm sm:text-base font-extrabold text-slate-800 flex items-center gap-2">
                          <span>📈</span> Indicadores da Gestão de Andaimes
                        </h2>
                        <span className="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full border border-blue-200">
                          Sincronizado
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Filtrando por: <strong className="text-slate-800 font-bold">{filterPeriodLabel}</strong>
                      </p>
                    </div>

                    <div className="flex items-center gap-2 flex-wrap">
                      {/* BOTÃO GERAR EXCEL DIÁRIO PARA A CHEFIA */}
                      <button
                        type="button"
                        onClick={() => setIsExcelModalOpen(true)}
                        className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow flex items-center gap-1.5"
                      >
                        <span>📊</span> Exportar Excel para Chefia
                      </button>

                      {/* BOTÃO GERAR RELATÓRIO PDF */}
                      <button
                        type="button"
                        onClick={() => setIsPdfModalOpen(true)}
                        className="px-3.5 py-1.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition shadow flex items-center gap-1.5"
                      >
                        <span>📄</span> Gerar Relatório PDF por Fábrica
                      </button>

                      {/* BOTÕES DE FILTRO POR PERÍODO */}
                      <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                        <button 
                          type="button"
                          onClick={() => setFilterPeriod('all')}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
                            filterPeriod === 'all' 
                              ? 'bg-white text-slate-900 shadow-sm border border-slate-200' 
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          <span>📌</span> Geral
                        </button>

                        <button 
                          type="button"
                          onClick={() => setFilterPeriod('month')}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
                            filterPeriod === 'month' 
                              ? 'bg-blue-600 text-white shadow-sm' 
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          <span>🗓️</span> Este Mês
                        </button>

                        <button 
                          type="button"
                          onClick={() => setFilterPeriod('week')}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
                            filterPeriod === 'week' 
                              ? 'bg-indigo-600 text-white shadow-sm' 
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          <span>⏱️</span> Esta Semana
                        </button>

                        <button 
                          type="button"
                          onClick={() => setFilterPeriod('today')}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
                            filterPeriod === 'today' 
                              ? 'bg-emerald-600 text-white shadow-sm' 
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          <span>📍</span> Hoje
                        </button>

                        {isGestor && (
                          <button 
                            type="button"
                            onClick={handleSyncIndicatorsWithDatabase}
                            className="ml-1 px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-lg text-xs transition shadow-sm flex items-center gap-1"
                            title="Sincronizar indicadores com a base real do Firebase"
                          >
                            <span>🔄</span>
                          </button>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* 4 CARDS DE INDICADORES */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="p-3.5 bg-amber-50 rounded-xl border border-amber-200 shadow-sm">
                      <p className="text-[10px] font-bold text-amber-800 uppercase tracking-wide">
                        {filterPeriod === 'all' ? 'Solicitações na Fila' : 'Solicitados no Período'}
                      </p>
                      <p className="text-3xl font-black text-amber-950 mt-1">{displayedStats.solicitados}</p>
                      <p className="text-[10px] text-amber-700 font-medium mt-1">
                        {filterPeriod === 'all' ? `${displayedStats.totalGeralCriado} no total histórico` : 'Criadas no período'}
                      </p>
                    </div>

                    <div className="p-3.5 bg-emerald-50 rounded-xl border border-emerald-200 shadow-sm">
                      <p className="text-[10px] font-bold text-emerald-800 uppercase tracking-wide">
                        {filterPeriod === 'all' ? 'Montados em Campo' : 'Montagens no Período'}
                      </p>
                      <p className="text-3xl font-black text-emerald-950 mt-1">{displayedStats.montados}</p>
                      <p className="text-[10px] text-emerald-700 font-medium mt-1">
                        {filterPeriod === 'all' ? `Consumindo ${allocatedM3} m³` : 'Montagens realizadas'}
                      </p>
                    </div>

                    <div className="p-3.5 bg-slate-100 rounded-xl border border-slate-300 shadow-sm">
                      <p className="text-[10px] font-bold text-slate-700 uppercase tracking-wide">
                        {filterPeriod === 'all' ? 'Desmontados Concluídos' : 'Desmontados no Período'}
                      </p>
                      <p className="text-3xl font-black text-slate-900 mt-1">{displayedStats.desmontados}</p>
                      <p className="text-[10px] text-slate-500 font-medium mt-1">
                        {filterPeriod === 'all' ? '4 na lista • Contagem total' : 'Concluídos no período'}
                      </p>
                    </div>

                    <div className="p-3.5 bg-red-50 rounded-xl border border-red-200 shadow-sm">
                      <p className="text-[10px] font-bold text-red-800 uppercase tracking-wide">
                        {filterPeriod === 'all' ? 'Total Cancelados' : 'Cancelados no Período'}
                      </p>
                      <p className="text-3xl font-black text-red-950 mt-1">{displayedStats.cancelados}</p>
                      <p className="text-[10px] text-red-700 font-medium mt-1">
                        {filterPeriod === 'all' ? 'Pela gestão de andaimes' : 'Cancelados no período'}
                      </p>
                    </div>
                  </div>
                </div>

                {/* PAINEL DE GERAÇÃO DIRETA DO EXCEL PARA APRESENTAR À CHEFIA */}
                <div className="bg-emerald-50/70 p-5 rounded-2xl border border-emerald-200 space-y-3">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                      <h3 className="font-extrabold text-sm text-emerald-950 flex items-center gap-2">
                        <span>📊</span> Relatório Diário de Solicitações para Apresentação à Chefia
                      </h3>
                      <p className="text-xs text-emerald-800 mt-0.5">
                        Exporta planilha do Excel (.csv) com todos os campos preenchidos pelo solicitante, status detalhados e histórico. Atualiza automaticamente a cada nova solicitação na nuvem.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={handleExportExcelDaily}
                      className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow flex items-center gap-2 whitespace-nowrap"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                      Baixar Excel Atualizado Agora
                    </button>
                  </div>
                </div>

                {/* CAPACIDADE CONTRATADA E ESTOQUE EM M3 */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Capacidade Contratada</p>
                    <p className="text-2xl font-black text-slate-800 mt-1">{totalCapacityM3} <span className="text-sm font-normal text-slate-500">m³</span></p>
                    <p className="text-[11px] text-slate-400 mt-1">Limite mensal contratado</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Em Uso Efetivo (Montado)</p>
                    <p className="text-2xl font-black text-blue-600 mt-1">{allocatedM3} <span className="text-sm font-normal text-slate-500">m³</span></p>
                    <p className="text-[11px] text-slate-400 mt-1">Montagens reais em campo</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Disponível em Estoque</p>
                    <p className={`text-2xl font-black mt-1 ${availableM3 < 50 ? 'text-red-600' : 'text-emerald-600'}`}>
                      {availableM3} <span className="text-sm font-normal text-slate-500">m³</span>
                    </p>
                    <p className="text-[11px] text-slate-400 mt-1">{((availableM3 / totalCapacityM3) * 100).toFixed(1)}% livre</p>
                  </div>
                </div>

                {/* Barra de Progresso de Ocupação */}
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-2">
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-bold text-slate-700">Taxa de Ocupação de Andaimes da Planta</span>
                    <span className="font-bold text-slate-700">{((allocatedM3 / totalCapacityM3) * 100).toFixed(1)}%</span>
                  </div>
                  <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                    <div 
                      className={`h-full transition-all duration-500 ${
                        (allocatedM3 / totalCapacityM3) > 0.85 ? 'bg-red-500' :
                        (allocatedM3 / totalCapacityM3) > 0.65 ? 'bg-amber-500' : 'bg-blue-600'
                      }`}
                      style={{ width: `${Math.min(100, (allocatedM3 / totalCapacityM3) * 100)}%` }}
                    ></div>
                  </div>
                </div>
              </div>
            )}

            {/* ABA 5: NOVA SOLICITAÇÃO (SELEÇÃO E CADASTRO DE FÁBRICA) */}
            {activeTab === 'nova' && (
              <div className="max-w-2xl mx-auto bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 className="text-base font-bold text-slate-800 mb-1">Nova Solicitação de Andaime</h2>
                <p className="text-xs text-slate-500 mb-5">Preencha os dados da atividade. A solicitação é salva automaticamente no Firebase e atualizada para todos.</p>

                <form onSubmit={handleCreateRequest} className="space-y-4">
                  
                  {/* FÁBRICA (SELECT COM OPÇÃO DE ADICIONAR NOVA) E ÁREA */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="block text-xs font-semibold text-slate-600 uppercase">Planta / Fábrica *</label>
                        {!isAddingNewFactoryInForm && (
                          <button
                            type="button"
                            onClick={() => setIsAddingNewFactoryInForm(true)}
                            className="text-[11px] text-blue-600 hover:text-blue-800 font-bold underline"
                          >
                            + Nova Fábrica
                          </button>
                        )}
                      </div>

                      {isAddingNewFactoryInForm ? (
                        <div className="space-y-1.5 animate-in fade-in">
                          <input 
                            type="text" 
                            placeholder="Digite o nome da nova fábrica..." 
                            value={newFactoryInputForm} 
                            onChange={(e) => setNewFactoryInputForm(e.target.value)} 
                            required 
                            className="w-full p-2.5 bg-blue-50 border border-blue-400 rounded-lg text-sm font-bold uppercase focus:outline-none focus:border-blue-600" 
                          />
                          <div className="flex justify-between items-center text-[10px]">
                            <span className="text-slate-500">Será salva no Firebase</span>
                            <button
                              type="button"
                              onClick={() => {
                                setIsAddingNewFactoryInForm(false);
                                setNewFactoryInputForm('');
                              }}
                              className="text-red-600 hover:underline font-bold"
                            >
                              Voltar para lista
                            </button>
                          </div>
                        </div>
                      ) : (
                        <select 
                          name="factory" 
                          value={formData.factory} 
                          onChange={(e) => {
                            if (e.target.value === '__NOVA__') {
                              setIsAddingNewFactoryInForm(true);
                              setFormData({ ...formData, factory: '' });
                            } else {
                              setFormData({ ...formData, factory: e.target.value });
                            }
                          }} 
                          required 
                          className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-500"
                        >
                          <option value="">Selecione a Fábrica / Planta *</option>
                          {factories.map((f, idx) => (
                            <option key={idx} value={f}>{f}</option>
                          ))}
                          <option value="__NOVA__">➕ Cadastrar Nova Fábrica...</option>
                        </select>
                      )}
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Área / Setor *</label>
                      <input 
                        type="text" 
                        name="area" 
                        placeholder="Ex: Caldeiras, Linha de Envase" 
                        value={formData.area} 
                        onChange={handleInputChange} 
                        required 
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm" 
                      />
                    </div>
                  </div>

                  {/* PONTO DE REFERÊNCIA */}
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Ponto de Referência / Local Exato *</label>
                    <input 
                      type="text" 
                      name="reference" 
                      placeholder="Ex: Ao lado do tanque T-102" 
                      value={formData.reference} 
                      onChange={handleInputChange} 
                      required 
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm" 
                    />
                  </div>

                  {/* QUAL ATIVIDADE SERÁ REALIZADA */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1 flex items-center gap-1.5">
                      <span>🔧</span> Qual atividade será realizada? *
                    </label>
                    <textarea 
                      name="activityDescription" 
                      rows="2"
                      placeholder="Descreva detalhadamente o serviço a ser feito no local..." 
                      value={formData.activityDescription} 
                      onChange={handleInputChange} 
                      required 
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"
                    ></textarea>
                  </div>

                  {/* É POSSÍVEL REALIZAR COM PEMT? SIM / NÃO */}
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <label className="block text-xs font-bold text-slate-800 uppercase tracking-wide">
                      É possível realizar a atividade com PEMT (Plataforma Elevatória Móvel de Trabalho)? *
                    </label>
                    
                    <div className="grid grid-cols-2 gap-3">
                      <button
                        type="button"
                        onClick={() => setFormData({ ...formData, canUsePEMT: 'NÃO', pemtJustification: '' })}
                        className={`py-2.5 px-4 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-2 ${
                          formData.canUsePEMT === 'NÃO'
                            ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                        }`}
                      >
                        <span>✕</span> NÃO
                      </button>

                      <button
                        type="button"
                        onClick={() => setFormData({ ...formData, canUsePEMT: 'SIM' })}
                        className={`py-2.5 px-4 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-2 ${
                          formData.canUsePEMT === 'SIM'
                            ? 'bg-amber-600 text-white border-amber-600 shadow-sm'
                            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                        }`}
                      >
                        <span>✓</span> SIM
                      </button>
                    </div>

                    {/* SE SIM -> JUSTIFICATIVA OBRIGATÓRIA */}
                    {formData.canUsePEMT === 'SIM' && (
                      <div className="pt-2 animate-in fade-in">
                        <label className="block text-xs font-bold text-amber-900 uppercase mb-1">
                          Justificativa para montagem de andaime *
                        </label>
                        <textarea 
                          name="pemtJustification" 
                          rows="2"
                          placeholder="Informe a justificativa técnica para optar pelo andaime..." 
                          value={formData.pemtJustification} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-amber-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:border-amber-500"
                        ></textarea>
                      </div>
                    )}
                  </div>

                  {/* RESPONSÁVEL PELA ATIVIDADE, EMAIL E TELEFONE */}
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div className="flex items-center justify-between">
                      <label className="text-xs font-bold text-slate-700 uppercase tracking-wide flex items-center gap-1.5">
                        <span>👷</span> Responsável pela Atividade (Dono do Serviço no Local) *
                      </label>
                      <span className="text-[10px] text-slate-500 font-medium">Pode ser diferente do solicitante logado</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome do Responsável *</label>
                        <input 
                          type="text" 
                          name="activityResponsible" 
                          placeholder="Nome do responsável" 
                          value={formData.activityResponsible} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm" 
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mail do Responsável *</label>
                        <input 
                          type="email" 
                          name="email" 
                          placeholder="responsavel@empresa.com" 
                          value={formData.email} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm" 
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Telefone / Ramal *</label>
                        <input 
                          type="text" 
                          name="phone" 
                          placeholder="(XX) 99999-9999" 
                          value={formData.phone} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm" 
                        />
                      </div>
                    </div>
                  </div>

                  {/* DATA PREVISTA PARA MONTAGEM E DESMONTAGEM */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">
                        Data Prevista para Montagem *
                      </label>
                      <input 
                        type="date" 
                        name="dueDate" 
                        value={formData.dueDate} 
                        onChange={handleInputChange} 
                        required 
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold focus:outline-none focus:border-blue-500" 
                      />
                      <p className="text-[10px] text-slate-400 mt-1">Define a prioridade na fila de montagem da equipe.</p>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">
                        Data Prevista para Desmontagem
                      </label>
                      <input 
                        type="date" 
                        name="expectedDismantleDate" 
                        value={formData.expectedDismantleDate} 
                        onChange={handleInputChange} 
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold focus:outline-none focus:border-blue-500" 
                      />
                      <p className="text-[10px] text-slate-400 mt-1">Estimativa de liberação e desmontagem do andaime.</p>
                    </div>
                  </div>

                  <div className="flex items-center pt-1">
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input 
                        type="checkbox" 
                        name="isUrgent" 
                        checked={formData.isUrgent} 
                        onChange={handleInputChange} 
                        className="w-4 h-4 text-red-600 rounded border-slate-300" 
                      />
                      <span className="text-xs font-bold text-red-600">Marcar como URGÊNCIA OPERACIONAL</span>
                    </label>
                  </div>

                  {/* DIMENSÕES ESTIMADAS */}
                  <div className="border-t border-slate-200 pt-4">
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-2">Dimensões Estimadas (Metros)</label>
                    <div className="grid grid-cols-3 gap-3">
                      <div>
                        <span className="text-[11px] text-slate-500">Largura (m)</span>
                        <input type="number" step="0.1" name="width" placeholder="Ex: 2" value={formData.width} onChange={handleInputChange} required className="w-full p-2 bg-slate-50 border border-slate-300 rounded text-sm" />
                      </div>
                      <div>
                        <span className="text-[11px] text-slate-500">Comprimento (m)</span>
                        <input type="number" step="0.1" name="length" placeholder="Ex: 3" value={formData.length} onChange={handleInputChange} required className="w-full p-2 bg-slate-50 border border-slate-300 rounded text-sm" />
                      </div>
                      <div>
                        <span className="text-[11px] text-slate-500">Altura (m)</span>
                        <input type="number" step="0.1" name="height" placeholder="Ex: 4" value={formData.height} onChange={handleInputChange} required className="w-full p-2 bg-slate-50 border border-slate-300 rounded text-sm" />
                      </div>
                    </div>

                    <div className="mt-3 p-3 bg-slate-50 rounded-lg flex justify-between text-xs font-semibold text-slate-700">
                      <span>Área de Base Estimada: {calcBaseArea.toFixed(1)} m²</span>
                      <span className="text-blue-600">Volume Total Estimado: {calcVolume.toFixed(1)} m³</span>
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm">
                    Enviar Solicitação para a Fila (Salvar na Nuvem)
                  </button>
                </form>
              </div>
            )}

            {/* ABA 6: GESTÃO, FÁBRICAS & LOGINS (EXCLUSIVO GESTOR) */}
            {activeTab === 'gestao' && isGestor && (
              <div className="space-y-6 max-w-4xl mx-auto">
                {/* 1. GERENCIAMENTO DE FÁBRICAS / PLANTAS */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div>
                      <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                        <span>🏢</span> Gerenciamento de Plantas e Fábricas
                      </h3>
                      <p className="text-xs text-slate-500">
                        Adicione ou remova fábricas disponíveis no sistema. Salvo automaticamente no Firebase para todos.
                      </p>
                    </div>
                    <span className="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-full text-xs font-bold">
                      {factories.length} fábricas
                    </span>
                  </div>

                  {/* Adicionar Nova Fábrica */}
                  <form 
                    onSubmit={(e) => {
                      e.preventDefault();
                      if (newFactoryInputManage.trim()) {
                        handleAddFactory(newFactoryInputManage);
                        setNewFactoryInputManage('');
                      }
                    }}
                    className="flex gap-2"
                  >
                    <input 
                      type="text" 
                      placeholder="Nome da nova fábrica (Ex: PRÉDIO MILKA, CALDEIRAS...)" 
                      value={newFactoryInputManage}
                      onChange={(e) => setNewFactoryInputManage(e.target.value)}
                      className="flex-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold uppercase focus:outline-none focus:border-blue-500"
                    />
                    <button 
                      type="submit" 
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg shadow transition flex items-center gap-1"
                    >
                      <span>+</span> Adicionar Fábrica
                    </button>
                  </form>

                  {/* Lista de Fábricas Cadastradas */}
                  <div className="flex flex-wrap gap-2 pt-2">
                    {factories.map((f, i) => (
                      <span key={i} className="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-100 border border-slate-300 rounded-lg text-xs font-bold text-slate-700">
                        <span>🏢</span> {f}
                        <button 
                          onClick={() => handleRemoveFactory(f)}
                          className="text-slate-400 hover:text-red-600 font-bold ml-1"
                          title="Remover fábrica da lista"
                        >
                          &times;
                        </button>
                      </span>
                    ))}
                  </div>
                </div>

                {/* 2. GERENCIAMENTO DE LOGINS E ACESSOS */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div>
                      <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                        <span>👥</span> Controle e Exclusão de Logins Cadastrados
                      </h3>
                      <p className="text-xs text-slate-500">
                        O Gestor pode excluir acessos não mais autorizados ou cadastrados incorretamente.
                      </p>
                    </div>
                    <span className="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full text-xs font-bold">
                      {users.length} usuários
                    </span>
                  </div>

                  <div className="divide-y divide-slate-100">
                    {users.map((u) => {
                      const isMe = currentUser && u.email.toLowerCase() === currentUser.email.toLowerCase();
                      return (
                        <div key={u.id || u.email} className="py-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-sm text-slate-800">{u.name}</span>
                              {isMe && (
                                <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.2 rounded-full">
                                  Você
                                </span>
                              )}
                            </div>
                            <p className="text-xs text-slate-500">{u.email}</p>
                            <span className={`inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded ${
                              u.role === 'Gestor de Andaimes' ? 'bg-purple-100 text-purple-800' :
                              u.role === 'Equipe de Andaimes' ? 'bg-blue-100 text-blue-800' :
                              'bg-slate-100 text-slate-700'
                            }`}>
                              {u.role}
                            </span>
                          </div>

                          <div>
                            {isMe ? (
                              <span className="text-xs text-slate-400 italic">Sessão Atual</span>
                            ) : (
                              <button 
                                onClick={() => handleDeleteUser(u)}
                                className="px-3 py-1.5 bg-red-50 hover:bg-red-600 text-red-600 hover:text-white border border-red-200 rounded-lg text-xs font-bold transition flex items-center gap-1.5"
                                title="Excluir o login deste usuário do sistema"
                              >
                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                Excluir Login
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 3. SINCRONIZAÇÃO E RECALIBRAÇÃO DE INDICADORES */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                        <span>🔄</span> Sincronização e Ajuste de Indicadores
                      </h3>
                      <p className="text-xs text-slate-500">Recalcula os dados reais de solicitações, montados e desmontados diretamente com a nuvem.</p>
                    </div>
                    <button 
                      onClick={handleSyncIndicatorsWithDatabase}
                      className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg text-xs transition shadow flex items-center gap-1.5"
                    >
                      <span>🔄</span> Forçar Sincronização Agora
                    </button>
                  </div>
                </div>

                {/* 4. AJUSTE DE CAPACIDADE CONTRATADA */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                  <h3 className="font-bold text-base text-slate-800">Ajuste de Capacidade Máxima Contratada</h3>
                  <p className="text-xs text-slate-500">Ajuste o volume total em m³ contratado junto à montadora. Salvo no Firebase para todos.</p>
                  
                  <div className="flex items-center space-x-3 pt-2">
                    <input 
                      type="number" 
                      value={totalCapacityM3} 
                      onChange={(e) => handleUpdateCapacity(Number(e.target.value) || 0)} 
                      className="p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm w-36 font-bold" 
                    />
                    <span className="text-sm font-semibold text-slate-600">m³ Contratados</span>
                  </div>
                </div>

                {/* 5. BACKUP E SEGURANÇA DOS DADOS (EXPORTAR A CADA 2 DIAS) */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="border-b border-slate-100 pb-3">
                    <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                      <span>💾</span> Cópia de Segurança e Backup do Banco de Dados
                    </h3>
                    <p className="text-xs text-slate-500 mt-1">
                      Exporte o banco de dados completo a cada 2 dias para manter uma cópia offline salva no seu computador.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {/* Exportação JSON */}
                    <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                      <p className="font-bold text-xs text-slate-800 flex items-center gap-1.5">
                        <span>📥</span> Exportar Banco Completo (.json)
                      </p>
                      <p className="text-[11px] text-slate-500">
                        Exporta todas as solicitações, histórico, usuários, estoques de fábricas e indicadores em formato padrão para restauração.
                      </p>
                      <button
                        type="button"
                        onClick={handleDownloadBackupJSON}
                        className="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-2"
                      >
                        Baixar Backup JSON Completo
                      </button>
                    </div>

                    {/* Exportação Excel */}
                    <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200 space-y-2">
                      <p className="font-bold text-xs text-emerald-950 flex items-center gap-1.5">
                        <span>📊</span> Exportar Planilha Excel (.csv)
                      </p>
                      <p className="text-[11px] text-emerald-800">
                        Gera planilha completa compatível com Microsoft Excel para relatórios operacionais da gerência e auditoria.
                      </p>
                      <button
                        type="button"
                        onClick={handleExportExcelDaily}
                        className="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold transition flex items-center justify-center gap-2"
                      >
                        Baixar Planilha Excel (.csv)
                      </button>
                    </div>
                  </div>

                  {/* Restaurar Backup */}
                  <div className="p-3 bg-amber-50 rounded-xl border border-amber-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div>
                      <p className="font-bold text-xs text-amber-950">Restaurar Cópia de Segurança</p>
                      <p className="text-[11px] text-amber-800">Se precisar recuperar dados anteriores, selecione o arquivo .json baixado anteriormente.</p>
                    </div>
                    <label className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-bold cursor-pointer transition">
                      Selecionar Arquivo de Backup
                      <input type="file" accept=".json" onChange={handleRestoreBackupJSON} className="hidden" />
                    </label>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL: RELATÓRIO PDF EXECUTIVO DE CONTROLE DOS INDICADORES SEPARADO POR FÁBRICA */}
          {isPdfModalOpen && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 overflow-y-auto p-2 sm:p-6 flex justify-center">
              <div className="bg-white rounded-2xl shadow-2xl max-w-5xl w-full p-4 sm:p-8 space-y-6 print-modal-container my-auto">
                
                {/* Barra de Ações Superior (Oculta na impressão do PDF) */}
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-200 pb-4 no-print">
                  <div>
                    <h2 className="text-lg font-black text-slate-800 flex items-center gap-2">
                      <span>📄</span> Visualização do Relatório Executivo de Indicadores
                    </h2>
                    <p className="text-xs text-slate-500">
                      Configure os filtros e clique no botão verde para gerar ou salvar em PDF.
                    </p>
                  </div>

                  <div className="flex items-center gap-2 flex-wrap">
                    {/* Filtro de Fábrica para o PDF */}
                    <select
                      value={pdfFactoryFilter}
                      onChange={(e) => setPdfFactoryFilter(e.target.value)}
                      className="p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-slate-800"
                    >
                      <option value="ALL">🏢 Todas as Fábricas</option>
                      {factories.map((f, i) => (
                        <option key={i} value={f.toUpperCase()}>{f}</option>
                      ))}
                    </select>

                    <button
                      type="button"
                      onClick={() => window.print()}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs shadow-md transition flex items-center gap-1.5"
                    >
                      <span>🖨️</span> Salvar em PDF / Imprimir
                    </button>

                    <button
                      type="button"
                      onClick={() => setIsPdfModalOpen(false)}
                      className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg text-xs transition"
                    >
                      Fechar ✕
                    </button>
                  </div>
                </div>

                {/* CORPO DO RELATÓRIO FORMATADO PARA A4 / PDF */}
                <div className="space-y-6 text-slate-800">
                  
                  {/* CABEÇALHO DO RELATÓRIO */}
                  <div className="flex justify-between items-start border-b-2 border-slate-800 pb-4">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="p-2 bg-blue-600 text-white rounded font-black text-sm">INSPECTCBM</span>
                        <h1 className="text-xl font-black text-slate-900 tracking-wide uppercase">
                          Relatório de Controle de Andaimes
                        </h1>
                      </div>
                      <p className="text-xs text-slate-600 mt-1 font-semibold">
                        Gestão Operacional, Fila de Espera, Ocupação em M³ e Montagens por Fábrica
                      </p>
                    </div>

                    <div className="text-right text-xs space-y-0.5">
                      <p><span className="font-bold">Data de Emissão:</span> {new Date().toLocaleDateString('pt-BR')} às {new Date().toLocaleTimeString('pt-BR')}</p>
                      <p><span className="font-bold">Emitido por:</span> {currentUser ? `${currentUser.name} (${currentUser.role})` : 'Sistema'}</p>
                      <p><span className="font-bold">Período:</span> {filterPeriodLabel}</p>
                    </div>
                  </div>

                  {/* RESUMO GERAL CONSOLIDADO DA PLANTA */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-300 space-y-3">
                    <h3 className="text-xs font-black uppercase tracking-wider text-slate-700">
                      1. Indicadores Consolidados da Planta
                    </h3>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                      <div className="p-2 bg-white rounded-lg border border-slate-200">
                        <span className="text-[10px] text-slate-500 font-bold uppercase block">Solicitações na Fila</span>
                        <span className="text-2xl font-black text-amber-900">{displayedStats.solicitados}</span>
                      </div>
                      <div className="p-2 bg-white rounded-lg border border-slate-200">
                        <span className="text-[10px] text-slate-500 font-bold uppercase block">Montados em Campo</span>
                        <span className="text-2xl font-black text-emerald-900">{displayedStats.montados}</span>
                      </div>
                      <div className="p-2 bg-white rounded-lg border border-slate-200">
                        <span className="text-[10px] text-slate-500 font-bold uppercase block">Desmontados Concluídos</span>
                        <span className="text-2xl font-black text-slate-900">{displayedStats.desmontados}</span>
                      </div>
                      <div className="p-2 bg-white rounded-lg border border-slate-200">
                        <span className="text-[10px] text-slate-500 font-bold uppercase block">Cancelados</span>
                        <span className="text-2xl font-black text-red-900">{displayedStats.cancelados}</span>
                      </div>
                    </div>

                    <div className="flex justify-between items-center text-xs font-bold pt-2 border-t border-slate-200">
                      <span>Volume Ocupado em Campo: <span className="text-blue-700">{allocatedM3} m³</span></span>
                      <span>Capacidade Total Contratada: <span>{totalCapacityM3} m³</span></span>
                      <span>Taxa de Ocupação da Planta: <span className={allocatedM3 > totalCapacityM3 * 0.85 ? 'text-red-600' : 'text-emerald-700'}>{((allocatedM3 / totalCapacityM3) * 100).toFixed(1)}%</span></span>
                    </div>
                  </div>

                  {/* SEÇÃO 2: DETALHAMENTO SEPARADO POR FÁBRICA */}
                  <div className="space-y-6 pt-2">
                    <h3 className="text-sm font-black uppercase tracking-wider text-slate-900 border-b border-slate-300 pb-2 flex items-center justify-between">
                      <span>2. Detalhamento dos Indicadores Separado por Fábrica</span>
                      <span className="text-xs font-normal text-slate-500">
                        {pdfFactoryFilter === 'ALL' ? 'Todas as Fábricas' : `Fábrica: ${pdfFactoryFilter}`}
                      </span>
                    </h3>

                    {Object.keys(requestsByFactory)
                      .filter(fName => pdfFactoryFilter === 'ALL' || fName === pdfFactoryFilter)
                      .map(fName => {
                        const factoryRequests = requestsByFactory[fName] || [];
                        const fQueue = factoryRequests.filter(r => ['Avaliação', 'Iniciado Montagem', 'Em Movimentação'].includes(r.status));
                        const fMounted = factoryRequests.filter(r => ['Montado', 'Liberado para Desmontagem'].includes(r.status));
                        const fDismantled = factoryRequests.filter(r => r.status === 'Desmontado');
                        const fVolM3 = fMounted.reduce((sum, r) => sum + ((r.realVolumeM3 !== null && r.realVolumeM3 !== undefined) ? r.realVolumeM3 : r.volumeM3), 0);

                        return (
                          <div key={fName} className="border border-slate-300 rounded-xl overflow-hidden print-page-break-inside-avoid">
                            {/* Cabeçalho da Fábrica */}
                            <div className="bg-slate-800 text-white p-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                              <div className="flex items-center gap-2">
                                <span className="px-2 py-0.5 bg-blue-600 text-white rounded text-xs font-bold uppercase">FÁBRICA</span>
                                <span className="font-black text-sm uppercase tracking-wide">{fName}</span>
                              </div>
                              <div className="flex gap-4 text-xs">
                                <span>Fila: <strong>{fQueue.length}</strong></span>
                                <span>Montados: <strong>{fMounted.length} ({fVolM3} m³)</strong></span>
                                <span>Desmontados: <strong>{fDismantled.length}</strong></span>
                              </div>
                            </div>

                            {/* Tabela de Andaimes da Fábrica */}
                            {factoryRequests.length > 0 ? (
                              <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs border-collapse">
                                  <thead>
                                    <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-300 text-[10px] uppercase">
                                      <th className="p-2">ID</th>
                                      <th className="p-2">Área / Ponto Ref</th>
                                      <th className="p-2">Atividade / PEMT</th>
                                      <th className="p-2">Dimensões / Vol.</th>
                                      <th className="p-2">Responsável</th>
                                      <th className="p-2">Prazo</th>
                                      <th className="p-2 text-right">Status</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-200">
                                    {factoryRequests.map((r) => {
                                      const hasReal = r.realVolumeM3 !== null && r.realVolumeM3 !== undefined;
                                      return (
                                        <tr key={r.id} className="hover:bg-slate-50">
                                          <td className="p-2 font-bold text-slate-900">{r.id}</td>
                                          <td className="p-2">
                                            <p className="font-semibold text-slate-800">{r.area}</p>
                                            <p className="text-[10px] text-slate-500">{r.reference}</p>
                                          </td>
                                          <td className="p-2 max-w-[200px]">
                                            <p className="font-medium text-slate-800 truncate" title={r.activityDescription}>{r.activityDescription || 'Não informada'}</p>
                                            <p className="text-[10px] text-slate-500">PEMT: <strong>{r.canUsePEMT || 'NÃO'}</strong></p>
                                          </td>
                                          <td className="p-2">
                                            {hasReal ? (
                                              <span className="font-bold text-blue-700">{r.realWidth}x{r.realLength}x{r.realHeight}m ({r.realVolumeM3} m³)</span>
                                            ) : (
                                              <span className="text-slate-600">{r.width}x{r.length}x{r.height}m ({r.volumeM3} m³)</span>
                                            )}
                                          </td>
                                          <td className="p-2">
                                            <p className="font-semibold text-slate-800">{r.responsible}</p>
                                            <p className="text-[10px] text-slate-500">{r.phone || r.email || ''}</p>
                                          </td>
                                          <td className="p-2 font-medium">{r.dueDate || '-'}</td>
                                          <td className="p-2 text-right">
                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                              r.status === 'Montado' ? 'bg-emerald-100 text-emerald-800' :
                                              r.status === 'Avaliação' ? 'bg-amber-100 text-amber-800' :
                                              r.status === 'Desmontado' ? 'bg-slate-200 text-slate-700' :
                                              'bg-blue-100 text-blue-800'
                                            }`}>
                                              {r.status}
                                            </span>
                                          </td>
                                        </tr>
                                      );
                                    })}
                                  </tbody>
                                </table>
                              </div>
                            ) : (
                              <div className="p-4 text-center text-xs text-slate-400 bg-white">
