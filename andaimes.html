    // Compressor em tempo real de fotos para celulares (otimiza para ~60KB-90KB evitando limite de 1MB do Firestore)
    const compressImage = (file, maxWidth = 1000, quality = 0.65) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxWidth) {
                width = Math.round((width * maxWidth) / height);
                height = maxWidth;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    // Parser ultra-robusto de datas para formatos PT-BR e ISO
    const parseCustomDate = (dateVal) => {
      if (!dateVal) return null;
      if (dateVal instanceof Date) return isNaN(dateVal.getTime()) ? null : dateVal;
      if (typeof dateVal === 'object' && typeof dateVal.toDate === 'function') {
        return dateVal.toDate();
      }
      if (typeof dateVal === 'object' && typeof dateVal.seconds === 'number') {
        return new Date(dateVal.seconds * 1000);
      }
      if (typeof dateVal === 'number') {
        const d = new Date(dateVal);
        return isNaN(d.getTime()) ? null : d;
      }
      const str = String(dateVal).trim();
      if (!str) return null;

      // Formato YYYY-MM-DD ou YYYY-MM-DDTHH:mm:ss
      const ymdMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
      if (ymdMatch) {
        const y = parseInt(ymdMatch[1], 10);
        const m = parseInt(ymdMatch[2], 10) - 1;
        const d = parseInt(ymdMatch[3], 10);
        const hr = ymdMatch[4] !== undefined ? parseInt(ymdMatch[4], 10) : 12;
        const min = ymdMatch[5] !== undefined ? parseInt(ymdMatch[5], 10) : 0;
        const sec = ymdMatch[6] !== undefined ? parseInt(ymdMatch[6], 10) : 0;
        return new Date(y, m, d, hr, min, sec);
      }

      // Formato brasileiro DD/MM/YYYY com ou sem hora
      const ptMatch = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (ptMatch) {
        const d = parseInt(ptMatch[1], 10);
        const m = parseInt(ptMatch[2], 10) - 1;
        const y = parseInt(ptMatch[3], 10);
        const timeMatch = str.match(/(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/);
        const hr = timeMatch ? parseInt(timeMatch[1], 10) : 12;
        const min = timeMatch ? parseInt(timeMatch[2], 10) : 0;
        const sec = timeMatch && timeMatch[3] ? parseInt(timeMatch[3], 10) : 0;
        return new Date(y, m, d, hr, min, sec);
      }

      const parsed = new Date(str);
      return isNaN(parsed.getTime()) ? null : parsed;
    };

    // Extrai número da solicitação: SOL-1001 -> 1001 (para ordenação crescente ilimitada)
    const extractSolNumber = (idStr) => {
      if (!idStr) return 0;
      const m = String(idStr).match(/SOL-(\d+)/i);
      return m ? parseInt(m[1], 10) : 0;
    };

    // Verificador robusto de período de data para os Indicadores
    const isDateInFilter = (dateObj, period) => {
      if (!dateObj || isNaN(dateObj.getTime())) return period === 'all';
      if (period === 'all') return true;

      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
      const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

      if (period === 'today') {
        return dateObj >= startOfToday && dateObj <= endOfToday;
      }

      if (period === 'week') {
        // Cobre tanto a semana corrente (a partir de domingo) quanto os últimos 7 dias completos
        const dayOfWeek = now.getDay();
        const startOfCalWeek = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek, 0, 0, 0, 0);
        const sevenDaysAgo = new Date(startOfToday.getTime() - (6 * 24 * 60 * 60 * 1000));
        const weekStart = startOfCalWeek < sevenDaysAgo ? startOfCalWeek : sevenDaysAgo;
        return dateObj >= weekStart && dateObj <= endOfToday;
      }

      if (period === 'month') {
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
        const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
        return dateObj >= startOfMonth && dateObj <= endOfMonth;
      }

      return true;
    };

    function App() {

      // Estado para Estoque de Andaimes Desmontados em Fábricas (declarado antes do useMemo)

      // Metragem total de andaimes desmontados guardados em fábricas
      const totalMetersStored = useMemo(() => {

      }, [dismantledStorageList]);
      const [isCloudConnected, setIsCloudConnected] = useState(true);

      // Eventos históricos (desmontagens e cancelamentos) para os filtros de período

      // Modo de ordenação das solicitações: 'id_asc' (SOL-10... ordem crescente sem limites) ou 'due_date'

      // Estado para o Modal / Relatório PDF dos Indicadores

      // Modais
      const [visitModalReqId, setVisitModalReqId] = useState(null);

      const [storageSearchTerm, setStorageSearchTerm] = useState('');
      const [storageFormData, setStorageFormData] = useState({

      // Estado para Gerador de Planilha Excel Diária para a Chefia
      const [isExcelModalOpen, setIsExcelModalOpen] = useState(false);
      const [excelDatePeriod, setExcelDatePeriod] = useState('all');
      const [excelCustomStart, setExcelCustomStart] = useState('');
      const [excelCustomEnd, setExcelCustomEnd] = useState('');
      const [excelStatusFilter, setExcelStatusFilter] = useState('ALL');
      const [excelFactoryFilter, setExcelFactoryFilter] = useState('ALL');

      // Ordenar fila de espera pela data limite
      const sortQueueByDueDate = (reqList) => {
        const queueStatuses = ['Avaliação', 'Iniciado Montagem', 'Em Movimentação'];
        const inQueue = reqList.filter(r => queueStatuses.includes(r.status));
        const notInQueue = reqList.filter(r => !queueStatuses.includes(r.status));

        inQueue.sort((a, b) => {
          const dateA = a.dueDate || '9999-99-99';
          const dateB = b.dueDate || '9999-99-99';
          if (dateA !== dateB) return dateA.localeCompare(dateB);
          if (a.isUrgent !== b.isUrgent) return a.isUrgent ? -1 : 1;
          return (a.id || '').localeCompare(b.id || '');
        });

        inQueue.forEach((r, idx) => {
          r.queueOrder = idx + 1;
        });

        return [...inQueue, ...notInQueue];
      };

      // Solicitações ativas carregadas do Firestore
      const [requests, setRequests] = useState([]);

      // Sincronização em tempo real com Firestore
      useEffect(() => {

        const unsubRequests = db.collection('andaimes_solicitacoes').onSnapshot((snapshot) => {

            snapshot.forEach(doc => {

            setRequests(list);
            setIsCloudConnected(true);

            // Auto-otimização: manter apenas os 4 últimos desmontados na nuvem e apagar fotos
            const dismantledList = list.filter(r => r.status === 'Desmontado');
            
            // Limpa fotos de qualquer desmontado que ainda tenha foto salva

            // Se houver mais de 4 desmontados salvos, remove os mais antigos além do 4º mantendo a contagem acumulada
            if (dismantledList.length > 4) {
              dismantledList.sort((a, b) => {
                const tA = a.dismantledTimestamp || (a.history ? parseCustomDate(a.history[a.history.length - 1]?.date)?.getTime() : 0) || 0;

              const excess = dismantledList.slice(4);
              excess.forEach(async (oldDismantled) => {

        // 2. Escuta usuários cadastrados
        const unsubUsers = db.collection('andaimes_usuarios').onSnapshot((snapshot) => {
          if (!isMounted) return;

        // 3. Escuta capacidade contratada
        const unsubConfig = db.collection('andaimes_config').doc('geral').onSnapshot((doc) => {
          if (!isMounted) return;
          if (doc.exists && doc.data().totalCapacityM3) {
            setTotalCapacityM3(doc.data().totalCapacityM3);

        }, () => {});

        // 4. Escuta dados de arquivo/indicadores históricos
        const unsubStats = db.collection('andaimes_config').doc('indicadores').onSnapshot((doc) => {
          if (!isMounted) return;
          if (doc.exists) {
            const data = doc.data();
            setArchivedStats({
              extraDesmontados: data.extraDesmontados || 0,
              extraCancelados: data.extraCancelados || 0,

            });

        // 5. Escuta lista de fábricas
        const unsubFactories = db.collection('andaimes_config').doc('fabricas').onSnapshot((doc) => {
          if (!isMounted) return;
          if (doc.exists && Array.isArray(doc.data().list) && doc.data().list.length > 0) {
            setFactories(doc.data().list);
          } else {
            db.collection('andaimes_config').doc('fabricas').set({ list: DEFAULT_FACTORIES }).catch(() => {});

        // 6. Escuta estoque de materiais desmontados em fábricas (Equipe de Andaimes)
        const unsubStorage = db.collection('andaimes_materiais_desmontados').onSnapshot((snapshot) => {

        return () => {

          unsubUsers();
          unsubConfig();
          unsubStats();
          unsubFactories();
          unsubStorage();
          unsubEvents();

      // Adicionar Nova Fábrica no Firebase
      const handleAddFactory = async (newFactoryName) => {

        try {

      // Formulário Nova Solicitação
      const [formData, setFormData] = useState({

        length: '',
        height: ''
      });

      const calcVolume = calcBaseArea * (Number(formData.height) || 0);

      // Volume em m³ em uso efetivo (montados)

        .filter(r => r.status === 'Montado' || r.status === 'Liberado para Desmontagem')
        .reduce((acc, curr) => {

        }, 0);
      
      const availableM3 = totalCapacityM3 - allocatedM3;

      const todayStr = new Date().toISOString().split('T')[0];

      // Listas de Trabalho por Status Real
      // Solicitações na fila com suporte a ordenação crescente (SOL-10...) ou por prazo
      const queueRequests = useMemo(() => {
        const list = requests.filter(r => ['Avaliação', 'Iniciado Montagem', 'Em Movimentação'].includes(r.status));
        if (solicitacoesSortMode === 'id_asc') {
          return [...list].sort((a, b) => extractSolNumber(a.id) - extractSolNumber(b.id));
        } else {
          return sortQueueByDueDate(list);
        }
      }, [requests, solicitacoesSortMode]);

      const mountedRequests = requests
        .filter(r => ['Montado', 'Liberado para Desmontagem'].includes(r.status));

      const dismantledRequests = requests
        .filter(r => r.status === 'Desmontado');

      const cancelledRequests = requests
        .filter(r => r.status === 'Cancelado');

      // Apenas os 4 últimos desmontados (mais recentes primeiro para controle)
      const displayedDismantled = useMemo(() => {
        const list = requests.filter(r => r.status === 'Desmontado');
        return [...list].sort((a, b) => {
          const tA = a.dismantledTimestamp || (a.history ? parseCustomDate(a.history[a.history.length - 1]?.date)?.getTime() : 0) || 0;
          const tB = b.dismantledTimestamp || (b.history ? parseCustomDate(b.history[b.history.length - 1]?.date)?.getTime() : 0) || 0;
          return tB - tA; // mais recentes primeiro
        }).slice(0, 4);
      }, [requests]);

      // Agrupamento dos Andaimes por Fábrica para o Relatório e PDF
      const requestsByFactory = useMemo(() => {
        const map = {};

        // Adiciona fábricas conhecidas
        factories.forEach(f => {
          map[f.toUpperCase()] = [];
        });

        // Agrupa solicitações
        requests.forEach(r => {
          const fName = (r.factory || 'OUTRAS').trim().toUpperCase();
          if (!map[fName]) map[fName] = [];
          map[fName].push(r);
        });

        return map;
      }, [requests, factories]);

      // CÁLCULO DINÂMICO E PRECISO DOS INDICADORES CONFORME FILTRO DE PERÍODO (Geral, Este Mês, Esta Semana, Hoje)
      const displayedStats = useMemo(() => {
        if (filterPeriod === 'all') {
          return {
            solicitados: queueRequests.length,
            montados: mountedRequests.length,
            desmontados: dismantledRequests.length + (archivedStats.extraDesmontados || 0),
            cancelados: cancelledRequests.length + (archivedStats.extraCancelados || 0),
            totalGeralCriado: requests.length + (archivedStats.extraDesmontados || 0) + (archivedStats.extraCancelados || 0)
          };
        }

        let solCount = 0;
        let montCount = 0;
        let desCount = 0;
        let cancCount = 0;

        const countedDismantled = new Set();
        const countedCancelled = new Set();

        requests.forEach(r => {
          const createdDate = parseCustomDate(r.createdAt) || (r.history && r.history[0] ? parseCustomDate(r.history[0].date) : null);
          if (isDateInFilter(createdDate, filterPeriod)) {
            solCount++;
          }

          // DETECÇÃO ESTRITA DE MONTAGEM EFETIVADA (ignora planejamento, datas previstas e visitas)
          let mountDate = null;
          if (r.mountedAt) {
            mountDate = parseCustomDate(r.mountedAt);
          } else if (r.history) {
            const mountEntry = r.history.find(h => {
              if (!h.action) return false;
              const a = h.action.toLowerCase();
              if (
                a.includes('montagem iniciada') ||
                a.includes('iniciado montagem') ||
                a.includes('iniciar montagem') ||
                a.includes('montagem prevista') ||
                a.includes('prev. montagem') ||
                a.includes('datas alinhadas') ||
                a.includes('solicitação criada') ||
                a.includes('visita técnica')
              ) {
                return false;
              }
              return (
                a.includes('andaime montado') ||
                a.includes('alterado para montado') ||
                a.includes('alterado para: montado') ||
                a.includes('montagem concluída')
              );
            });
            if (mountEntry) mountDate = parseCustomDate(mountEntry.date);
          }
          if (mountDate && isDateInFilter(mountDate, filterPeriod)) {
            montCount++;
          }

          // DETECÇÃO ESTRITA DE DESMONTAGEM EFETIVADA
          let dismDate = null;
          if (r.dismantledAt) {
            dismDate = parseCustomDate(r.dismantledAt);
          } else if (r.history) {
            const dismEntry = r.history.find(h => {
              if (!h.action) return false;
              const a = h.action.toLowerCase();
              if (
                a.includes('desmontagem prevista') ||
                a.includes('solicitada a desmontagem') ||
                a.includes('solicitado desmontagem') ||
                a.includes('liberado para desmontagem')
              ) {
                return false;
              }
              return a.includes('desmontado') || a.includes('desmontagem concluída');
            });
            if (dismEntry) dismDate = parseCustomDate(dismEntry.date);
          }
          if (r.status === 'Desmontado' && dismDate && isDateInFilter(dismDate, filterPeriod)) {
            desCount++;
            countedDismantled.add(r.id);
          }

          // DETECÇÃO ESTRITA DE CANCELAMENTO
          let cancDate = null;
          if (r.cancelledAt) {
            cancDate = parseCustomDate(r.cancelledAt);
          } else if (r.history) {
            const cancEntry = r.history.find(h => {
              if (!h.action) return false;
              const a = h.action.toLowerCase();
              return a.includes('solicitação cancelada') || a.includes('cancelado');
            });
            if (cancEntry) cancDate = parseCustomDate(cancEntry.date);
          }
          if (r.status === 'Cancelado' && cancDate && isDateInFilter(cancDate, filterPeriod)) {
            cancCount++;
            countedCancelled.add(r.id);
          }
        });

        // Contabiliza também eventos históricos arquivados (desmontados e cancelados antigos)
        historicalEvents.forEach(ev => {
          const evDate = parseCustomDate(ev.timestamp || ev.date || ev.dateStr);
          if (isDateInFilter(evDate, filterPeriod)) {
            if (ev.type === 'DESMONTADO' && !countedDismantled.has(ev.reqId)) {
              countedDismantled.add(ev.reqId);
              desCount++;
            }
            if (ev.type === 'CANCELADO' && !countedCancelled.has(ev.reqId)) {
              countedCancelled.add(ev.reqId);
              cancCount++;
            }
          }
        });

        return {
          solicitados: solCount,
          montados: montCount,
          desmontados: desCount,
          cancelados: cancCount,
          totalGeralCriado: solCount
        };
      }, [filterPeriod, requests, historicalEvents, queueRequests.length, mountedRequests.length, dismantledRequests.length, cancelledRequests.length, archivedStats]);

      const filterPeriodLabel = useMemo(() => {
        if (filterPeriod === 'all') return 'Geral (Todo o Histórico da Planta)';
        if (filterPeriod === 'month') {
          const mName = new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
          return `Este Mês (${mName.charAt(0).toUpperCase() + mName.slice(1)})`;
        }
        if (filterPeriod === 'week') return 'Esta Semana (Últimos 7 dias)';
        if (filterPeriod === 'today') return `Hoje (${new Date().toLocaleDateString('pt-BR')})`;
        return '';
      }, [filterPeriod]);

      // Sincronizar com o Firebase
      const handleSyncIndicatorsWithDatabase = async () => {
        try {
          const syncData = {
            totalSolicitadosFila: queueRequests.length,
            totalMontadosEmCampo: mountedRequests.length,
            totalDesmontados: dismantledRequests.length + (archivedStats.extraDesmontados || 0),
            totalCancelados: cancelledRequests.length + (archivedStats.extraCancelados || 0),
            totalHistoricoCriado: requests.length + (archivedStats.extraDesmontados || 0),
            lastSyncDate: new Date().toLocaleString('pt-BR')
          };

          await db.collection('andaimes_config').doc('indicadores').set(syncData, { merge: true });
          alert(`Indicadores sincronizados com o banco real com sucesso!\n\n• Solicitações na Fila: ${queueRequests.length}\n• Andaimes Montados: ${mountedRequests.length}\n• Desmontados Concluídos: ${dismantledRequests.length}\n• Total de Andaimes na Planta: ${requests.length}`);
        } catch (err) {
          console.error('Erro ao sincronizar:', err);
          alert('Erro ao sincronizar indicadores com o Firebase.');
        }
      };

      // Login
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        const found = users.find(u => u.email.toLowerCase() === loginEmail.toLowerCase());
        
        if (!found) {
          setLoginError('E-mail não encontrado.');
          return;
        }

        if (found.password !== loginPassword) {
          setLoginError('Senha incorreta.');
          return;
        }

        setCurrentUser(found);
        setIsAuthenticated(true);
        setLoginPassword('');
      };

      // Cadastro
      const handleRegisterAndLogin = async (e) => {
        e.preventDefault();
        setLoginError('');

        if (users.some(u => u.email.toLowerCase() === newUser.email.toLowerCase())) {
          setLoginError('Este e-mail já está cadastrado.');
          return;
        }

        if (!newUser.name.trim() || !newUser.email.trim()) {
          setLoginError('Preencha o nome completo e o e-mail corporativo.');
          return;
        }

        if (newUser.role === 'Gestor de Andaimes') {
          if (newUser.password !== 'AUTOKRAFT01') {
            setLoginError('Senha de segurança incorreta para o perfil Gestor de Andaimes.');
            return;
          }
        } else if (newUser.role === 'Equipe de Andaimes') {
          if (newUser.password !== 'JDANDAIME') {
            setLoginError('Senha de segurança incorreta para o perfil Equipe de Andaimes.');
            return;
          }
        } else {
          if (!newUser.password || newUser.password.trim() === '') {
            setLoginError('Por favor, informe uma senha para o seu cadastro.');

          }

          await db.collection('andaimes_usuarios').doc(created.email.toLowerCase()).set(created);

          console.warn('Erro ao salvar usuário no Firebase:', err);

        setCurrentUser(created);
        setIsAuthenticated(true);
        setNewUser({ name: '', email: '', password: '', role: 'Solicitante (Área)' });
      };

      // Gestor Excluir Login de Usuário
      const handleDeleteUser = async (userToDelete) => {
        if (!isGestor) return;
        if (userToDelete.email.toLowerCase() === currentUser.email.toLowerCase()) {
          alert('Você não pode excluir o seu próprio usuário logado no momento.');
          return;
        }

        const confirmDelete = window.confirm(`Deseja realmente excluir o login de "${userToDelete.name}" (${userToDelete.email})? Esta ação revogará o acesso dele.`);
        if (!confirmDelete) return;

        try {
          await db.collection('andaimes_usuarios').doc(userToDelete.email.toLowerCase()).delete();
          setUsers(users.filter(u => u.email.toLowerCase() !== userToDelete.email.toLowerCase()));
          alert(`Usuário ${userToDelete.name} excluído com sucesso.`);
        } catch (err) {
          console.error('Erro ao excluir usuário:', err);
          alert('Erro ao excluir usuário no Firebase.');
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setCurrentUser(null);
        setLoginError('');
      };

      const handleInputChange = (e) => {
        const value = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
        setFormData({ ...formData, [e.target.name]: value });
      };

      // Criar Solicitação
      const handleCreateRequest = async (e) => {
        e.preventDefault();

        let selectedFactory = formData.factory;
        if (isAddingNewFactoryInForm) {
          if (!newFactoryInputForm.trim()) {
            alert('Por favor, digite o nome da nova fábrica.');
            return;
          }
          selectedFactory = newFactoryInputForm.trim().toUpperCase();
          handleAddFactory(selectedFactory);
        }

        if (!selectedFactory) {
          alert('Por favor, selecione ou digite a fábrica.');
          return;
        }

        if (formData.canUsePEMT === 'SIM' && !formData.pemtJustification.trim()) {
          alert('Por favor, informe a justificativa do porquê montar andaime quando é possível usar PEMT.');
          return;
        }

        const activityResp = (formData.activityResponsible || '').trim() || currentUser.name;
        const respEmail = (formData.email || '').trim() || currentUser.email;

        // Determina próximo número sequencial contínuo sem limites (SOL-1001, SOL-1002, ...)
        let currentMax = Number(archivedStats.maxSolicitationNumber) || 1000;
        requests.forEach(r => {
          const num = extractSolNumber(r.id);
          if (num > currentMax) currentMax = num;
        });
        historicalEvents.forEach(ev => {
          const num = extractSolNumber(ev.reqId);
          if (num > currentMax) currentMax = num;
        });
        const nextSolNum = currentMax + 1;
        const nextSolId = `SOL-${nextSolNum}`;

        const newReq = {
          id: nextSolId,
          factory: selectedFactory,
          area: formData.area.trim(),
          reference: formData.reference.trim(),
          activityDescription: formData.activityDescription.trim(),
          canUsePEMT: formData.canUsePEMT,
          pemtJustification: formData.canUsePEMT === 'SIM' ? formData.pemtJustification.trim() : '',
          responsible: activityResp,
          email: respEmail,
          requesterName: currentUser.name,
          requesterEmail: currentUser.email,
          phone: formData.phone.trim(),
          dueDate: formData.dueDate,
          expectedDismantleDate: formData.expectedDismantleDate || '',
          isUrgent: formData.isUrgent,
          queueOrder: 999,
          width: Number(formData.width) || 0,
          length: Number(formData.length) || 0,
          height: Number(formData.height) || 0,
          volumeM3: calcVolume,
          realWidth: null,
          realLength: null,
          realHeight: null,
          realVolumeM3: null,
          status: 'Avaliação',
          photoUrl: null,
          createdAt: new Date().toLocaleString('pt-BR'),
          history: [
            { 
              date: new Date().toLocaleString('pt-BR'), 
              user: `${currentUser.name} (${currentUser.role})`, 
              action: `Solicitação Criada (${nextSolId})${formData.isUrgent ? ' (Urgente)' : ''} | Prev. Montagem: ${formData.dueDate || 'N/A'}${formData.expectedDismantleDate ? ` | Prev. Desmontagem: ${formData.expectedDismantleDate}` : ''} | Atividade: ${formData.activityDescription} | PEMT: ${formData.canUsePEMT}` 
            }
          ]
        };

        try {
          await db.collection('andaimes_solicitacoes').doc(nextSolId).set(newReq);
          await db.collection('andaimes_config').doc('indicadores').set({
            maxSolicitationNumber: nextSolNum
          }, { merge: true });

          await db.collection('andaimes_eventos_historico').add({
            type: 'CRIADO',
            reqId: nextSolId,
            factory: selectedFactory,
            area: formData.area.trim(),
            date: new Date().toISOString(),
            dateStr: new Date().toLocaleString('pt-BR'),
            timestamp: Date.now()
          }).catch(() => {});
        } catch (err) {
          console.warn('Erro ao salvar no Firestore:', err);
        }

        const updatedList = [newReq, ...requests];
        setRequests(updatedList);
        
        setFormData({
          factory: '',
          area: '',
          reference: '',
          activityDescription: '',
          canUsePEMT: 'NÃO',
          pemtJustification: '',
          activityResponsible: '',
          email: '',
          phone: '',
          dueDate: '',
          expectedDismantleDate: '',
          isUrgent: false,
          width: '',
          length: '',
          height: ''
        });
        setIsAddingNewFactoryInForm(false);
        setNewFactoryInputForm('');

        setActiveTab('solicitacoes');
      };

      // Alteração de status normal
      const updateStatus = async (id, newStatus, extraAction = '') => {
        const histMsg = extraAction ? `${extraAction}` : `Status alterado para: ${newStatus}`;
        const targetReq = requests.find(r => r.id === id);
        if (!targetReq) return;

        const newHistory = [
          ...targetReq.history,
          { date: new Date().toLocaleString('pt-BR'), user: `${currentUser.name} (${currentUser.role})`, action: histMsg }
        ];

        setRequests(requests.map(r => r.id === id ? { ...r, status: newStatus, history: newHistory } : r));

        try {
          await db.collection('andaimes_solicitacoes').doc(id).update({
            status: newStatus,
            history: newHistory
          });
        } catch (err) {
          console.warn('Erro ao atualizar status no Firestore:', err);
        }
      };

      // FINALIZAR DESMONTAGEM -> APAGA A FOTO, MANTÉM DESCRITIVO COMPLETO, DEIXA APENAS OS 4 ÚLTIMOS E PRESERVA A CONTAGEM
      const handleCompleteDismantle = async (reqId) => {
        const req = requests.find(r => r.id === reqId);
        if (!req) return;

        const confirmAction = window.confirm(`Confirmar a desmontagem e recolhimento do andaime ${req.id}?\n\n• O descritivo completo será mantido para controle.\n• A foto será apagada para otimização de espaço.\n• Ficarão visíveis os 4 últimos desmontados.\n• A contagem total será permanentemente preservada nos indicadores.`);
        if (!confirmAction) return;

        try {
          const dismantleDateStr = new Date().toLocaleString('pt-BR');
          const dismantleTimestamp = Date.now();
          const updatedHistory = [
            ...(req.history || []),
            { 
              date: dismantleDateStr, 
              user: `${currentUser.name} (${currentUser.role})`, 
              action: 'Desmontagem Concluída e Recolhido (Foto removida para otimização)' 
            }
          ];

          const updateData = {
            status: 'Desmontado',
            photoUrl: null, // Apague a foto
            dismantledAt: dismantleDateStr,
            dismantledTimestamp: dismantleTimestamp,
            dismantledBy: currentUser.name,
            history: updatedHistory
          };

          // 1. Atualiza documento no Firestore com status Desmontado e sem foto, mantendo todo o descritivo
          await db.collection('andaimes_solicitacoes').doc(reqId).update(updateData);

          // 2. Registra evento histórico para controle e filtros de período
          await db.collection('andaimes_eventos_historico').add({
            type: 'DESMONTADO',
            reqId: req.id,
            factory: req.factory || '',
            area: req.area || '',
            reference: req.reference || '',
            activityDescription: req.activityDescription || '',
            volumeM3: req.realVolumeM3 || req.volumeM3 || 0,
            date: new Date().toISOString(),
            dateStr: dismantleDateStr,
            timestamp: dismantleTimestamp
          }).catch(() => {});

          // 3. Atualiza estado local
          const updatedRequests = requests.map(r => r.id === reqId ? { ...r, ...updateData } : r);
          setRequests(updatedRequests);

          // 4. Verifica todos os desmontados: se houver mais de 4, remove o 4º mais antigo mantendo a contagem nos indicadores
          const allDismantled = updatedRequests.filter(r => r.status === 'Desmontado');
          allDismantled.sort((a, b) => {
            const tA = a.dismantledTimestamp || (a.history ? parseCustomDate(a.history[a.history.length - 1]?.date)?.getTime() : 0) || 0;
            const tB = b.dismantledTimestamp || (b.history ? parseCustomDate(b.history[b.history.length - 1]?.date)?.getTime() : 0) || 0;
            return tB - tA; // mais recentes primeiro
          });

          if (allDismantled.length > 4) {
            const excess = allDismantled.slice(4);
            for (const oldReq of excess) {
              await db.collection('andaimes_config').doc('indicadores').set({
                extraDesmontados: firebase.firestore.FieldValue.increment(1)
              }, { merge: true }).catch(() => {});

              await db.collection('andaimes_solicitacoes').doc(oldReq.id).delete().catch(() => {});
            }
          }

          alert(`Andaime ${req.id} desmontado e finalizado com sucesso!\n\n• Descritivo completo preservado para controle.\n• Foto apagada.\n• Exibindo os 4 últimos desmontados com a contagem total garantida.`);
        } catch (err) {
          console.error('Erro ao finalizar desmontagem:', err);
          alert('Erro ao comunicar com Firebase.');
        }
      };

      // GESTOR CANCELAR SOLICITAÇÃO
      const handleCancelRequestConfirm = async (e) => {
        e.preventDefault();
        if (!cancelModalReq) return;
        setIsCancelling(true);

        const reqId = cancelModalReq.id;

        try {
          await db.collection('andaimes_config').doc('indicadores').set({
            extraCancelados: firebase.firestore.FieldValue.increment(1)
          }, { merge: true });

          await db.collection('andaimes_eventos_historico').add({
            type: 'CANCELADO',
            reqId: reqId,
            factory: cancelModalReq.factory,
            reason: cancelReason,
            date: new Date().toISOString(),
            dateStr: new Date().toLocaleString('pt-BR')
          }).catch(() => {});

          await db.collection('andaimes_solicitacoes').doc(reqId).delete();
          setRequests(prev => prev.filter(r => r.id !== reqId));
          alert(`Solicitação ${reqId} cancelada com sucesso.`);
        } catch (err) {
          console.error('Erro ao cancelar:', err);
        } finally {
          setIsCancelling(false);
          setCancelModalReq(null);
          setCancelReason('');

      };

      // Salvar Visita Técnica
      const handleSaveVisit = async (e) => {

        setRequests(requests.map(r => r.id === visitModalReqId ? {
          ...r,
          realWidth: w,
          realLength: l,

        } : r));

        setVisitModalReqId(null);
        setVisitDimensions({ width: '', length: '', height: '' });
      };

      // Alterar Prazos (Montagem e Desmontagem)
      const openEditDateModal = (req) => {
        setEditDateModalReq(req);
        setNewDueDate(req.dueDate || '');
        setNewExpectedDismantleDate(req.expectedDismantleDate || '');
        setDateChangeReason('');
        setAutoReorderOnDateChange(true);
      };

      const handleSaveNewDueDate = async (e) => {
        e.preventDefault();
        if (!editDateModalReq) return;

        const reqId = editDateModalReq.id;
        const oldDueDate = editDateModalReq.dueDate || 'Não definida';
        const oldDismantle = editDateModalReq.expectedDismantleDate || 'A definir';
        const reasonText = dateChangeReason.trim() ? ` Motivo: "${dateChangeReason.trim()}"` : '';

        const newHistoryItem = {
          date: new Date().toLocaleString('pt-BR'),
          user: `${currentUser.name} (${currentUser.role})`,
          action: `Prazos alinhados: Montagem de ${oldDueDate} para ${newDueDate || 'N/A'} | Desmontagem de ${oldDismantle} para ${newExpectedDismantleDate || 'A definir'}.${reasonText}`
        };

        let updatedList = requests.map(r => {
          if (r.id === reqId) {
            return {
              ...r,
              dueDate: newDueDate,
              expectedDismantleDate: newExpectedDismantleDate,
              history: [...r.history, newHistoryItem]
            };
          }
          return r;
        });

        if (autoReorderOnDateChange) {
          updatedList = sortQueueByDueDate(updatedList);
        }

        setRequests(updatedList);

        try {
          const targetUpdated = updatedList.find(r => r.id === reqId);
          await db.collection('andaimes_solicitacoes').doc(reqId).update({
            dueDate: newDueDate,
            expectedDismantleDate: newExpectedDismantleDate,
            queueOrder: targetUpdated.queueOrder || null,
            history: targetUpdated.history
          });

          if (autoReorderOnDateChange) {
            const batch = db.batch();
            updatedList.forEach(r => {
              if (r.queueOrder) {
                const ref = db.collection('andaimes_solicitacoes').doc(r.id);
                batch.update(ref, { queueOrder: r.queueOrder });
              }
            });
            await batch.commit();
          }
        } catch (err) {
          console.error('Erro ao atualizar prazos:', err);
        }

        setEditDateModalReq(null);
      };

      // -------------------------------------------------------------
      // MÓDULO 1: ESTOQUE DE ANDAIMES DESMONTADOS EM FÁBRICAS (EQUIPE)
      // -------------------------------------------------------------
      const handleSaveStorageItem = async (e) => {
        e.preventDefault();
        if (!storageFormData.factory || !storageFormData.exactLocation || !storageFormData.linearMeters) {
          alert('Por favor, informe a Fábrica, o Local Exato e a Metragem do andaime desmontado.');
          return;
        }

        const isEdit = !!editingStorageItem;
        const itemId = isEdit ? editingStorageItem.id : `MAT-${Date.now()}`;
        const itemData = {
          factory: storageFormData.factory.trim().toUpperCase(),
          exactLocation: storageFormData.exactLocation.trim(),
          linearMeters: Number(storageFormData.linearMeters) || 0,
          volumeM3: Number(storageFormData.volumeM3) || 0,
          materialType: storageFormData.materialType || 'Torres Tubulares Completas',
          status: storageFormData.status || 'Disponível para Reuso',
          notes: (storageFormData.notes || '').trim(),
          responsible: currentUser ? currentUser.name : 'Equipe de Andaimes',
          updatedAt: new Date().toLocaleString('pt-BR')
        };

        try {
          await db.collection('andaimes_materiais_desmontados').doc(itemId).set(itemData, { merge: true });
          setIsStorageModalOpen(false);
          setEditingStorageItem(null);
          setStorageFormData({
            factory: '',
            exactLocation: '',
            linearMeters: '',
            volumeM3: '',
            materialType: 'Torres Tubulares Completas',
            status: 'Disponível para Reuso',
            notes: ''
          });
        } catch (err) {
          console.error('Erro ao salvar material desmontado:', err);
          alert('Erro ao salvar no Firebase.');
        }
      };

      const handleDeleteStorageItem = async (item) => {
        if (!window.confirm(`Confirma a baixa/remoção do registro de andaime desmontado no local "${item.exactLocation}" (${item.factory})?`)) {
          return;
        }
        try {
          await db.collection('andaimes_materiais_desmontados').doc(item.id).delete();
        } catch (err) {
          console.error('Erro ao excluir material desmontado:', err);
          alert('Erro ao excluir do Firebase.');
        }
      };

      const handleQuickAdjustMeters = async (item, delta) => {
        const currentM = Number(item.linearMeters) || 0;
        const newM = Math.max(0, currentM + delta);
        try {
          await db.collection('andaimes_materiais_desmontados').doc(item.id).update({
            linearMeters: newM,
            updatedAt: new Date().toLocaleString('pt-BR'),
            responsible: currentUser ? currentUser.name : item.responsible
          });
        } catch (err) {
          console.error('Erro ao ajustar metros:', err);
        }
      };

      const handleOpenEditStorageModal = (item) => {
        setEditingStorageItem(item);
        setStorageFormData({
          factory: item.factory || '',
          exactLocation: item.exactLocation || '',
          linearMeters: item.linearMeters || '',
          volumeM3: item.volumeM3 || '',
          materialType: item.materialType || 'Torres Tubulares Completas',
          status: item.status || 'Disponível para Reuso',
          notes: item.notes || ''
        });
        setIsStorageModalOpen(true);
      };

      // -------------------------------------------------------------
      // MÓDULO 2: GERADOR DE EXCEL DIÁRIO COM FILTRO DE DATAS PARA CHEFIA
      // -------------------------------------------------------------
      const handleExportExcelDaily = () => {
        let filtered = [...requests];

        if (excelFactoryFilter !== 'ALL') {
          filtered = filtered.filter(r => (r.factory || '').toUpperCase() === excelFactoryFilter.toUpperCase());
        }

        if (excelStatusFilter !== 'ALL') {
          filtered = filtered.filter(r => r.status === excelStatusFilter);
        }

        if (excelDatePeriod === 'today') {
          filtered = filtered.filter(r => {
            const d = parseCustomDate(r.createdAt) || (r.history && r.history[0] ? parseCustomDate(r.history[0].date) : null);
            return isDateInFilter(d, 'today');
          });
        } else if (excelDatePeriod === 'week') {
          filtered = filtered.filter(r => {
            const d = parseCustomDate(r.createdAt) || (r.history && r.history[0] ? parseCustomDate(r.history[0].date) : null);
            return isDateInFilter(d, 'week');
          });
        } else if (excelDatePeriod === 'month') {
          filtered = filtered.filter(r => {
            const d = parseCustomDate(r.createdAt) || (r.history && r.history[0] ? parseCustomDate(r.history[0].date) : null);
            return isDateInFilter(d, 'month');
          });
        } else if (excelDatePeriod === 'custom' && excelCustomStart && excelCustomEnd) {
          const start = new Date(excelCustomStart + 'T00:00:00');
          const end = new Date(excelCustomEnd + 'T23:59:59');
          filtered = filtered.filter(r => {
            const d = parseCustomDate(r.createdAt) || (r.history && r.history[0] ? parseCustomDate(r.history[0].date) : null);
            return d && d >= start && d <= end;
          });
        }

        const getHumanStatus = (st) => {
          switch (st) {
            case 'Avaliação': return '1 - Nova Solicitação (Fila de Espera)';
            case 'Iniciado Montagem': return '2 - Visita Técnica Realizada';
            case 'Em Movimentação': return '3 - Andaime em Transporte / Movimentação';
            case 'Montado': return '4 - Montado em Campo';
            case 'Liberado para Desmontagem': return '5 - Solicitado Desmontagem pela Área';
            case 'Desmontado': return '6 - Desmontado Concluído';
            case 'Cancelado': return 'Cancelado pela Gestão';
            default: return st || 'Não definido';
          }
        };

        const escapeCell = (val) => {
          if (val === null || val === undefined) return '""';
          const str = String(val).split('"').join('""').split('\n').join(' ').split('\r').join('');
          return '"' + str + '"';
        };

        const headers = [
          'Código da Solicitação',
          'Data do Registro',
          'Status da Solicitação',
          'Fábrica / Planta',
          'Área / Setor',
          'Ponto de Referência / Local Exato',
          'Atividade a Realizar',
          'PEMT Possível?',
          'Justificativa PEMT',
          'Responsável pela Atividade',
          'E-mail do Responsável',
          'Telefone / Ramal',
          'Solicitante (Cadastrado)',
          'Data Prevista para Montagem',
          'Data Prevista para Desmontagem',
          'Urgência Operacional',
          'Dimensões Estimadas (LxCxA em m)',
          'Volume Estimado (m³)',
          'Dimensões Reais da Visita (LxCxA em m)',
          'Volume Real da Visita (m³)',
          'Histórico e Auditoria de Ações'
        ];

        const rows = filtered.map(r => {
          const dimEst = `${r.width || 0} x ${r.length || 0} x ${r.height || 0}m`;
          const volEst = r.volumeM3 ? Number(r.volumeM3).toFixed(1) : '0.0';
          const dimReal = (r.realWidth !== null && r.realWidth !== undefined) ? `${r.realWidth} x ${r.realLength} x ${r.realHeight}m` : 'Pendente visita';
          const volReal = (r.realVolumeM3 !== null && r.realVolumeM3 !== undefined) ? Number(r.realVolumeM3).toFixed(1) : '-';
          const historySummary = Array.isArray(r.history) 
            ? r.history.map(h => `[${h.date}] ${h.user}: ${h.action}`).join(' | ') 
            : '';

          return [
            escapeCell(r.id),
            escapeCell(r.createdAt),
            escapeCell(getHumanStatus(r.status)),
            escapeCell(r.factory),
            escapeCell(r.area),
            escapeCell(r.reference),
            escapeCell(r.activityDescription),
            escapeCell(r.canUsePEMT || 'NÃO'),
            escapeCell(r.pemtJustification || '-'),
            escapeCell(r.responsible),
            escapeCell(r.email),
            escapeCell(r.phone),
            escapeCell(r.requesterName ? `${r.requesterName} (${r.requesterEmail || ''})` : '-'),
            escapeCell(r.dueDate || 'Não informada'),
            escapeCell(r.expectedDismantleDate || 'A definir'),
            escapeCell(r.isUrgent ? 'SIM (URGENTE)' : 'NÃO'),
            escapeCell(dimEst),
            escapeCell(volEst),
            escapeCell(dimReal),
            escapeCell(volReal),
            escapeCell(historySummary)
          ].join(';');
        });

        const csvContent = '\uFEFF' + headers.map(h => `"${h}"`).join(';') + '\n' + rows.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const nowStr = new Date().toISOString().split('T')[0];
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Relatorio_Andaimes_Chefia_${nowStr}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setIsExcelModalOpen(false);
      };

      // Download do Backup Completo JSON
      const handleDownloadBackupJSON = () => {
        const backupData = {
          exportDate: new Date().toISOString(),
          app: 'InspectCBM - Gestão de Andaimes',
          totalCapacityM3,
          requests,
          users,
          factories,
          dismantledStorageList,
          archivedStats
        };
        const str = JSON.stringify(backupData, null, 2);
        const blob = new Blob([str], { type: 'application/json' });
        const nowStr = new Date().toISOString().split('T')[0];
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `backup_andaimes_firestore_${nowStr}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Restaurar Backup do Banco de Dados JSON
      const handleRestoreBackupJSON = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            if (!data.requests || !Array.isArray(data.requests)) {
              alert('Arquivo de backup inválido: lista de solicitações não encontrada.');
              return;
            }
            if (!window.confirm(`Tem certeza que deseja restaurar o backup com ${data.requests.length} solicitações? Isso sincronizará os dados na nuvem.`)) {
              return;
            }
            const batch = db.batch();
            data.requests.forEach(r => {
              const ref = db.collection('andaimes_solicitacoes').doc(r.id);
              batch.set(ref, r, { merge: true });
            });
            if (data.totalCapacityM3) {
              batch.set(db.collection('andaimes_config').doc('geral'), { totalCapacityM3: data.totalCapacityM3 }, { merge: true });
            }
            if (data.factories && Array.isArray(data.factories)) {
              batch.set(db.collection('andaimes_config').doc('fabricas'), { list: data.factories }, { merge: true });
            }
            if (data.dismantledStorageList && Array.isArray(data.dismantledStorageList)) {
              data.dismantledStorageList.forEach(item => {
                const sRef = db.collection('andaimes_materiais_desmontados').doc(item.id);
                batch.set(sRef, item, { merge: true });
              });
            }
            await batch.commit();
            alert('Backup restaurado com sucesso na nuvem Firebase!');
          } catch (err) {
            console.error('Erro ao restaurar backup:', err);
            alert('Erro ao restaurar arquivo de backup.');
          }
        };
        reader.readAsText(file);
      };

      // Mover Item na Fila
      const moveQueueItem = async (reqId, direction) => {
        const queueStatuses = ['Avaliação', 'Iniciado Montagem', 'Em Movimentação'];
        const inQueue = requests.filter(r => queueStatuses.includes(r.status));
        const idx = inQueue.findIndex(r => r.id === reqId);
        if (idx === -1) return;

        if (direction === 'up' && idx > 0) {
          const temp = inQueue[idx];
          inQueue[idx] = inQueue[idx - 1];
          inQueue[idx - 1] = temp;
        } else if (direction === 'down' && idx < inQueue.length - 1) {
          const temp = inQueue[idx];
          inQueue[idx] = inQueue[idx + 1];
          inQueue[idx + 1] = temp;
        } else {
          return;
        }

        inQueue.forEach((item, index) => {
          item.queueOrder = index + 1;
        });

        const notInQueue = requests.filter(r => !queueStatuses.includes(r.status));
        const reordered = [...inQueue, ...notInQueue];
        setRequests(reordered);

        try {
          const batch = db.batch();
          inQueue.forEach(item => {
            const ref = db.collection('andaimes_solicitacoes').doc(item.id);
            batch.update(ref, { queueOrder: item.queueOrder });
          });
          await batch.commit();
        } catch (err) {
          console.warn('Erro ao persistir ordem da fila:', err);
        }
      };

      // Capacidade contratada
      const handleUpdateCapacity = async (val) => {
        setTotalCapacityM3(val);
        try {
          await db.collection('andaimes_config').doc('geral').set({ totalCapacityM3: val }, { merge: true });
        } catch (err) {
          console.warn(err);
        }
      };

      // --- TELA DE LOGIN / NOVO CADASTRO ---
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-md w-full space-y-6">
              <div className="text-center">
                <div className="inline-flex p-3 bg-blue-50 text-blue-600 rounded-xl mb-3">
                  <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                <h1 className="text-2xl font-black text-slate-800">Controle de Andaimes</h1>
                <p className="text-xs text-slate-500 mt-1">Autenticação com Controle de Perfis</p>
                <div className="mt-2 flex items-center justify-center gap-1.5 text-[11px] text-emerald-600 font-semibold">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  Nuvem Firebase Conectada
                </div>
              </div>

              {loginError && (
                <div className="p-3 bg-red-50 text-red-700 text-xs rounded-lg border border-red-200 font-medium">
                  {loginError}
                </div>
              )}

              <div className="flex border-b border-slate-200 text-sm">
                <button 
                  onClick={() => { setLoginMode('select'); setLoginError(''); }}
                  className={`flex-1 py-2 font-semibold text-center border-b-2 ${loginMode === 'select' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                >
                  Entrar
                </button>
                <button 
                  onClick={() => { setLoginMode('register'); setLoginError(''); }}
                  className={`flex-1 py-2 font-semibold text-center border-b-2 ${loginMode === 'register' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                >
                  Novo Cadastro
                </button>
              </div>

              {loginMode === 'select' ? (
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Selecionar Usuário</label>
                    <select 
                      value={loginEmail} 
                      onChange={(e) => setLoginEmail(e.target.value)}
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 font-medium"
                    >
                      {users.map(u => (
                        <option key={u.id || u.email} value={u.email}>{u.name} — ({u.role})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Senha de Acesso</label>
                    <input 
                      type="password"
                      placeholder="Digite sua senha de acesso"
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm"
                      required
                    />
                  </div>

                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition text-sm">
                    Entrar no Sistema
                  </button>
                </form>
              ) : (
                <form onSubmit={handleRegisterAndLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome Completo</label>
                    <input 
                      type="text" 
                      placeholder="Ex: Roberto Alves" 
                      value={newUser.name} 
                      onChange={(e) => setNewUser({...newUser, name: e.target.value})} 
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm" 
                      required 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mail corporativo</label>
                    <input 
                      type="email" 
                      placeholder="usuario@empresa.com" 
                      value={newUser.email} 
                      onChange={(e) => setNewUser({...newUser, email: e.target.value})} 
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm" 
                      required 
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Função / Perfil</label>
                    <select 
                      value={newUser.role} 
                      onChange={(e) => setNewUser({...newUser, role: e.target.value, password: ''})} 
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold text-slate-800"
                    >
                      <option value="Solicitante (Área)">Solicitante (Área)</option>
                      <option value="Equipe de Andaimes">Equipe de Andaimes</option>
                      <option value="Gestor de Andaimes">Gestor de Andaimes</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">
                      {newUser.role === 'Solicitante (Área)' 
                        ? 'Criar Senha de Acesso' 
                        : 'Senha de Segurança do Perfil'}
                    </label>
                    <input 
                      type="password" 
                      placeholder={
                        newUser.role === 'Solicitante (Área)'
                          ? 'Crie uma senha de acesso'
                          : 'Digite a senha do perfil autorizada'
                      } 
                      value={newUser.password} 
                      onChange={(e) => setNewUser({...newUser, password: e.target.value})} 
                      className="w-full p-3 bg-slate-50 border border-slate-300 rounded-lg text-sm" 
                      required 
                    />
                    {newUser.role !== 'Solicitante (Área)' ? (
                      <p className="text-[11px] text-slate-500 mt-1.5">
                        Perfil restrito. Informe a senha de segurança corporativa correspondente.
                      </p>
                    ) : (
                      <p className="text-[11px] text-slate-500 mt-1.5">
                        Como solicitante da fábrica, você escolhe livremente sua senha pessoal.
                      </p>
                    )}
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-md transition text-sm">
                    Cadastrar e Salvar na Nuvem
                  </button>
                </form>
              )}
            </div>
          </div>
        );
      }

      // Renderização do Card de Andaime
      const renderCard = (req) => {
        const isLate = req.status !== 'Desmontado' && req.dueDate && req.dueDate < todayStr;
        const hasReal = req.realVolumeM3 !== null && req.realVolumeM3 !== undefined;
        const isInQueue = ['Avaliação', 'Iniciado Montagem', 'Em Movimentação'].includes(req.status);

        return (
          <div key={req.id} className={`bg-white rounded-xl p-4 shadow-sm border ${req.isUrgent ? 'border-red-300 bg-red-50/20' : 'border-slate-200'} space-y-3`}>
            {/* Cabeçalho do Card */}
            <div className="flex justify-between items-start gap-2">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-bold text-sm text-slate-900">{req.id}</span>
                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-900 border border-blue-200 max-w-[150px] truncate" title={req.factory}>
                  {req.factory}
                </span>
                
                {/* Posição na Fila */}
                {isInQueue && req.queueOrder && (
                  <span className="text-[10px] font-black px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 shadow-sm flex items-center gap-1">
                    <span>#{req.queueOrder} na Fila</span>
                  </span>
                )}
                
                {req.isUrgent && (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-red-100 text-red-700 border border-red-200">URGENTE</span>
                )}
                {isLate && (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-red-600 text-white animate-pulse">ATRASADO</span>
                )}
              </div>

              {/* Botões de Subir e Descer na Fila */}
              {isInQueue && (isGestor || isEquipe) && (
                <div className="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                  <button 
                    onClick={() => moveQueueItem(req.id, 'up')}
                    title="Subir prioridade na fila"
                    className="p-1 hover:bg-white rounded text-slate-600 hover:text-blue-600 transition"
                  >
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 15l7-7 7 7"></path></svg>
                  </button>
                  <button 
                    onClick={() => moveQueueItem(req.id, 'down')}
                    title="Descer prioridade na fila"
                    className="p-1 hover:bg-white rounded text-slate-600 hover:text-blue-600 transition"
                  >
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7"></path></svg>
                  </button>
                </div>
              )}
            </div>

            {/* Informações da Atividade */}
            <div className="bg-blue-50/60 p-2.5 rounded-lg border border-blue-100 space-y-1">
              <p className="text-xs font-bold text-blue-900 flex items-center gap-1">
                <span>🔧</span> Atividade: <span className="font-medium text-slate-800">{req.activityDescription || 'Não descrita'}</span>
              </p>
              
              <div className="text-[11px] flex items-center gap-2 pt-0.5">
                <span className="text-slate-500 font-semibold">Uso de PEMT:</span>
                <span className={`px-2 py-0.2 rounded font-bold text-[10px] ${req.canUsePEMT === 'SIM' ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-slate-200 text-slate-700'}`}>
                  {req.canUsePEMT === 'SIM' ? 'Possível PEMT' : 'PEMT Não Aplicável'}
                </span>
              </div>
              {req.canUsePEMT === 'SIM' && req.pemtJustification && (
                <p className="text-[11px] text-amber-900 italic bg-amber-50 p-1.5 rounded border border-amber-200/60">
                  <span className="font-semibold not-italic">Justificativa Andaime:</span> {req.pemtJustification}
                </p>
              )}
            </div>

            {/* Dados do Local e Responsável */}
            <div className="text-xs text-slate-600 space-y-1">
              <p><span className="font-semibold text-slate-700">Área:</span> {req.area}</p>
              <p><span className="font-semibold text-slate-700">Ponto de Ref:</span> {req.reference}</p>
              <p><span className="font-semibold text-slate-700">Resp. Atividade:</span> {req.responsible} {req.phone ? `(${req.phone})` : ''}</p>
              <p><span className="font-semibold text-slate-700">E-mail:</span> {req.email || 'Não informado'}</p>
              
              {/* Prazos de Montagem e Desmontagem */}
              <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs space-y-1">
                <div className="flex items-center justify-between">
                  <span className={isLate ? 'text-red-600 font-bold' : 'text-slate-700'}>
                    <strong className="font-semibold text-slate-800">📅 Prev. Montagem:</strong> {req.dueDate || 'Não definida'}
                  </span>
                  {isGestor && (
                    <button 
                      onClick={() => openEditDateModal(req)}
                      className="text-[11px] text-blue-600 hover:text-blue-800 font-bold underline flex items-center gap-1"
                    >
                      <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                      Ajustar Prazos
                    </button>
                  )}
                </div>
                <div className="text-slate-600">
                  <strong className="font-semibold text-slate-800">🏁 Prev. Desmontagem:</strong> {req.expectedDismantleDate || 'A definir'}
                </div>
              </div>
            </div>

            {/* Medições Estimadas e Reais */}
            <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-100 flex justify-between items-center text-xs">
              <div>
                <span className="text-[10px] text-slate-500 block uppercase font-medium">Estimado</span>
                <span className="font-semibold text-slate-800">{req.width}x{req.length}x{req.height}m ({req.volumeM3}m³)</span>
              </div>
              <div className="text-right">
                <span className="text-[10px] text-slate-500 block uppercase font-medium">Real (Visita)</span>
                {hasReal ? (
                  <span className="font-bold text-blue-600">{req.realWidth}x{req.realLength}x{req.realHeight}m ({req.realVolumeM3}m³)</span>
                ) : (
                  <span className="text-slate-400 italic">Pendente</span>
                )}
              </div>
            </div>

            {/* Foto registrada ou aviso de foto apagada com descritivo mantido */}
            {req.photoUrl ? (
              <div className="relative group rounded-lg overflow-hidden border border-slate-200">
                <img src={req.photoUrl} alt="Foto Andaime" className="w-full h-32 object-cover" />
                {(isEquipe || isGestor) && req.status !== 'Desmontado' && (
                  <button 
                    onClick={() => {
                      setPhotoModalReq(req);
                      setTempPhotoUrl(req.photoUrl);
                    }}
                    className="absolute bottom-2 right-2 bg-slate-900/80 hover:bg-slate-900 text-white text-[10px] px-2 py-1 rounded shadow flex items-center gap-1"
                  >
                    <span>📷 Alterar Foto</span>
                  </button>
                )}
              </div>
            ) : req.status === 'Desmontado' ? (
              <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 space-y-1 text-center">
                <div className="flex items-center justify-center gap-1.5 text-slate-700 text-xs font-bold">
                  <span>📷</span> Foto apagada para otimização da nuvem
                </div>
                <p className="text-[11px] text-slate-500">
                  Descritivo completo mantido ativo para controle e conferência
                </p>
                {req.dismantledAt && (
                  <p className="text-[10px] text-slate-400 font-medium pt-0.5">
                    Desmontado em: {req.dismantledAt} {req.dismantledBy ? `(${req.dismantledBy})` : ''}
                  </p>
                )}
              </div>
            ) : null}

            {/* Status e Ações */}
            <div className="flex items-center justify-between pt-2 border-t border-slate-100 flex-wrap gap-2">
              <span className={`text-xs px-2.5 py-1 rounded-full font-bold ${
                req.status === 'Avaliação' ? 'bg-amber-100 text-amber-800' :
                req.status === 'Iniciado Montagem' ? 'bg-blue-100 text-blue-800' :
                req.status === 'Em Movimentação' ? 'bg-indigo-100 text-indigo-800' :
                req.status === 'Montado' ? 'bg-emerald-100 text-emerald-800' :
                req.status === 'Liberado para Desmontagem' ? 'bg-purple-100 text-purple-800' :
                'bg-slate-200 text-slate-700'
              }`}>
                {req.status}
              </span>

              {/* Botões de Ação */}
              <div className="flex space-x-1.5 flex-wrap gap-1">
                {/* Visita Técnica */}
                {req.status === 'Avaliação' && (isEquipe || isGestor) && (
                  <button 
                    onClick={() => {
                      setVisitModalReqId(req.id);
                      setVisitDimensions({ width: req.width, length: req.length, height: req.height });
                    }}
                    className="px-2.5 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg shadow transition"
                  >
                    Visita Técnica
                  </button>
                )}

                {/* Movimentar */}
                {req.status === 'Iniciado Montagem' && (isEquipe || isGestor) && (
                  <button 
                    onClick={() => updateStatus(req.id, 'Em Movimentação', 'Movimentação dos materiais iniciada')}
                    className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow transition"
                  >
                    Movimentar
                  </button>
                )}

                {/* Montado (Foto) */}
                {req.status === 'Em Movimentação' && (isEquipe || isGestor) && (
                  <button 
                    onClick={() => {
                      setPhotoModalReq(req);
                      setTempPhotoUrl(req.photoUrl || null);
                    }}
                    className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg shadow transition flex items-center gap-1"
                  >
                    <span>📸</span> Montado (Foto)
                  </button>
                )}

                {/* Liberar Desmontagem */}
                {req.status === 'Montado' && (isSolicitante || isGestor) && (
                  <button 
                    onClick={() => updateStatus(req.id, 'Liberado para Desmontagem', 'Solicitada a desmontagem pela área')}
                    className="px-2.5 py-1 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold rounded-lg shadow transition"
                  >
                    Liberar Desmontagem
                  </button>
                )}

                {/* Concluir Desmontagem -> Libera espaço na nuvem e soma no indicador */}
                {req.status === 'Liberado para Desmontagem' && (isEquipe || isGestor) && (
                  <button 
                    onClick={() => handleCompleteDismantle(req.id)}
                    className="px-2.5 py-1 bg-slate-800 hover:bg-black text-white text-xs font-bold rounded-lg shadow transition flex items-center gap-1"
                    title="Conclui o andaime, libera espaço na nuvem e soma ao total de Desmontados Concluídos"
                  >
                    <span>✓</span> Desmontar (Concluir)
                  </button>
                )}

                {/* BOTÃO DO GESTOR: CANCELAR SOLICITAÇÃO */}
                {isGestor && req.status !== 'Desmontado' && (
                  <button 
                    onClick={() => setCancelModalReq(req)}
                    className="px-2 py-1 bg-red-100 hover:bg-red-200 text-red-700 hover:text-red-900 text-xs font-bold rounded-lg border border-red-300 transition"
                    title="Cancelar esta solicitação"
                  >
                    ✕ Cancelar
                  </button>
                )}
              </div>
            </div>

            {/* Histórico recolhível */}
            <details className="text-[11px] text-slate-500 pt-1 border-t border-slate-100">
              <summary className="cursor-pointer hover:text-slate-800 font-medium">Ver Histórico de Auditoria ({req.history ? req.history.length : 0})</summary>
              <div className="mt-2 space-y-1.5 bg-slate-50 p-2 rounded-lg max-h-36 overflow-y-auto">
                {req.history && req.history.map((h, i) => (
                  <div key={i} className="flex flex-col border-b border-slate-200/60 pb-1 last:border-0 last:pb-0">
                    <span className="font-semibold text-slate-700">{h.action}</span>
                    <span className="text-[10px] text-slate-400">{h.date} • {h.user}</span>
                  </div>
                ))}
              </div>
            </details>
          </div>
        );
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Bar Corporativa */}
          <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-40 app-header">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-2">
              <div className="flex items-center space-x-3 w-full sm:w-auto">
                <a href="/" className="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 transition" title="Ir para InspectCBM">
                  ← InspectCBM
                </a>
                <div className="p-2 bg-blue-600 rounded-lg">
                  <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                </div>
                <div>
                  <h1 className="font-bold text-sm sm:text-base tracking-wide flex items-center gap-1.5 flex-wrap">
                    Gestão de Andaimes
                    <span className="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2 py-0.5 rounded-full font-mono flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Firebase Conectado
                    </span>
                  </h1>
                  <p className="text-[11px] text-slate-400">Controle de Fila, Montagens, Liberação de Nuvem e Relatórios PDF</p>
                </div>
              </div>

              {/* Informações do Usuário */}
              <div className="flex items-center justify-between sm:justify-end w-full sm:w-auto space-x-3 text-xs pt-1 sm:pt-0 border-t sm:border-0 border-slate-800">
                <div className="text-left sm:text-right">
                  <p className="font-bold text-slate-200">{currentUser ? currentUser.name : ''}</p>
                  <p className="text-blue-400 font-semibold text-[11px]">{currentUser ? currentUser.role : ''}</p>
                </div>
                <button 
                  onClick={handleLogout}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition text-xs"
                >
                  Sair
                </button>
              </div>
            </div>

            {/* NAVEGAÇÃO POR ABAS SEPARADAS (NOVA SOLICITAÇÃO NA PRIMEIRA ABA PARA O CELULAR) */}
            <div className="max-w-7xl mx-auto px-2 sm:px-4 border-t border-slate-800 flex space-x-1 overflow-x-auto text-xs py-1 scrollbar-thin app-nav">
              {/* 1. NOVA SOLICITAÇÃO - PRIMEIRA ABA PARA ACESSO IMEDIATO NO CELULAR */}
              <button 
                onClick={() => setActiveTab('nova')} 
                className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap shadow-sm ${activeTab === 'nova' ? 'bg-blue-500 text-white shadow' : 'bg-blue-600/20 text-blue-300 hover:bg-blue-600/30 border border-blue-500/30'}`}
              >
                <span>➕</span> Nova Solicitação
              </button>

              {/* 2. SOLICITAÇÕES (FILA) */}
              <button 
                onClick={() => setActiveTab('solicitacoes')} 
                className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'solicitacoes' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:bg-slate-800'}`}
              >
                <span>📋</span> Solicitações (Fila)
                <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${activeTab === 'solicitacoes' ? 'bg-slate-950 text-white' : 'bg-amber-500/30 text-amber-300'}`}>
                  {queueRequests.length}
                </span>
              </button>

              {/* 3. MONTADOS */}
              <button 
                onClick={() => setActiveTab('montados')} 
                className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'montados' ? 'bg-emerald-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}
              >
                <span>🏗️</span> Montados
                <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${activeTab === 'montados' ? 'bg-white text-emerald-800' : 'bg-emerald-500/30 text-emerald-300'}`}>
                  {mountedRequests.length}
                </span>
              </button>

              {/* 4. DESMONTADOS CONCLUÍDOS */}
              <button 
                onClick={() => setActiveTab('desmontados')} 
                className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'desmontados' ? 'bg-slate-200 text-slate-900 shadow' : 'text-slate-300 hover:bg-slate-800'}`}
              >
                <span>✅</span> Desmontados Concluídos
                <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${activeTab === 'desmontados' ? 'bg-slate-900 text-white' : 'bg-slate-700 text-slate-300'}`}>
                  {dismantledRequests.length + (archivedStats.extraDesmontados || 0)}
                </span>
              </button>

              {/* 5. ABA DA EQUIPE: DESMONTADOS EM FÁBRICAS (ESTOQUE) */}
              <button 
                onClick={() => setActiveTab('estoque_fabricas')} 
                className={`py-2 px-3 font-bold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'estoque_fabricas' ? 'bg-cyan-600 text-white shadow' : 'text-cyan-300 hover:bg-slate-800'}`}
              >
                <span>📦</span> Desmontados em Fábricas
                <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-black ${activeTab === 'estoque_fabricas' ? 'bg-white text-cyan-900' : 'bg-cyan-500/30 text-cyan-200'}`}>
                  {totalMetersStored}m
                </span>
              </button>

              {/* 6. INDICADORES & RELATÓRIOS (EXCEL + PDF) */}
              <button 
                onClick={() => setActiveTab('dashboard')} 
                className={`py-2 px-3 font-semibold rounded-lg flex items-center gap-1.5 transition whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}
              >
                <span>📊</span> Indicadores & Relatórios
              </button>
