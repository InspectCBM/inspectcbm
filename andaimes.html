                            } catch (err) {
                              console.error('Erro no arquivo:', err);
                              alert('Erro ao carregar imagem da galeria.');
                            } finally {
                              setIsCompressingPhoto(false);
                            }
                          }
                        }} 
                      />
                      <label 
                        htmlFor="gallery-file-input" 
                        className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-98 text-slate-700 font-semibold rounded-xl flex items-center justify-center gap-2 cursor-pointer border border-slate-300 transition text-xs"
                      >
                        <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>Ou Escolher Foto da Galeria / Arquivos</span>
                      </label>
                    </div>
                  </div>
                )}

                {/* Botões de Ação */}
                <div className="flex flex-col sm:flex-row justify-end gap-2 pt-3 border-t border-slate-100">
                  <button 
                    type="button" 
                    onClick={() => { setPhotoModalReq(null); setTempPhotoUrl(null); }} 
                    className="px-3 py-2 border rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50 transition"
                  >
                    Cancelar
                  </button>
                  <button 
                    type="button" 
                    disabled={isSavingMontado || isCompressingPhoto}
                    onClick={async () => {
                      setIsSavingMontado(true);
                      const reqId = photoModalReq.id;
                      const updatedHistory = [
                        ...photoModalReq.history,
                        { 
                          date: new Date().toLocaleString('pt-BR'), 
                          user: `${currentUser.name} (${currentUser.role})`, 
                          action: tempPhotoUrl 
                            ? 'Andaime Montado com foto auditada na nuvem' 
                            : 'Andaime Montado' 
                        }
                      ];

                      const updateData = {
                        status: 'Montado',
                        history: updatedHistory
                      };
                      if (tempPhotoUrl) {
                        updateData.photoUrl = tempPhotoUrl;
                      }

                      // Atualiza local imediatamente
                      setRequests(prev => prev.map(r => r.id === reqId ? { ...r, ...updateData } : r));

                      try {
                        // Grava no Firestore
                        await db.collection('andaimes_solicitacoes').doc(reqId).update(updateData);
                        
                        // Incrementa indicador de Montados no Firebase
                        await db.collection('andaimes_config').doc('indicadores').set({
                          totalMontados: firebase.firestore.FieldValue.increment(1)
                        }, { merge: true });
                      } catch (err) {
                        console.error('Erro ao atualizar no Firestore:', err);
                      } finally {
                        setIsSavingMontado(false);
                        setPhotoModalReq(null);
                        setTempPhotoUrl(null);
                        // Navega para a aba Montados
                        setActiveTab('montados');
                      }
                    }} 
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs shadow-md transition flex items-center justify-center gap-1.5"
                  >
                    {isSavingMontado ? (
                      <span>Salvando no Firebase...</span>
                    ) : (
                      <span>✓ Confirmar Andaime como Montado</span>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: GESTOR CANCELAR SOLICITAÇÃO */}
          {cancelModalReq && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4 animate-in fade-in zoom-in">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-base text-red-600 flex items-center gap-2">
                    <span>✕</span> Cancelar Solicitação
                  </h3>
                  <button onClick={() => setCancelModalReq(null)} className="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
                </div>

                <div className="text-xs text-slate-600 bg-red-50 p-3 rounded-xl border border-red-200 space-y-1">
                  <p><span className="font-bold text-slate-800">Solicitação:</span> {cancelModalReq.id} ({cancelModalReq.factory})</p>
                  <p><span className="font-bold text-slate-800">Local:</span> {cancelModalReq.area} - {cancelModalReq.reference}</p>
                  <p><span className="font-bold text-slate-800">Atividade:</span> {cancelModalReq.activityDescription || 'Não informada'}</p>
                  <p className="text-[11px] text-red-700 pt-1 font-semibold">
                    Esta solicitação será removida da fila e registrada no indicador histórico de solicitações canceladas.
                  </p>
                </div>

                <form onSubmit={handleCancelRequestConfirm} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Motivo do Cancelamento (Opcional)</label>
                    <textarea 
                      rows="2"
                      placeholder="Ex: Demanda cancelada pela engenharia / Atividade adiada..." 
                      value={cancelReason}
                      onChange={(e) => setCancelReason(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs"
                    ></textarea>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                    <button type="button" onClick={() => setCancelModalReq(null)} className="px-3 py-1.5 border rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50">Voltar</button>
                    <button 
                      type="submit" 
                      disabled={isCancelling}
                      className="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold transition shadow"
                    >
                      {isCancelling ? 'Cancelando...' : 'Confirmar Cancelamento'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ALINHAMENTO E AJUSTE DE DATA LIMITE PELO GESTOR */}
          {editDateModalReq && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-sm text-slate-800">Alinhamento de Prazo — {editDateModalReq.id}</h3>
                  <button onClick={() => setEditDateModalReq(null)} className="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
                </div>

                <div className="text-xs text-slate-600 space-y-1">
                  <p><span className="font-semibold">Local:</span> {editDateModalReq.factory} - {editDateModalReq.area}</p>
                  <p><span className="font-semibold">Responsável:</span> {editDateModalReq.responsible}</p>
                  <p><span className="font-semibold">Data Atual:</span> {editDateModalReq.dueDate || 'Não definida'}</p>
                </div>

                <form onSubmit={handleSaveNewDueDate} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nova Data Limite de Finalização</label>
                    <input 
                      type="date" 
                      value={newDueDate} 
                      onChange={(e) => setNewDueDate(e.target.value)} 
                      required 
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold" 
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Motivo do Alinhamento com a Área (Opcional)</label>
                    <textarea 
                      rows="2"
                      placeholder="Ex: Alinhado com a supervisão de manutenção devido atraso na entrega de peças"
                      value={dateChangeReason}
                      onChange={(e) => setDateChangeReason(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs" 
                    ></textarea>
                  </div>

                  <div className="flex items-center space-x-2 pt-1">
                    <input 
                      type="checkbox" 
                      id="chk-reorder" 
                      checked={autoReorderOnDateChange} 
                      onChange={(e) => setAutoReorderOnDateChange(e.target.checked)}
                      className="w-4 h-4 text-blue-600 rounded border-slate-300" 
                    />
                    <label htmlFor="chk-reorder" className="text-xs text-slate-600 cursor-pointer">
                      Reordenar automaticamente a fila no Firebase com esta nova data
                    </label>
                  </div>

                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                    <button type="button" onClick={() => setEditDateModalReq(null)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-blue-600 text-white rounded text-xs font-bold hover:bg-blue-700">Salvar Nova Data na Nuvem</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
