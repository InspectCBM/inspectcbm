                                Nenhum andaime registrado nesta fábrica no momento.
                              </div>
                            )}
                          </div>
                        );
                      })}
                  </div>

                  {/* RODAPÉ DO RELATÓRIO */}
                  <div className="pt-6 border-t border-slate-300 flex justify-between items-center text-[10px] text-slate-500">
                    <span>InspectCBM — Sistema de Gestão e Controle de Andaimes • Sincronizado via Firebase Firestore</span>
                    <span>Documento Oficial de Controle Operacional da Planta</span>
                  </div>

                </div>
              </div>
            </div>
          )}

          {/* MODAL: VISITA TÉCNICA E DIMENSÃO REAL */}
          {visitModalReqId && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-sm text-slate-800">Visita Técnica — Medição Real</h3>
                  <button onClick={() => setVisitModalReqId(null)} className="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
                </div>
                <p className="text-xs text-slate-500">Informe as dimensões conferidas no local para iniciar a montagem:</p>

                <form onSubmit={handleSaveVisit} className="space-y-3">
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[10px] text-slate-500">Largura (m)</label>
                      <input type="number" step="0.1" value={visitDimensions.width} onChange={(e) => setVisitDimensions({...visitDimensions, width: e.target.value})} required className="w-full p-2 border rounded text-xs" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500">Comprimento (m)</label>
                      <input type="number" step="0.1" value={visitDimensions.length} onChange={(e) => setVisitDimensions({...visitDimensions, length: e.target.value})} required className="w-full p-2 border rounded text-xs" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500">Altura (m)</label>
                      <input type="number" step="0.1" value={visitDimensions.height} onChange={(e) => setVisitDimensions({...visitDimensions, height: e.target.value})} required className="w-full p-2 border rounded text-xs" />
                    </div>
                  </div>

                  <div className="p-2.5 bg-blue-50 text-blue-900 rounded text-xs font-semibold">
                    Volume Real: {((Number(visitDimensions.width) || 0) * (Number(visitDimensions.length) || 0) * (Number(visitDimensions.height) || 0)).toFixed(1)} m³
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setVisitModalReqId(null)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-blue-600 text-white rounded text-xs font-bold hover:bg-blue-700">Salvar no Firebase e Iniciar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CONCLUIR MONTAGEM COM CÂMERA DO CELULAR E COMPRESSÃO DE FOTO */}
          {photoModalReq && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4 animate-in fade-in zoom-in">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                      <span>📸</span> Registrar Foto e Concluir Montagem
                    </h3>
                    <p className="text-xs text-slate-500">Solicitação ID: <strong>{photoModalReq.id}</strong> — {photoModalReq.factory}</p>
                  </div>
                  <button onClick={() => { setPhotoModalReq(null); setTempPhotoUrl(null); }} className="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
                </div>

                <div className="text-xs text-slate-600 space-y-1 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                  <p><span className="font-semibold text-slate-700">Local:</span> {photoModalReq.area} ({photoModalReq.reference})</p>
                  <p><span className="font-semibold text-slate-700">Responsável:</span> {photoModalReq.responsible}</p>
                  <p><span className="font-semibold text-slate-700">Dimensões Reais:</span> {photoModalReq.realWidth || photoModalReq.width}x{photoModalReq.realLength || photoModalReq.length}x{photoModalReq.realHeight || photoModalReq.height}m ({photoModalReq.realVolumeM3 || photoModalReq.volumeM3} m³)</p>
                </div>

                {/* Pré-visualização da foto */}
                {tempPhotoUrl ? (
                  <div className="space-y-2">
                    <div className="relative rounded-xl overflow-hidden border border-slate-200 max-h-56 bg-slate-900 flex items-center justify-center">
                      <img src={tempPhotoUrl} alt="Foto Andaime Montado" className="max-h-56 w-full object-contain" />
                      <span className="absolute top-2 right-2 bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow flex items-center gap-1">
                        <span>✓</span> Foto Otimizada para Nuvem
                      </span>
                    </div>
                    <div className="flex justify-between items-center pt-1">
                      <span className="text-[11px] text-emerald-700 font-semibold flex items-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        Compressão concluída (~80KB)
                      </span>
                      <button 
                        type="button" 
                        onClick={() => setTempPhotoUrl(null)} 
                        className="text-red-600 hover:text-red-700 font-semibold underline text-xs"
                      >
                        Tirar Outra Foto
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <p className="text-xs text-slate-600 font-medium">Capture a foto do andaime montado para auditoria técnica:</p>

                    {/* Botão 1: ATIVA A CÂMERA DO CELULAR */}
                    <div>
                      <input 
                        type="file" 
                        accept="image/*" 
                        capture="environment" 
                        id="camera-capture-input" 
                        className="hidden" 
                        onChange={async (e) => {
                          const file = e.target.files[0];
                          if (file) {
                            setIsCompressingPhoto(true);
                            try {
                              const compressed = await compressImage(file);
                              setTempPhotoUrl(compressed);
                            } catch (err) {
                              console.error('Erro na câmera:', err);
                              alert('Erro ao carregar foto da câmera.');
                            } finally {
                              setIsCompressingPhoto(false);
                            }
                          }
                        }} 
                      />
                      <label 
                        htmlFor="camera-capture-input" 
                        className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-bold rounded-xl flex items-center justify-center gap-2 cursor-pointer shadow-md transition text-xs"
                      >
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span>{isCompressingPhoto ? 'Comprimindo foto...' : 'Tirar Foto com a Câmera do Celular'}</span>
                      </label>
                    </div>

                    {/* Botão 2: ESCOLHER DA GALERIA */}
                    <div>
                      <input 
                        type="file" 
                        accept="image/*" 
                        id="gallery-file-input" 
                        className="hidden" 
                        onChange={async (e) => {
                          const file = e.target.files[0];
                          if (file) {
                            setIsCompressingPhoto(true);
                            try {
                              const compressed = await compressImage(file);
                              setTempPhotoUrl(compressed);
                            } catch (err) {
                              console.error('Erro no arquivo:', err);
                              alert('Erro ao carregar imagem da galeria.');
                            } finally {
                              setIsCompressingPhoto(false);
                            }
                          }
                        }} 
                      />
                      <label 
                        htmlFor="gallery-file-input" 
                        className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-98 text-slate-700 font-semibold rounded-xl flex items-center justify-center gap-2 cursor-pointer border border-slate-300 transition text-xs"
                      >
                        <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>Ou Escolher Foto da Galeria / Arquivos</span>
                      </label>
                    </div>
                  </div>
                )}

                {/* Botões de Ação */}
                <div className="flex flex-col sm:flex-row justify-end gap-2 pt-3 border-t border-slate-100">
                  <button 
                    type="button" 
                    onClick={() => { setPhotoModalReq(null); setTempPhotoUrl(null); }} 
                    className="px-3 py-2 border rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50 transition"
                  >
                    Cancelar
                  </button>
                  <button 
                    type="button" 
                    disabled={isSavingMontado || isCompressingPhoto}
                    onClick={async () => {
                      setIsSavingMontado(true);
                      const reqId = photoModalReq.id;
                      const updatedHistory = [
                        ...(photoModalReq.history || []),
                        { 
                          date: new Date().toLocaleString('pt-BR'), 
                          user: `${currentUser.name} (${currentUser.role})`, 
                          action: tempPhotoUrl 
                            ? 'Andaime Montado com foto auditada na nuvem' 
                            : 'Andaime Montado' 
                        }
                      ];

                      const mountDateStr = new Date().toLocaleString('pt-BR');
                      const mountTimestamp = Date.now();
                      const updateData = {
                        status: 'Montado',
                        mountedAt: mountDateStr,
                        mountedTimestamp: mountTimestamp,
                        history: updatedHistory
                      };
                      if (tempPhotoUrl) {
                        updateData.photoUrl = tempPhotoUrl;
                      }

                      setRequests(prev => prev.map(r => r.id === reqId ? { ...r, ...updateData } : r));

                      try {
                        await db.collection('andaimes_solicitacoes').doc(reqId).update(updateData);
                      } catch (err) {
                        console.error('Erro ao atualizar no Firestore:', err);
                      } finally {
                        setIsSavingMontado(false);
                        setPhotoModalReq(null);
                        setTempPhotoUrl(null);
                        setActiveTab('montados');
                      }
                    }} 
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs shadow-md transition flex items-center justify-center gap-1.5"
                  >
                    {isSavingMontado ? (
                      <span>Salvando no Firebase...</span>
                    ) : (
                      <span>✓ Confirmar Andaime como Montado</span>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: GESTOR CANCELAR SOLICITAÇÃO */}
          {cancelModalReq && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4 animate-in fade-in zoom-in">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-base text-red-600 flex items-center gap-2">
                    <span>✕</span> Cancelar Solicitação
                  </h3>
                  <button onClick={() => setCancelModalReq(null)} className="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
                </div>

                <div className="text-xs text-slate-600 bg-red-50 p-3 rounded-xl border border-red-200 space-y-1">
                  <p><span className="font-bold text-slate-800">Solicitação:</span> {cancelModalReq.id} ({cancelModalReq.factory})</p>
                  <p><span className="font-bold text-slate-800">Local:</span> {cancelModalReq.area} - {cancelModalReq.reference}</p>
                  <p><span className="font-bold text-slate-800">Atividade:</span> {cancelModalReq.activityDescription || 'Não informada'}</p>
                  <p className="text-[11px] text-red-700 pt-1 font-semibold">
                    Esta solicitação será removida da fila e registrada no indicador histórico de solicitações canceladas.
                  </p>
                </div>

                <form onSubmit={handleCancelRequestConfirm} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Motivo do Cancelamento (Opcional)</label>
                    <textarea 
                      rows="2"
                      placeholder="Ex: Demanda cancelada pela engenharia / Atividade adiada..." 
                      value={cancelReason}
                      onChange={(e) => setCancelReason(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs"
                    ></textarea>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                    <button type="button" onClick={() => setCancelModalReq(null)} className="px-3 py-1.5 border rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50">Voltar</button>
                    <button 
                      type="submit" 
                      disabled={isCancelling}
                      className="px-4 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold transition shadow"
                    >
                      {isCancelling ? 'Cancelando...' : 'Confirmar Cancelamento'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: ALINHAMENTO E AJUSTE DE PRAZOS PELO GESTOR */}
          {editDateModalReq && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-sm text-slate-800">Alinhamento de Prazos — {editDateModalReq.id}</h3>
                  <button onClick={() => setEditDateModalReq(null)} className="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
                </div>

                <div className="text-xs text-slate-600 space-y-1 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                  <p><span className="font-semibold">Fábrica / Área:</span> {editDateModalReq.factory} - {editDateModalReq.area}</p>
                  <p><span className="font-semibold">Responsável:</span> {editDateModalReq.responsible}</p>
                  <p><span className="font-semibold">Prev. Montagem Atual:</span> {editDateModalReq.dueDate || 'Não definida'}</p>
                  <p><span className="font-semibold">Prev. Desmontagem Atual:</span> {editDateModalReq.expectedDismantleDate || 'A definir'}</p>
                </div>

                <form onSubmit={handleSaveNewDueDate} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nova Data Prevista para Montagem *</label>
                    <input 
                      type="date" 
                      value={newDueDate} 
                      onChange={(e) => setNewDueDate(e.target.value)} 
                      required 
                      className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm font-semibold" 
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nova Data Prevista para Desmontagem</label>
                    <input 
                      type="date" 
                      value={newExpectedDismantleDate} 
                      onChange={(e) => setNewExpectedDismantleDate(e.target.value)} 
                      className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm font-semibold" 
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Motivo do Alinhamento com a Área (Opcional)</label>
                    <textarea 
                      rows="2"
                      placeholder="Ex: Alinhado com a supervisão de manutenção devido atraso na entrega de peças"
                      value={dateChangeReason}
                      onChange={(e) => setDateChangeReason(e.target.value)}
                      className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs" 
                    ></textarea>
                  </div>

                  <div className="flex items-center space-x-2 pt-1">
                    <input 
                      type="checkbox" 
                      id="chk-reorder" 
                      checked={autoReorderOnDateChange} 
                      onChange={(e) => setAutoReorderOnDateChange(e.target.checked)}
                      className="w-4 h-4 text-blue-600 rounded border-slate-300" 
                    />
                    <label htmlFor="chk-reorder" className="text-xs text-slate-600 cursor-pointer">
                      Reordenar automaticamente a fila no Firebase com esta nova data
                    </label>
                  </div>

                  <div className="flex justify-end space-x-2 pt-3 border-t border-slate-100">
                    <button type="button" onClick={() => setEditDateModalReq(null)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-blue-600 text-white rounded text-xs font-bold hover:bg-blue-700">Salvar Prazos na Nuvem</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: REGISTRAR / EDITAR ANDAIME DESMONTADO EM FÁBRICA (EQUIPE) */}
          {isStorageModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-lg w-full space-y-4 animate-in fade-in zoom-in">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="font-bold text-base text-cyan-900 flex items-center gap-2">
                      <span>📦</span> {editingStorageItem ? 'Editar Local de Andaime Desmontado' : 'Registrar Andaime Desmontado Guardado'}
                    </h3>
                    <p className="text-xs text-slate-500">Mapeamento físico para a equipe de montagem localizar o material.</p>
                  </div>
                  <button onClick={() => setIsStorageModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
                </div>

                <form onSubmit={handleSaveStorageItem} className="space-y-3 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Fábrica / Planta *</label>
                      <select
                        value={storageFormData.factory}
                        onChange={(e) => setStorageFormData({ ...storageFormData, factory: e.target.value })}
                        required
                        className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-bold"
                      >
                        <option value="">Selecione...</option>
                        {factories.map((f, i) => (
                          <option key={i} value={f}>{f}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Metros de Andaime *</label>
                      <input
                        type="number"
                        step="0.5"
                        placeholder="Ex: 50"
                        value={storageFormData.linearMeters}
                        onChange={(e) => setStorageFormData({ ...storageFormData, linearMeters: e.target.value })}
                        required
                        className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-bold text-cyan-800"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Local Exato / Ponto de Referência *</label>
                    <input
                      type="text"
                      placeholder="Ex: Mezanino 250 atrás do compressor UC8014, Pátio externo caldeiras..."
                      value={storageFormData.exactLocation}
                      onChange={(e) => setStorageFormData({ ...storageFormData, exactLocation: e.target.value })}
                      required
                      className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-semibold"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Tipo de Material</label>
                      <select
                        value={storageFormData.materialType}
                        onChange={(e) => setStorageFormData({ ...storageFormData, materialType: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg"
                      >
                        <option value="Torres Tubulares Completas">Torres Tubulares Completas</option>
                        <option value="Tubos e Braçadeiras">Tubos e Braçadeiras</option>
                        <option value="Pranchões e Plataformas">Pranchões e Plataformas</option>
                        <option value="Andaime Fachadeiro">Andaime Fachadeiro</option>
                        <option value="Material Misto Desmontado">Material Misto Desmontado</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Condição / Status</label>
                      <select
                        value={storageFormData.status}
                        onChange={(e) => setStorageFormData({ ...storageFormData, status: e.target.value })}
                        className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-semibold"
                      >
                        <option value="Disponível para Reuso">Disponível para Reuso</option>
                        <option value="Aguardando Inspeção">Aguardando Inspeção</option>
                        <option value="Em Manutenção">Em Manutenção</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Observações Adicionais (Opcional)</label>
                    <textarea
                      rows="2"
                      placeholder="Ex: Peças limpas e amarradas, fácil acesso com carrinho..."
                      value={storageFormData.notes}
                      onChange={(e) => setStorageFormData({ ...storageFormData, notes: e.target.value })}
                      className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg"
                    ></textarea>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                    <button type="button" onClick={() => setIsStorageModalOpen(false)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-700 text-white rounded text-xs font-bold">
                      Salvar Localização no Firebase
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: EXPORTAR EXCEL DIÁRIO COM FILTROS PARA APRESENTAR À CHEFIA */}
          {isExcelModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4 animate-in fade-in zoom-in">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="font-bold text-base text-emerald-900 flex items-center gap-2">
                      <span>📊</span> Exportar Excel para a Chefia
                    </h3>
                    <p className="text-xs text-slate-500">Gera planilha detalhada com todos os dados e status.</p>
                  </div>
                  <button onClick={() => setIsExcelModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                </div>

                <div className="space-y-3 text-xs">
                  {/* Filtro de Período */}
                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Filtrar Período:</label>
                    <select
                      value={excelDatePeriod}
                      onChange={(e) => setExcelDatePeriod(e.target.value)}
                      className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-semibold"
                    >
                      <option value="all">Todas as Datas (Histórico Completo)</option>
                      <option value="today">Hoje ({new Date().toLocaleDateString('pt-BR')})</option>
                      <option value="week">Esta Semana (Últimos 7 dias)</option>
                      <option value="month">Este Mês Atual</option>
                      <option value="custom">Intervalo de Datas Personalizado</option>
                    </select>
                  </div>

                  {excelDatePeriod === 'custom' && (
                    <div className="grid grid-cols-2 gap-2 p-2.5 bg-slate-50 rounded-lg border border-slate-200">
                      <div>
                        <span className="text-[10px] text-slate-500 font-semibold">De:</span>
                        <input
                          type="date"
                          value={excelCustomStart}
                          onChange={(e) => setExcelCustomStart(e.target.value)}
                          className="w-full p-1.5 bg-white border border-slate-300 rounded text-xs"
                        />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-500 font-semibold">Até:</span>
                        <input
                          type="date"
                          value={excelCustomEnd}
                          onChange={(e) => setExcelCustomEnd(e.target.value)}
                          className="w-full p-1.5 bg-white border border-slate-300 rounded text-xs"
                        />
                      </div>
                    </div>
                  )}

                  {/* Filtro de Status */}
                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Filtrar por Status:</label>
                    <select
                      value={excelStatusFilter}
                      onChange={(e) => setExcelStatusFilter(e.target.value)}
                      className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-semibold"
                    >
                      <option value="ALL">Todos os Status (Solicitações, Montados, Desmontados)</option>
                      <option value="Avaliação">1 - Solicitações na Fila</option>
                      <option value="Iniciado Montagem">2 - Visita Técnica Realizada</option>
                      <option value="Em Movimentação">3 - Em Transporte / Movimentação</option>
                      <option value="Montado">4 - Andaimes Montados em Campo</option>
                      <option value="Liberado para Desmontagem">5 - Liberado / Solicitada Desmontagem</option>
                      <option value="Desmontado">6 - Desmontados Concluídos</option>
                      <option value="Cancelado">Cancelados</option>
                    </select>
                  </div>

                  {/* Filtro de Fábrica */}
                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Filtrar por Fábrica:</label>
                    <select
                      value={excelFactoryFilter}
                      onChange={(e) => setExcelFactoryFilter(e.target.value)}
                      className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg font-semibold"
                    >
                      <option value="ALL">Todas as Fábricas / Plantas</option>
                      {factories.map((f, i) => (
                        <option key={i} value={f}>{f}</option>
                      ))}
                    </select>
                  </div>

                  <div className="p-2.5 bg-emerald-50 rounded-lg border border-emerald-200 text-[11px] text-emerald-800">
                    ✓ Arquivo gerado em formato <strong>.csv</strong> com codificação UTF-8 compatível diretamente com o <strong>Microsoft Excel</strong> brasileiro (colunas separadas por ponto e vírgula).
                  </div>

                  <div className="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                    <button type="button" onClick={() => setIsExcelModalOpen(false)} className="px-3 py-1.5 border rounded text-xs font-semibold">Cancelar</button>
                    <button
                      type="button"
                      onClick={handleExportExcelDaily}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold transition shadow flex items-center gap-1.5"
                    >
                      <span>📥</span> Baixar Planilha Excel (.csv)
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
