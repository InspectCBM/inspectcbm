                      <button
                        type="button"
                        onClick={() => setFormData({ ...formData, canUsePEMT: 'NÃO', pemtJustification: '' })}
                        className={`py-2.5 px-4 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-2 ${
                          formData.canUsePEMT === 'NÃO'
                            ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                        }`}
                      >
                        <span>✕</span> NÃO
                      </button>

                      <button
                        type="button"
                        onClick={() => setFormData({ ...formData, canUsePEMT: 'SIM' })}
                        className={`py-2.5 px-4 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-2 ${
                          formData.canUsePEMT === 'SIM'
                            ? 'bg-amber-600 text-white border-amber-600 shadow-sm'
                            : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'
                        }`}
                      >
                        <span>✓</span> SIM
                      </button>
                    </div>

                    {formData.canUsePEMT === 'SIM' && (
                      <div className="pt-2 animate-in fade-in">
                        <label className="block text-xs font-bold text-amber-900 uppercase mb-1">
                          Justificativa para montagem de andaime *
                        </label>
                        <textarea 
                          name="pemtJustification" 
                          rows="2"
                          placeholder="Informe a justificativa técnica para optar pelo andaime..." 
                          value={formData.pemtJustification} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-amber-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:border-amber-500"
                        ></textarea>
                      </div>
                    )}
                  </div>

                  {/* RESPONSÁVEL PELA ATIVIDADE, EMAIL E TELEFONE */}
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div className="flex items-center justify-between">
                      <label className="text-xs font-bold text-slate-700 uppercase tracking-wide flex items-center gap-1.5">
                        <span>👷</span> Responsável pela Atividade (Dono do Serviço no Local) *
                      </label>
                      <span className="text-[10px] text-slate-500 font-medium">Pode ser diferente do solicitante logado</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome do Responsável *</label>
                        <input 
                          type="text" 
                          name="activityResponsible" 
                          placeholder="Nome do responsável" 
                          value={formData.activityResponsible} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm" 
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">E-mail do Responsável *</label>
                        <input 
                          type="email" 
                          name="email" 
                          placeholder="responsavel@empresa.com" 
                          value={formData.email} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm" 
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Telefone / Ramal *</label>
                        <input 
                          type="text" 
                          name="phone" 
                          placeholder="(XX) 99999-9999" 
                          value={formData.phone} 
                          onChange={handleInputChange} 
                          required 
                          className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm" 
                        />
                      </div>
                    </div>
                  </div>

                  {/* DATAS: DATA PREVISTA PARA MONTAGEM E DATA PREVISTA PARA DESMONTAGEM */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div>
                      <label className="block text-xs font-bold text-blue-900 uppercase mb-1 flex items-center gap-1">
                        <span>📅</span> Data Prevista para Montagem *
                      </label>
                      <input 
                        type="date" 
                        name="expectedAssemblyDate" 
                        value={formData.expectedAssemblyDate} 
                        onChange={handleInputChange} 
                        required 
                        className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm font-bold text-slate-800" 
                      />
                      <p className="text-[10px] text-slate-400 mt-1">Define a prioridade na fila de espera da montagem.</p>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1 flex items-center gap-1">
                        <span>🗓️</span> Data Prevista para Desmontagem
                      </label>
                      <input 
                        type="date" 
                        name="expectedDismantleDate" 
                        value={formData.expectedDismantleDate} 
                        onChange={handleInputChange} 
                        className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm font-medium text-slate-800" 
                      />
                      <p className="text-[10px] text-slate-400 mt-1">Previsão para conclusão do serviço e desmobilização.</p>
                    </div>
                  </div>

                  {/* URGÊNCIA */}
                  <div className="flex items-center px-1">
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input 
                        type="checkbox" 
                        name="isUrgent" 
                        checked={formData.isUrgent} 
                        onChange={handleInputChange} 
                        className="w-4 h-4 text-red-600 rounded border-slate-300" 
                      />
                      <span className="text-xs font-bold text-red-600">Marcar como URGÊNCIA OPERACIONAL</span>
                    </label>
                  </div>

                  {/* DIMENSÕES ESTIMADAS */}
                  <div className="border-t border-slate-200 pt-4">
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-2">Dimensões Estimadas (Metros)</label>
                    <div className="grid grid-cols-3 gap-3">
                      <div>
                        <span className="text-[11px] text-slate-500">Largura (m)</span>
                        <input type="number" step="0.1" name="width" placeholder="Ex: 2" value={formData.width} onChange={handleInputChange} required className="w-full p-2 bg-slate-50 border border-slate-300 rounded text-sm" />
                      </div>
                      <div>
                        <span className="text-[11px] text-slate-500">Comprimento (m)</span>
                        <input type="number" step="0.1" name="length" placeholder="Ex: 3" value={formData.length} onChange={handleInputChange} required className="w-full p-2 bg-slate-50 border border-slate-300 rounded text-sm" />
                      </div>
                      <div>
                        <span className="text-[11px] text-slate-500">Altura (m)</span>
                        <input type="number" step="0.1" name="height" placeholder="Ex: 4" value={formData.height} onChange={handleInputChange} required className="w-full p-2 bg-slate-50 border border-slate-300 rounded text-sm" />
                      </div>
                    </div>

                    <div className="mt-3 p-3 bg-slate-50 rounded-lg flex justify-between text-xs font-semibold text-slate-700">
                      <span>Área de Base Estimada: {calcBaseArea.toFixed(1)} m²</span>
                      <span className="text-blue-600">Volume Total Estimado: {calcVolume.toFixed(1)} m³</span>
                    </div>
                  </div>

                  <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition text-sm">
                    Enviar Solicitação para a Fila (Salvar na Nuvem)
                  </button>
                </form>
              </div>
            )}

            {/* ABA 2: SOLICITAÇÕES (FILA DE ESPERA POR DATA PREVISTA PARA MONTAGEM) */}
            {activeTab === 'solicitacoes' && (
              <div className="space-y-4">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-amber-50 p-4 rounded-xl border border-amber-200">
                  <div>
                    <h2 className="font-bold text-amber-900 text-sm flex items-center gap-2">
                      <span>📋</span> Solicitações & Fila de Espera ({queueRequests.length})
                    </h2>
                    <p className="text-xs text-amber-700 mt-0.5">
                      Fila organizada com base na <strong>Data Prevista para Montagem</strong> (a mais urgente primeiro).
                    </p>
                  </div>
                  <div className="flex gap-2">
                    <button 
                      onClick={() => setActiveTab('nova')}
                      className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg shadow transition"
                    >
                      + Nova Solicitação
                    </button>
                    {isGestor && (
                      <button 
                        onClick={() => setRequests(sortQueueByDueDate([...requests]))}
                        className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-lg shadow transition"
                        title="Reordenar com base na data prevista para montagem"
                      >
                        ⚡ Reordenar por Prazo
                      </button>
                    )}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {queueRequests.map(renderCard)}
                </div>

                {queueRequests.length === 0 && (
                  <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                    <p className="text-sm font-semibold text-slate-600">Nenhuma solicitação na fila de espera no momento.</p>
                    <p className="text-xs text-slate-400 mt-1">Todas as montagens pendentes foram atendidas.</p>
                  </div>
                )}
              </div>
            )}

            {/* ABA 3: MONTADOS EM CAMPO */}
            {activeTab === 'montados' && (
              <div className="space-y-4">
                <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                  <div>
                    <h2 className="font-bold text-emerald-900 text-sm flex items-center gap-2">
                      <span>🏗️</span> Andaimes Montados em Campo ({mountedRequests.length})
                    </h2>
                    <p className="text-xs text-emerald-700 mt-0.5">
                      Consumindo atualmente <strong>{allocatedM3} m³</strong> de {totalCapacityM3} m³ contratados.
                    </p>
                  </div>
                  <span className="text-xs font-extrabold px-3 py-1 bg-emerald-200 text-emerald-900 rounded-full border border-emerald-300">
                    Ocupação: {((allocatedM3 / totalCapacityM3) * 100).toFixed(1)}%
                  </span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {mountedRequests.map(renderCard)}
                </div>

                {mountedRequests.length === 0 && (
                  <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                    <p className="text-sm font-semibold text-slate-600">Não há andaimes montados em campo no momento.</p>
                  </div>
                )}
              </div>
            )}

            {/* ABA 4: DESMONTADOS CONCLUÍDOS */}
            {activeTab === 'desmontados' && (
              <div className="space-y-4">
                <div className="bg-slate-200/70 p-4 rounded-xl border border-slate-300 space-y-1">
                  <h2 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                    <span>✅</span> Histórico de Andaimes Desmontados Concluídos ({dismantledRequests.length + (archivedStats.extraDesmontados || 0)})
                  </h2>
                  <p className="text-xs text-slate-600">
                    Quando o andaime é finalizado e recolhido, as informações ativas são limpas da nuvem para economizar espaço e custos de banco, mantendo o total acumulado seguro no indicador histórico.
                  </p>
                </div>

                {dismantledRequests.length > 0 ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {dismantledRequests.map(renderCard)}
                  </div>
                ) : (
                  <div className="bg-white p-8 rounded-xl border border-slate-200 text-center space-y-2">
                    <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl">
                      ✓
                    </div>
                    <h3 className="font-bold text-slate-800 text-sm">Nuvem Otimizada e 100% Livre</h3>
                    <p className="text-xs text-slate-500 max-w-md mx-auto">
                      Todos os andaimes já desmontados tiveram seus documentos liberados do banco de dados na nuvem para manter a operação ágil e limpa. O total de <strong>{displayedStats.desmontados} andaimes finalizados</strong> está registrado nos indicadores históricos.
                    </p>
                  </div>
                )}
              </div>
            )}

            {/* ABA 5: ESTOQUE DE ANDAIMES DESMONTADOS EM FÁBRICA (EXCLUSIVA PARA A EQUIPE E GESTÃO NÃO ESQUECEREM ONDE ESTÁ E QUANTOS METROS TEM!) */}
            {activeTab === 'estoque_desmontado' && (
              <div className="space-y-5">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-indigo-50 p-4 sm:p-5 rounded-2xl border border-indigo-200">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="p-2 bg-indigo-600 text-white rounded-lg text-sm">📦</span>
                      <h2 className="font-extrabold text-indigo-950 text-sm sm:text-base">
                        Controle de Andaimes Desmontados em Fábrica
                      </h2>
                    </div>
                    <p className="text-xs text-indigo-800 mt-1">
                      Registro de onde o material desmontado está guardado e a metragem disponível em cada área da planta.
                    </p>
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="text-right">
                      <span className="text-[10px] text-indigo-600 font-bold uppercase block">Total na Planta</span>
                      <span className="text-2xl font-black text-indigo-950">{totalDismantledMetersInStock} m</span>
                    </div>

                    {(isEquipe || isGestor) && (
                      <button
                        type="button"
                        onClick={() => {
                          setEditingStockItem(null);
                          setStockFormData({
                            factory: factories[0] || 'DRYMIX',
                            exactLocation: '',
                            meters: '',
                            unit: 'metros lineares',
                            piecesDescription: '',
                            registeredBy: currentUser ? currentUser.name : '',
                            phone: '',
                            status: 'Disponível'
                          });
                          setIsStockModalOpen(true);
                        }}
                        className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow transition flex items-center gap-1.5"
                      >
                        <span>+</span> Registrar Material
                      </button>
                    )}
                  </div>
                </div>

                {/* CARDS COM O ESTOQUE POR FÁBRICA */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {dismantledStock.map((item) => (
                    <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="px-2.5 py-0.5 bg-indigo-100 text-indigo-900 font-black text-xs rounded uppercase tracking-wide">
                            {item.factory}
                          </span>
                          <span className="text-[10px] text-slate-400 block mt-1 font-mono">{item.id} • {item.date}</span>
                        </div>
                        <div className="text-right">
                          <span className="text-xl font-black text-indigo-600">{item.meters}</span>
                          <span className="text-xs text-slate-500 font-medium block">{item.unit || 'm lineares'}</span>
                        </div>
                      </div>

                      <div className="space-y-1 text-xs">
                        <p className="font-bold text-slate-800 flex items-start gap-1">
                          <span>📍</span> <span className="text-indigo-950">{item.exactLocation}</span>
                        </p>
                        {item.piecesDescription && (
                          <div className="bg-slate-50 p-2 rounded-lg border border-slate-100 text-[11px] text-slate-600">
                            <span className="font-semibold text-slate-700 block">Peças / Descrição:</span>
                            {item.piecesDescription}
                          </div>
                        )}
                        <p className="text-[11px] text-slate-500 pt-1">
                          <span className="font-semibold">Responsável:</span> {item.registeredBy} {item.phone ? `(${item.phone})` : ''}
                        </p>
                      </div>

                      <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                          item.status === 'Disponível' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                        }`}>
                          {item.status || 'Disponível'}
                        </span>

                        {(isEquipe || isGestor) && (
                          <div className="flex gap-2 text-xs">
                            <button
                              onClick={() => {
                                setEditingStockItem(item);
                                setStockFormData({
                                  factory: item.factory,
                                  exactLocation: item.exactLocation,
                                  meters: item.meters,
                                  unit: item.unit || 'metros lineares',
                                  piecesDescription: item.piecesDescription || '',
                                  registeredBy: item.registeredBy || '',
                                  phone: item.phone || '',
                                  status: item.status || 'Disponível'
                                });
                                setIsStockModalOpen(true);
                              }}
                              className="text-blue-600 hover:text-blue-800 font-semibold underline text-[11px]"
                            >
                              Editar
                            </button>
                            <button
                              onClick={() => handleDeleteStockItem(item)}
                              className="text-red-600 hover:text-red-800 font-semibold underline text-[11px]"
                              title="Dar baixa no lote de material"
                            >
                              Dar Baixa
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                {dismantledStock.length === 0 && (
                  <div className="text-center py-12 bg-white rounded-xl border border-dashed border-slate-300">
                    <p className="text-sm font-semibold text-slate-600">Nenhum lote de material desmontado registrado no momento.</p>
                    <p className="text-xs text-slate-400 mt-1">Clique em "+ Registrar Material" para marcar onde os tubos e pranchas foram guardados.</p>
                  </div>
                )}
              </div>
            )}

            {/* ABA 6: INDICADORES & RELATÓRIOS (ONDE FICA A BARRA DE INDICADORES, O GERADOR DE PDF E O EXPORTADOR EXCEL DIÁRIO!) */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                
                {/* 1. BLOCO DE INDICADORES DA GESTÃO COM FILTROS POR SEMANA E MÊS E BOTÃO DE PDF */}
                <div className="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 border-b border-slate-100 pb-3">
                    <div>
                      <div className="flex items-center gap-2">
                        <h2 className="text-sm sm:text-base font-extrabold text-slate-800 flex items-center gap-2">
                          <span>📈</span> Indicadores da Gestão de Andaimes
                        </h2>
                        <span className="text-[10px] bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full border border-blue-200">
                          Sincronizado
                        </span>
                      </div>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Filtrando por: <strong className="text-slate-800 font-bold">{filterPeriodLabel}</strong>
                      </p>
                    </div>

                    <div className="flex items-center gap-2 flex-wrap">
                      {/* BOTÃO GERAR RELATÓRIO PDF */}
                      <button
                        type="button"
                        onClick={() => setIsPdfModalOpen(true)}
                        className="px-3.5 py-1.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition shadow flex items-center gap-1.5"
                      >
                        <span>📄</span> Relatório PDF por Fábrica
                      </button>

                      {/* BOTÕES DE FILTRO POR PERÍODO */}
                      <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                        <button 
                          type="button"
                          onClick={() => setFilterPeriod('all')}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
                            filterPeriod === 'all' 
                              ? 'bg-white text-slate-900 shadow-sm border border-slate-200' 
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          <span>📌</span> Geral
                        </button>

                        <button 
                          type="button"
                          onClick={() => setFilterPeriod('month')}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
                            filterPeriod === 'month' 
                              ? 'bg-blue-600 text-white shadow-sm' 
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          <span>🗓️</span> Este Mês
                        </button>

                        <button 
                          type="button"
                          onClick={() => setFilterPeriod('week')}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
                            filterPeriod === 'week' 
                              ? 'bg-indigo-600 text-white shadow-sm' 
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          <span>⏱️</span> Esta Semana
                        </button>

                        <button 
                          type="button"
                          onClick={() => setFilterPeriod('today')}
                          className={`px-2.5 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 ${
                            filterPeriod === 'today' 
                              ? 'bg-emerald-600 text-white shadow-sm' 
                              : 'text-slate-600 hover:text-slate-900'
                          }`}
                        >
                          <span>📍</span> Hoje
                        </button>

                        {isGestor && (
                          <button 
                            type="button"
                            onClick={handleSyncIndicatorsWithDatabase}
                            className="ml-1 px-2.5 py-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black rounded-lg text-xs transition shadow-sm flex items-center gap-1"
                            title="Sincronizar indicadores com a base real do Firebase"
                          >
                            <span>🔄</span>
                          </button>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* 4 CARDS DE INDICADORES */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="p-3.5 bg-amber-50 rounded-xl border border-amber-200">
                      <p className="text-[10px] font-bold text-amber-800 uppercase tracking-wide">
                        {filterPeriod === 'all' ? 'Solicitações na Fila' : 'Solicitados no Período'}
                      </p>
                      <p className="text-3xl font-black text-amber-950 mt-1">{displayedStats.solicitados}</p>
                      <p className="text-[10px] text-amber-700 font-medium mt-1">
                        {filterPeriod === 'all' ? `${requests.length} no total da fábrica` : 'No período selecionado'}
                      </p>
                    </div>

                    <div className="p-3.5 bg-emerald-50 rounded-xl border border-emerald-200">
                      <p className="text-[10px] font-bold text-emerald-800 uppercase tracking-wide">
                        {filterPeriod === 'all' ? 'Montados em Campo' : 'Montagens no Período'}
                      </p>
                      <p className="text-3xl font-black text-emerald-950 mt-1">{displayedStats.montados}</p>
                      <p className="text-[10px] text-emerald-700 font-medium mt-1">
                        Consumindo {allocatedM3} m³
                      </p>
                    </div>

                    <div className="p-3.5 bg-slate-100 rounded-xl border border-slate-300">
                      <p className="text-[10px] font-bold text-slate-700 uppercase tracking-wide">
                        {filterPeriod === 'all' ? 'Desmontados Concluídos' : 'Desmontados no Período'}
                      </p>
                      <p className="text-3xl font-black text-slate-900 mt-1">{displayedStats.desmontados}</p>
                      <p className="text-[10px] text-slate-500 font-medium mt-1">
                        Finalizados com sucesso
                      </p>
                    </div>

                    <div className="p-3.5 bg-red-50 rounded-xl border border-red-200">
                      <p className="text-[10px] font-bold text-red-800 uppercase tracking-wide">
                        {filterPeriod === 'all' ? 'Total Cancelados' : 'Cancelados no Período'}
                      </p>
                      <p className="text-3xl font-black text-red-950 mt-1">{displayedStats.cancelados}</p>
                      <p className="text-[10px] text-red-700 font-medium mt-1">
                        Pela gestão de andaimes
                      </p>
                    </div>
                  </div>
                </div>

                {/* 2. EXPORTAÇÃO DIÁRIA DA PLANILHA EXCEL (.XLSX) PARA APRESENTAÇÃO À CHEFIA */}
                <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-100 pb-3">
                    <div>
                      <h3 className="text-base font-extrabold text-slate-900 flex items-center gap-2">
                        <span className="p-1.5 bg-emerald-100 text-emerald-800 rounded-lg text-sm">📊</span>
                        Exportação Diária de Solicitações para Excel (.xlsx)
                      </h3>
                      <p className="text-xs text-slate-500 mt-0.5">
                        Gere a planilha completa diariamente para apresentar à chefia. Cada nova solicitação já atualiza a base automaticamente.
                      </p>
                    </div>
                  </div>

                  <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div className="flex flex-wrap items-center gap-3">
                      <div>
                        <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Filtrar Período:</label>
                        <select
                          value={excelFilterPeriod}
                          onChange={(e) => setExcelFilterPeriod(e.target.value)}
                          className="p-2 bg-white border border-slate-300 rounded-lg text-xs font-semibold text-slate-800"
                        >
                          <option value="all">📌 Todas as Solicitações</option>
                          <option value="today">📍 Apenas Hoje</option>
                          <option value="week">⏱️ Esta Semana</option>
                          <option value="month">🗓️ Este Mês</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-[10px] font-bold text-slate-500 uppercase block mb-1">Filtrar Fábrica:</label>
                        <select
                          value={excelFactoryFilter}
                          onChange={(e) => setExcelFactoryFilter(e.target.value)}
                          className="p-2 bg-white border border-slate-300 rounded-lg text-xs font-semibold text-slate-800"
                        >
                          <option value="ALL">🏢 Todas as Fábricas</option>
                          {factories.map((f, i) => (
                            <option key={i} value={f.toUpperCase()}>{f}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <button
                      type="button"
                      onClick={handleDownloadExcel}
                      className="px-5 py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-bold rounded-xl text-xs shadow-md transition flex items-center justify-center gap-2"
                    >
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                      <span>Baixar Planilha Excel (.xlsx)</span>
                    </button>
                  </div>

                  <p className="text-[11px] text-slate-500 italic">
                    ✓ A planilha contém todas as 26 colunas de dados preenchidos: status detalhado, fábrica, ponto de ref, atividade, PEMT, dimensões, volumes estimados/reais, datas previstas para montagem e desmontagem, e responsáveis.
                  </p>
                </div>

                {/* 3. CAPACIDADE, ESTOQUE M3 E TAXA DE OCUPAÇÃO */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Capacidade Contratada</p>
                    <p className="text-2xl font-black text-slate-800 mt-1">{totalCapacityM3} <span className="text-sm font-normal text-slate-500">m³</span></p>
                    <p className="text-[11px] text-slate-400 mt-1">Limite mensal contratado</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Em Uso Efetivo (Montado)</p>
                    <p className="text-2xl font-black text-blue-600 mt-1">{allocatedM3} <span className="text-sm font-normal text-slate-500">m³</span></p>
                    <p className="text-[11px] text-slate-400 mt-1">Montagens reais em campo</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p className="text-xs font-semibold text-slate-500 uppercase">Disponível em Estoque</p>
                    <p className={`text-2xl font-black mt-1 ${availableM3 < 50 ? 'text-red-600' : 'text-emerald-600'}`}>
                      {availableM3} <span className="text-sm font-normal text-slate-500">m³</span>
                    </p>
                    <p className="text-[11px] text-slate-400 mt-1">{((availableM3 / totalCapacityM3) * 100).toFixed(1)}% livre</p>
                  </div>
                </div>

                {/* Barra de Progresso de Ocupação */}
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-2">
                  <div className="flex justify-between items-center text-xs">
                    <span className="font-bold text-slate-700">Taxa de Ocupação de Andaimes da Planta</span>
                    <span className="font-bold text-slate-700">{((allocatedM3 / totalCapacityM3) * 100).toFixed(1)}%</span>
                  </div>
                  <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                    <div 
                      className={`h-full transition-all duration-500 ${
                        (allocatedM3 / totalCapacityM3) > 0.85 ? 'bg-red-500' :
                        (allocatedM3 / totalCapacityM3) > 0.65 ? 'bg-amber-500' : 'bg-blue-600'
                      }`}
                      style={{ width: `${Math.min(100, (allocatedM3 / totalCapacityM3) * 100)}%` }}
                    ></div>
                  </div>
                </div>
              </div>
            )}

            {/* ABA 7: GESTÃO & FÁBRICAS (EXCLUSIVO GESTOR) */}
            {activeTab === 'gestao' && isGestor && (
              <div className="space-y-6 max-w-4xl mx-auto">
                {/* 1. GERENCIAMENTO DE FÁBRICAS / PLANTAS */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div>
                      <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                        <span>🏢</span> Gerenciamento de Plantas e Fábricas
                      </h3>
                      <p className="text-xs text-slate-500">
                        Adicione ou remova fábricas disponíveis no sistema. Salvo automaticamente no Firebase para todos.
                      </p>
                    </div>
                    <span className="px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-full text-xs font-bold">
                      {factories.length} fábricas
                    </span>
                  </div>

                  <form 
                    onSubmit={(e) => {
                      e.preventDefault();
                      if (newFactoryInputManage.trim()) {
                        handleAddFactory(newFactoryInputManage);
                        setNewFactoryInputManage('');
                      }
                    }}
                    className="flex gap-2"
                  >
                    <input 
                      type="text" 
                      placeholder="Nome da nova fábrica (Ex: PRÉDIO MILKA, CALDEIRAS...)" 
                      value={newFactoryInputManage}
                      onChange={(e) => setNewFactoryInputManage(e.target.value)}
                      className="flex-1 p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold uppercase focus:outline-none focus:border-blue-500"
                    />
                    <button 
                      type="submit" 
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg shadow transition flex items-center gap-1"
                    >
                      <span>+</span> Adicionar Fábrica
                    </button>
                  </form>

                  <div className="flex flex-wrap gap-2 pt-2">
                    {factories.map((f, i) => (
                      <span key={i} className="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-100 border border-slate-300 rounded-lg text-xs font-bold text-slate-700">
                        <span>🏢</span> {f}
                        <button 
                          onClick={() => handleRemoveFactory(f)}
                          className="text-slate-400 hover:text-red-600 font-bold ml-1"
                          title="Remover fábrica da lista"
                        >
                          &times;
                        </button>
                      </span>
                    ))}
                  </div>
                </div>

                {/* 2. GERENCIAMENTO DE LOGINS E ACESSOS */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div>
                      <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                        <span>👥</span> Controle e Exclusão de Logins Cadastrados
                      </h3>
                      <p className="text-xs text-slate-500">
                        O Gestor pode excluir acessos não mais autorizados ou cadastrados incorretamente.
                      </p>
                    </div>
                    <span className="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full text-xs font-bold">
                      {users.length} usuários
                    </span>
                  </div>

                  <div className="divide-y divide-slate-100">
                    {users.map((u) => {
                      const isMe = currentUser && u.email.toLowerCase() === currentUser.email.toLowerCase();
                      return (
                        <div key={u.id || u.email} className="py-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-sm text-slate-800">{u.name}</span>
                              {isMe && (
                                <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.2 rounded-full">
                                  Você
                                </span>
                              )}
                            </div>
                            <p className="text-xs text-slate-500">{u.email}</p>
                            <span className={`inline-block mt-1 text-[11px] font-semibold px-2 py-0.5 rounded ${
                              u.role === 'Gestor de Andaimes' ? 'bg-purple-100 text-purple-800' :
                              u.role === 'Equipe de Andaimes' ? 'bg-blue-100 text-blue-800' :
                              'bg-slate-100 text-slate-700'
                            }`}>
                              {u.role}
                            </span>
                          </div>

                          <div>
                            {isMe ? (
                              <span className="text-xs text-slate-400 italic">Sessão Atual</span>
                            ) : (
                              <button 
                                onClick={() => handleDeleteUser(u)}
                                className="px-3 py-1.5 bg-red-50 hover:bg-red-600 text-red-600 hover:text-white border border-red-200 rounded-lg text-xs font-bold transition flex items-center gap-1.5"
                                title="Excluir o login deste usuário do sistema"
                              >
                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                Excluir Login
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 3. SINCRONIZAÇÃO E RECALIBRAÇÃO DE INDICADORES */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                        <span>🔄</span> Sincronização e Ajuste de Indicadores
                      </h3>
                      <p className="text-xs text-slate-500">Recalcula os dados reais de solicitações, montados e desmontados diretamente com a nuvem.</p>
                    </div>
                    <button 
                      onClick={handleSyncIndicatorsWithDatabase}
                      className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg text-xs transition shadow flex items-center gap-1.5"
                    >
                      <span>🔄</span> Forçar Sincronização Agora
                    </button>
                  </div>
                </div>

                {/* 4. AJUSTE DE CAPACIDADE CONTRATADA */}
                <div className="bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                  <h3 className="font-bold text-base text-slate-800">Ajuste de Capacidade Máxima Contratada</h3>
                  <p className="text-xs text-slate-500">Ajuste o volume total em m³ contratado junto à montadora. Salvo no Firebase para todos.</p>
                  
                  <div className="flex items-center space-x-3 pt-2">
                    <input 
                      type="number" 
                      value={totalCapacityM3} 
                      onChange={(e) => handleUpdateCapacity(Number(e.target.value) || 0)} 
                      className="p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm w-36 font-bold" 
                    />
                    <span className="text-sm font-semibold text-slate-600">m³ Contratados</span>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* MODAL: REGISTRAR / EDITAR LOCAL DE ANDAIME DESMONTADO NA FÁBRICA */}
          {isStockModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-lg w-full space-y-4 animate-in fade-in zoom-in">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                    <span>📦</span> {editingStockItem ? 'Editar Lote Desmontado' : 'Registrar Novo Local de Material Desmontado'}
                  </h3>
                  <button onClick={() => setIsStockModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
                </div>

                <form onSubmit={handleSaveStockItem} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Fábrica / Planta *</label>
                      <select
                        value={stockFormData.factory}
                        onChange={(e) => setStockFormData({ ...stockFormData, factory: e.target.value })}
                        required
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-slate-800"
                      >
                        <option value="">Selecione a Fábrica *</option>
                        {factories.map((f, i) => (
                          <option key={i} value={f}>{f}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Quantidade em Metros *</label>
                      <input
                        type="number"
                        step="0.5"
                        placeholder="Ex: 40"
                        value={stockFormData.meters}
                        onChange={(e) => setStockFormData({ ...stockFormData, meters: e.target.value })}
                        required
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-indigo-700"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Local Exato de Armazenamento *</label>
                    <input
                      type="text"
                      placeholder="Ex: Pátio externo lateral da caldeira / Atrás do silo 06"
                      value={stockFormData.exactLocation}
                      onChange={(e) => setStockFormData({ ...stockFormData, exactLocation: e.target.value })}
                      required
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-medium text-slate-800"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Descrição das Peças / Lote</label>
                    <textarea
                      rows="2"
                      placeholder="Ex: Tubos de 3m e 4m, 12 pranchas metálicas, braçadeiras fixas e sapatas"
                      value={stockFormData.piecesDescription}
                      onChange={(e) => setStockFormData({ ...stockFormData, piecesDescription: e.target.value })}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs"
                    ></textarea>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Responsável pelo Registro</label>
                      <input
                        type="text"
                        placeholder="Nome de quem guardou"
                        value={stockFormData.registeredBy}
                        onChange={(e) => setStockFormData({ ...stockFormData, registeredBy: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Status do Lote</label>
                      <select
                        value={stockFormData.status}
                        onChange={(e) => setStockFormData({ ...stockFormData, status: e.target.value })}
                        className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold"
                      >
                        <option value="Disponível">Disponível para Montagem</option>
                        <option value="Reservado">Reservado para Atividade</option>
                        <option value="Necessita Manutenção">Necessita Inspeção / Manutenção</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setIsStockModalOpen(false)}
                      className="px-3 py-2 border rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-xs shadow"
                    >
                      Salvar Estoque na Nuvem
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: RELATÓRIO PDF EXECUTIVO DE CONTROLE DOS INDICADORES SEPARADO POR FÁBRICA */}
          {isPdfModalOpen && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 overflow-y-auto p-2 sm:p-6 flex justify-center">
              <div className="bg-white rounded-2xl shadow-2xl max-w-5xl w-full p-4 sm:p-8 space-y-6 print-modal-container my-auto">
                
                {/* Barra de Ações Superior */}
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-200 pb-4 no-print">
                  <div>
                    <h2 className="text-lg font-black text-slate-800 flex items-center gap-2">
                      <span>📄</span> Visualização do Relatório Executivo de Indicadores
                    </h2>
                    <p className="text-xs text-slate-500">
                      Relatório oficial separado por fábrica. Clique no botão verde para gerar ou salvar em PDF.
                    </p>
                  </div>

                  <div className="flex items-center gap-2 flex-wrap">
                    <select
                      value={pdfFactoryFilter}
                      onChange={(e) => setPdfFactoryFilter(e.target.value)}
                      className="p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-slate-800"
                    >
                      <option value="ALL">🏢 Todas as Fábricas</option>
                      {factories.map((f, i) => (
                        <option key={i} value={f.toUpperCase()}>{f}</option>
                      ))}
                    </select>

                    <button
                      type="button"
                      onClick={() => window.print()}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs shadow-md transition flex items-center gap-1.5"
                    >
                      <span>🖨️</span> Salvar em PDF / Imprimir
                    </button>

                    <button
                      type="button"
                      onClick={() => setIsPdfModalOpen(false)}
                      className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg text-xs transition"
                    >
                      Fechar ✕
                    </button>
                  </div>
                </div>

                {/* CORPO DO RELATÓRIO FORMATADO PARA A4 / PDF */}
                <div className="space-y-6 text-slate-800">
                  
                  {/* CABEÇALHO DO RELATÓRIO */}
                  <div className="flex justify-between items-start border-b-2 border-slate-800 pb-4">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="p-2 bg-blue-600 text-white rounded font-black text-sm">INSPECTCBM</span>
                        <h1 className="text-xl font-black text-slate-900 tracking-wide uppercase">
                          Relatório de Controle de Andaimes
                        </h1>
                      </div>
                      <p className="text-xs text-slate-600 mt-1 font-semibold">
                        Gestão Operacional, Fila de Espera, Ocupação em M³ e Montagens por Fábrica
                      </p>
                    </div>

                    <div className="text-right text-xs space-y-0.5">
                      <p><span className="font-bold">Data de Emissão:</span> {new Date().toLocaleDateString('pt-BR')} às {new Date().toLocaleTimeString('pt-BR')}</p>
                      <p><span className="font-bold">Emitido por:</span> {currentUser ? `${currentUser.name} (${currentUser.role})` : 'Sistema'}</p>
                      <p><span className="font-bold">Período:</span> {filterPeriodLabel}</p>
                    </div>
                  </div>

                  {/* RESUMO GERAL CONSOLIDADO DA PLANTA */}
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-300 space-y-3">
                    <h3 className="text-xs font-black uppercase tracking-wider text-slate-700">
                      1. Indicadores Consolidados da Planta
                    </h3>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                      <div className="p-2 bg-white rounded-lg border border-slate-200">
                        <span className="text-[10px] text-slate-500 font-bold uppercase block">Solicitações na Fila</span>
                        <span className="text-2xl font-black text-amber-900">{displayedStats.solicitados}</span>
                      </div>
                      <div className="p-2 bg-white rounded-lg border border-slate-200">
                        <span className="text-[10px] text-slate-500 font-bold uppercase block">Montados em Campo</span>
                        <span className="text-2xl font-black text-emerald-900">{displayedStats.montados}</span>
                      </div>
                      <div className="p-2 bg-white rounded-lg border border-slate-200">
                        <span className="text-[10px] text-slate-500 font-bold uppercase block">Desmontados Concluídos</span>
                        <span className="text-2xl font-black text-slate-900">{displayedStats.desmontados}</span>
                      </div>
                      <div className="p-2 bg-white rounded-lg border border-slate-200">
                        <span className="text-[10px] text-slate-500 font-bold uppercase block">Cancelados</span>
                        <span className="text-2xl font-black text-red-900">{displayedStats.cancelados}</span>
                      </div>
                    </div>

                    <div className="flex justify-between items-center text-xs font-bold pt-2 border-t border-slate-200">
                      <span>Volume Ocupado em Campo: <span className="text-blue-700">{allocatedM3} m³</span></span>
                      <span>Capacidade Total Contratada: <span>{totalCapacityM3} m³</span></span>
                      <span>Taxa de Ocupação da Planta: <span className={allocatedM3 > totalCapacityM3 * 0.85 ? 'text-red-600' : 'text-emerald-700'}>{((allocatedM3 / totalCapacityM3) * 100).toFixed(1)}%</span></span>
                    </div>
                  </div>

                  {/* SEÇÃO 2: DETALHAMENTO SEPARADO POR FÁBRICA */}
                  <div className="space-y-6 pt-2">
                    <h3 className="text-sm font-black uppercase tracking-wider text-slate-900 border-b border-slate-300 pb-2 flex items-center justify-between">
                      <span>2. Detalhamento dos Indicadores Separado por Fábrica</span>
                      <span className="text-xs font-normal text-slate-500">
                        {pdfFactoryFilter === 'ALL' ? 'Todas as Fábricas' : `Fábrica: ${pdfFactoryFilter}`}
                      </span>
                    </h3>

                    {Object.keys(requestsByFactory)
                      .filter(fName => pdfFactoryFilter === 'ALL' || fName === pdfFactoryFilter)
                      .map(fName => {
                        const factoryRequests = requestsByFactory[fName] || [];
                        const fQueue = factoryRequests.filter(r => ['Avaliação', 'Iniciado Montagem', 'Em Movimentação'].includes(r.status));
                        const fMounted = factoryRequests.filter(r => ['Montado', 'Liberado para Desmontagem'].includes(r.status));
                        const fDismantled = factoryRequests.filter(r => r.status === 'Desmontado');
                        const fVolM3 = fMounted.reduce((sum, r) => sum + ((r.realVolumeM3 !== null && r.realVolumeM3 !== undefined) ? r.realVolumeM3 : r.volumeM3), 0);

                        return (
                          <div key={fName} className="border border-slate-300 rounded-xl overflow-hidden print-page-break-inside-avoid">
                            <div className="bg-slate-800 text-white p-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                              <div className="flex items-center gap-2">
                                <span className="px-2 py-0.5 bg-blue-600 text-white rounded text-xs font-bold uppercase">FÁBRICA</span>
                                <span className="font-black text-sm uppercase tracking-wide">{fName}</span>
                              </div>
                              <div className="flex gap-4 text-xs">
                                <span>Fila: <strong>{fQueue.length}</strong></span>
                                <span>Montados: <strong>{fMounted.length} ({fVolM3} m³)</strong></span>
                                <span>Desmontados: <strong>{fDismantled.length}</strong></span>
                              </div>
                            </div>

                            {factoryRequests.length > 0 ? (
                              <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs border-collapse">
                                  <thead>
                                    <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-300 text-[10px] uppercase">
                                      <th className="p-2">ID</th>
                                      <th className="p-2">Área / Ponto Ref</th>
                                      <th className="p-2">Atividade / PEMT</th>
                                      <th className="p-2">Dimensões / Vol.</th>
                                      <th className="p-2">Responsável</th>
                                      <th className="p-2">Prev. Montagem</th>
                                      <th className="p-2">Prev. Desmontagem</th>
                                      <th className="p-2 text-right">Status</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-200">
                                    {factoryRequests.map((r) => {
                                      const hasReal = r.realVolumeM3 !== null && r.realVolumeM3 !== undefined;
                                      return (
                                        <tr key={r.id} className="hover:bg-slate-50">
                                          <td className="p-2 font-bold text-slate-900">{r.id}</td>
                                          <td className="p-2">
                                            <p className="font-semibold text-slate-800">{r.area}</p>
                                            <p className="text-[10px] text-slate-500">{r.reference}</p>
                                          </td>
                                          <td className="p-2 max-w-[180px]">
                                            <p className="font-medium text-slate-800 truncate" title={r.activityDescription}>{r.activityDescription || 'Não informada'}</p>
                                            <p className="text-[10px] text-slate-500">PEMT: <strong>{r.canUsePEMT || 'NÃO'}</strong></p>
                                          </td>
                                          <td className="p-2">
                                            {hasReal ? (
                                              <span className="font-bold text-blue-700">{r.realWidth}x{r.realLength}x{r.realHeight}m ({r.realVolumeM3} m³)</span>
                                            ) : (
                                              <span className="text-slate-600">{r.width}x{r.length}x{r.height}m ({r.volumeM3} m³)</span>
                                            )}
                                          </td>
                                          <td className="p-2">
                                            <p className="font-semibold text-slate-800">{r.responsible}</p>
                                            <p className="text-[10px] text-slate-500">{r.phone || r.email || ''}</p>
                                          </td>
                                          <td className="p-2 font-medium">{r.expectedAssemblyDate || r.dueDate || '-'}</td>
                                          <td className="p-2 text-slate-600">{r.expectedDismantleDate || '-'}</td>
                                          <td className="p-2 text-right">
                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                              r.status === 'Montado' ? 'bg-emerald-100 text-emerald-800' :
                                              r.status === 'Avaliação' ? 'bg-amber-100 text-amber-800' :
                                              r.status === 'Desmontado' ? 'bg-slate-200 text-slate-700' :
                                              'bg-blue-100 text-blue-800'
                                            }`}>
                                              {r.status}
                                            </span>
                                          </td>
                                        </tr>
                                      );
                                    })}
                                  </tbody>
                                </table>
                              </div>
                            ) : (
                              <div className="p-4 text-center text-xs text-slate-400 bg-white">
                                Nenhum andaime registrado nesta fábrica no momento.
                              </div>
                            )}
                          </div>
                        );
                      })}
                  </div>

                  <div className="pt-6 border-t border-slate-300 flex justify-between items-center text-[10px] text-slate-500">
                    <span>InspectCBM — Sistema de Gestão e Controle de Andaimes • Sincronizado via Firebase Firestore</span>
                    <span>Documento Oficial de Controle Operacional da Planta</span>
                  </div>

                </div>
              </div>
            </div>
          )}

          {/* MODAL: VISITA TÉCNICA E DIMENSÃO REAL */}
          {visitModalReqId && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-sm text-slate-800">Visita Técnica — Medição Real</h3>
                  <button onClick={() => setVisitModalReqId(null)} className="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
                </div>
                <p className="text-xs text-slate-500">Informe as dimensões conferidas no local para iniciar a montagem:</p>

                <form onSubmit={handleSaveVisit} className="space-y-3">
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[10px] text-slate-500">Largura (m)</label>
                      <input type="number" step="0.1" value={visitDimensions.width} onChange={(e) => setVisitDimensions({...visitDimensions, width: e.target.value})} required className="w-full p-2 border rounded text-xs" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500">Comprimento (m)</label>
                      <input type="number" step="0.1" value={visitDimensions.length} onChange={(e) => setVisitDimensions({...visitDimensions, length: e.target.value})} required className="w-full p-2 border rounded text-xs" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-500">Altura (m)</label>
                      <input type="number" step="0.1" value={visitDimensions.height} onChange={(e) => setVisitDimensions({...visitDimensions, height: e.target.value})} required className="w-full p-2 border rounded text-xs" />
                    </div>
                  </div>

                  <div className="p-2.5 bg-blue-50 text-blue-900 rounded text-xs font-semibold">
                    Volume Real: {((Number(visitDimensions.width) || 0) * (Number(visitDimensions.length) || 0) * (Number(visitDimensions.height) || 0)).toFixed(1)} m³
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick={() => setVisitModalReqId(null)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 bg-blue-600 text-white rounded text-xs font-bold hover:bg-blue-700">Salvar no Firebase e Iniciar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CONCLUIR MONTAGEM COM CÂMERA DO CELULAR E COMPRESSÃO DE FOTO */}
          {photoModalReq && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl p-6 max-w-md w-full space-y-4 animate-in fade-in zoom-in">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="font-bold text-base text-slate-800 flex items-center gap-2">
                      <span>📸</span> Registrar Foto e Concluir Montagem
                    </h3>
                    <p className="text-xs text-slate-500">Solicitação ID: <strong>{photoModalReq.id}</strong> — {photoModalReq.factory}</p>
                  </div>
                  <button onClick={() => { setPhotoModalReq(null); setTempPhotoUrl(null); }} className="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
                </div>

                <div className="text-xs text-slate-600 space-y-1 bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                  <p><span className="font-semibold text-slate-700">Local:</span> {photoModalReq.area} ({photoModalReq.reference})</p>
                  <p><span className="font-semibold text-slate-700">Responsável:</span> {photoModalReq.responsible}</p>
                  <p><span className="font-semibold text-slate-700">Dimensões Reais:</span> {photoModalReq.realWidth || photoModalReq.width}x{photoModalReq.realLength || photoModalReq.length}x{photoModalReq.realHeight || photoModalReq.height}m ({photoModalReq.realVolumeM3 || photoModalReq.volumeM3} m³)</p>
                </div>

                {tempPhotoUrl ? (
                  <div className="space-y-2">
                    <div className="relative rounded-xl overflow-hidden border border-slate-200 max-h-56 bg-slate-900 flex items-center justify-center">
                      <img src={tempPhotoUrl} alt="Foto Andaime Montado" className="max-h-56 w-full object-contain" />
                      <span className="absolute top-2 right-2 bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow flex items-center gap-1">
                        <span>✓</span> Foto Otimizada para Nuvem
                      </span>
                    </div>
                    <div className="flex justify-between items-center pt-1">
                      <span className="text-[11px] text-emerald-700 font-semibold flex items-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        Compressão concluída (~80KB)
                      </span>
                      <button 
                        type="button" 
                        onClick={() => setTempPhotoUrl(null)} 
                        className="text-red-600 hover:text-red-700 font-semibold underline text-xs"
                      >
                        Tirar Outra Foto
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <p className="text-xs text-slate-600 font-medium">Capture a foto do andaime montado para auditoria técnica:</p>

                    <div>
                      <input 
                        type="file" 
                        accept="image/*" 
                        capture="environment" 
                        id="camera-capture-input" 
                        className="hidden" 
                        onChange={async (e) => {
                          const file = e.target.files[0];
                          if (file) {
                            setIsCompressingPhoto(true);
                            try {
                              const compressed = await compressImage(file);
                              setTempPhotoUrl(compressed);
                            } catch (err) {
                              console.error('Erro na câmera:', err);
                              alert('Erro ao carregar foto da câmera.');
                            } finally {
                              setIsCompressingPhoto(false);
                            }
                          }
                        }} 
                      />
                      <label 
                        htmlFor="camera-capture-input" 
                        className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-98 text-white font-bold rounded-xl flex items-center justify-center gap-2 cursor-pointer shadow-md transition text-xs"
                      >
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span>{isCompressingPhoto ? 'Comprimindo foto...' : 'Tirar Foto com a Câmera do Celular'}</span>
                      </label>
                    </div>

                    <div>
                      <input 
                        type="file" 
                        accept="image/*" 
                        id="gallery-file-input" 
                        className="hidden" 
                        onChange={async (e) => {
                          const file = e.target.files[0];
                          if (file) {
                            setIsCompressingPhoto(true);
                            try {
                              const compressed = await compressImage(file);
                              setTempPhotoUrl(compressed);
                            } catch (err) {
                              console.error('Erro no arquivo:', err);
                              alert('Erro ao carregar imagem da galeria.');
                            } finally {
                              setIsCompressingPhoto(false);
                            }
                          }
                        }} 
                      />
                      <label 
                        htmlFor="gallery-file-input" 
                        className="w-full py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-98 text-slate-700 font-semibold rounded-xl flex items-center justify-center gap-2 cursor-pointer border border-slate-300 transition text-xs"
                      >
                        <svg className="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>Ou Escolher Foto da Galeria / Arquivos</span>
                      </label>
                    </div>
                  </div>
                )}

                <div className="flex flex-col sm:flex-row justify-end gap-2 pt-3 border-t border-slate-100">
                  <button 
                    type="button" 
                    onClick={() => { setPhotoModalReq(null); setTempPhotoUrl(null); }} 
                    className="px-3 py-2 border rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50 transition"
                  >
                    Cancelar
                  </button>
                  <button 
                    type="button" 
                    disabled={isSavingMontado || isCompressingPhoto}
                    onClick={async () => {
                      setIsSavingMontado(true);
                      const reqId = photoModalReq.id;
                      const updatedHistory = [
                        ...(photoModalReq.history || []),
                        { 
                          date: new Date().toLocaleString('pt-BR'), 
                          user: `${currentUser.name} (${currentUser.role})`, 
                          action: tempPhotoUrl 
                            ? 'Andaime Montado com foto auditada na nuvem' 
                            : 'Andaime Montado' 
                        }
                      ];

                      const updateData = {
                        status: 'Montado',
                        history: updatedHistory
                      };
                      if (tempPhotoUrl) {
                        updateData.photoUrl = tempPhotoUrl;
                      }

                      setRequests(prev => prev.map(r => r.id === reqId ? { ...r, ...updateData } : r));

                      try {
